# From the official docker-compose.yml in github.com/ledgersmb/ledgersmb-docker (branch 1.13).
# Left out: published ports and the default "abc" database password. All of LedgerSMB's
# data lives in PostgreSQL; the app container keeps nothing.
#
# Uses the official "-base" tag: Starman on port 5762 without the image's bundled nginx,
# which upstream offers for running behind your own reverse proxy (Cloudgate's). The
# bundled nginx also listens on [::]:80 and will not start on a host without IPv6.
#
# First run: open <address>/setup.pl, sign in with the database user "postgres" and the
# generated POSTGRES_PASSWORD, and create the company database and its first user there.

services:
  ledgersmb:
    image: ledgersmb/ledgersmb:1.13.9-base
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # Processes serving web requests. Upstream suggests 2 for a 1 GB server.
      LSMB_WORKERS: "2"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:5762/login.pl"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Upstream names this service "postgres", the host LedgerSMB connects to by default.
  postgres:
    image: postgres:15.20-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ledgersmb-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ledgersmb-pgdata:
