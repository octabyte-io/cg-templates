# Based on the compose file that Elmo's own CLI writes (`elmo init`, apps/cli/src/compose.ts at v0.7.12),
# with the .env it generates written out as environment variables.
x-elmo-env: &elmo-env
  DEPLOYMENT_MODE: local
  DEPLOYMENT_ID: ${DEPLOYMENT_ID}
  DATABASE_URL: postgres://elmo:${POSTGRES_PASSWORD}@elmo-db:5432/elmo
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  ELMO_ENCRYPTION_KEY: ${ELMO_ENCRYPTION_KEY}
  APP_URL: ${APP_URL}
  VITE_APP_URL: ${APP_URL}
  APP_NAME: Elmo
  APP_ICON: /icons/elmo-icon.svg
  VITE_APP_NAME: Elmo
  VITE_APP_ICON: /icons/elmo-icon.svg
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
  SCRAPE_TARGETS: ${SCRAPE_TARGETS}
  # Elmo sends anonymous usage data to PostHog unless this is set.
  DISABLE_TELEMETRY: "1"

services:
  elmo-web:
    image: elmohq/elmo-web:0.7.12
    restart: unless-stopped
    environment: *elmo-env
    depends_on:
      elmo-db-migrate:
        condition: service_completed_successfully

  # Reads the AI answers, judges mentions and runs the scheduled checks.
  elmo-worker:
    image: elmohq/elmo-worker:0.7.12
    restart: unless-stopped
    environment: *elmo-env
    # The worker finishes in-flight jobs for up to 30s on stop.
    stop_grace_period: 35s
    depends_on:
      elmo-db-migrate:
        condition: service_completed_successfully

  # Runs once at each start: creates or upgrades the database tables.
  elmo-db-migrate:
    image: elmohq/elmo-db-migrate:0.7.12
    restart: "no"
    environment:
      DATABASE_URL: postgres://elmo:${POSTGRES_PASSWORD}@elmo-db:5432/elmo
    depends_on:
      elmo-db:
        condition: service_healthy

  elmo-db:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: elmo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: elmo
    volumes:
      # PostgreSQL 18 keeps its data under a versioned folder inside this one.
      - elmo-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elmo -d elmo"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  elmo-db-data:
