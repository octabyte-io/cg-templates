# Based on Mastodon's official docker-compose.yml (mastodon/mastodon, tag v4.7.5),
# without Elasticsearch, Tor and the published ports, with the settings from
# .env.production.sample written out, a one-off init service for what the install
# guide does by hand, and Caddy in place of the guide's nginx.

x-mastodon-env: &mastodon-env
  LOCAL_DOMAIN: ${LOCAL_DOMAIN}
  RAILS_ENV: production
  NODE_ENV: production
  DB_HOST: mastodon-db
  DB_PORT: "5432"
  DB_NAME: mastodon_production
  DB_USER: mastodon
  DB_PASS: ${DB_PASS}
  REDIS_HOST: mastodon-redis
  REDIS_PORT: "6379"
  ES_ENABLED: "false"
  SECRET_KEY_BASE: ${SECRET_KEY_BASE}
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}
  SMTP_SERVER: ${SMTP_SERVER}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_LOGIN: ${SMTP_LOGIN}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
  S3_ENABLED: "false"
  IP_RETENTION_PERIOD: "31556952"
  SESSION_RETENTION_PERIOD: "31556952"

services:
  # Caddy gets the web address: /api/v1/streaming goes to the streaming server,
  # everything else to Puma (Mastodon's nginx does the same).
  mastodon:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    volumes:
      - ../files/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - mastodon-web
      - mastodon-streaming

  # Runs at each start: makes the web push keys and the owner account on the
  # first start, and creates or migrates the database.
  mastodon-init:
    image: ghcr.io/mastodon/mastodon:v4.7.5
    restart: on-failure
    # Root only to write the web push keys into their new volume.
    user: root
    command:
      - sh
      - -c
      - |
        # Runs once at each start, before web and Sidekiq. Mastodon's install guide
        # does these steps by hand (rails mastodon:setup); here they run on their own.
        set -eu

        # 1. Web push keys. They are EC keys, which Cloudgate cannot generate, so the
        #    first start makes them with Mastodon's own task and keeps them in a volume.
        if [ ! -s /vapid/vapid.env ]; then
          bundle exec rails mastodon:webpush:generate_vapid_key | grep "^VAPID_" > /vapid/vapid.env.tmp
          mv /vapid/vapid.env.tmp /vapid/vapid.env
          echo "Made the web push (VAPID) keys."
        fi
        chmod 644 /vapid/vapid.env
        set -a; . /vapid/vapid.env; set +a

        # 2. Database: created and seeded on the first start, migrated after an update.
        bundle exec rails db:prepare

        # 3. The owner account, made once with the email and password from setup,
        #    confirmed and approved, the way rails mastodon:setup makes it.
        bundle exec rails runner '
          username = ENV.fetch("ADMIN_USERNAME")
          email = ENV.fetch("ADMIN_EMAIL")
          if User.exists?(email: email) || Account.find_local(username)
            puts "The owner account already exists."
          else
            user = User.new(email: email, password: ENV.fetch("ADMIN_PASSWORD"),
                            confirmed_at: Time.now.utc, account_attributes: { username: username },
                            bypass_registration_checks: true, role: UserRole.find_by(name: "Owner"))
            user.save(validate: false)
            user.approve!
            Setting.site_contact_username = username
            Setting.site_contact_email = email
            puts "Made the owner account @#{username}."
          end
        '
    environment:
      <<: *mastodon-env
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - mastodon-vapid:/vapid
    depends_on:
      mastodon-db:
        condition: service_healthy
      mastodon-redis:
        condition: service_healthy

  mastodon-web:
    image: ghcr.io/mastodon/mastodon:v4.7.5
    restart: unless-stopped
    command: sh -c 'set -a; . /vapid/vapid.env; set +a; exec bundle exec puma -C config/puma.rb'
    environment: *mastodon-env
    volumes:
      - mastodon-system:/mastodon/public/system
      - mastodon-vapid:/vapid:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s --noproxy localhost localhost:3000/health | grep -q 'OK' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 1m
    depends_on:
      mastodon-init:
        condition: service_completed_successfully

  mastodon-streaming:
    image: ghcr.io/mastodon/mastodon-streaming:v4.7.5
    restart: unless-stopped
    command: node ./streaming/index.js
    environment: *mastodon-env
    healthcheck:
      test: ["CMD-SHELL", "curl -s --noproxy localhost localhost:4000/api/v1/streaming/health | grep -q 'OK' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    depends_on:
      mastodon-init:
        condition: service_completed_successfully

  mastodon-sidekiq:
    image: ghcr.io/mastodon/mastodon:v4.7.5
    restart: unless-stopped
    command: sh -c 'set -a; . /vapid/vapid.env; set +a; exec bundle exec sidekiq'
    environment: *mastodon-env
    volumes:
      - mastodon-system:/mastodon/public/system
      - mastodon-vapid:/vapid:ro
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[s]idekiq\\ 8' || false"]
      interval: 30s
      timeout: 5s
      retries: 10
    depends_on:
      mastodon-init:
        condition: service_completed_successfully

  mastodon-db:
    image: postgres:17.12-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: mastodon
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: mastodon_production
    volumes:
      - mastodon-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastodon -d mastodon_production"]
      interval: 10s
      timeout: 5s
      retries: 10

  mastodon-redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    volumes:
      - mastodon-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mastodon-system:
  mastodon-vapid:
  mastodon-db-data:
  mastodon-redis-data:
