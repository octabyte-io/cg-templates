services:
  castopod:
    image: castopod/castopod:1.15.6
    restart: unless-stopped
    depends_on:
      castopod-db:
        condition: service_healthy
      castopod-redis:
        condition: service_started
    environment:
      CP_BASEURL: ${BASE_URL}
      # Hashes listener IPs for the podcast analytics; keep it the same for the life of the install.
      CP_ANALYTICS_SALT: ${ANALYTICS_SALT}
      CP_DATABASE_HOSTNAME: castopod-db
      CP_DATABASE_NAME: castopod
      CP_DATABASE_USERNAME: castopod
      CP_DATABASE_PASSWORD: ${DB_PASSWORD}
      CP_CACHE_HANDLER: redis
      CP_REDIS_HOST: castopod-redis
      CP_REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      # Uploaded audio, cover art and other media.
      - castopod-media:/app/public/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Database migrations run at start.
      start_period: 60s

  castopod-db:
    image: mariadb:11.8.9
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: castopod
      MARIADB_USER: castopod
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: 1
      MARIADB_DISABLE_UPGRADE_BACKUP: 1
    volumes:
      - castopod-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  castopod-redis:
    image: redis:8.4.8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - castopod-cache:/data

volumes:
  castopod-media:
  castopod-db-data:
  castopod-cache:
