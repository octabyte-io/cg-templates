# Based on the official docker/docker-compose.yml. The settings its config.toml
# holds are passed as WHATOMATE_<SECTION>__<KEY> environment variables instead;
# `-config ""` tells Whatomate not to look for a config file (the image has none).
services:
  whatomate:
    image: shridh0r/whatomate:0.1.1-beta-0.17
    restart: unless-stopped
    command: ["server", "-migrate", "-config", ""]
    depends_on:
      whatomate-db:
        condition: service_healthy
      whatomate-redis:
        condition: service_healthy
    environment:
      TZ: ${TIMEZONE:-Etc/UTC}
      WHATOMATE_APP__ENVIRONMENT: production
      WHATOMATE_APP__DEBUG: "false"
      WHATOMATE_APP__ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      WHATOMATE_SERVER__ALLOWED_ORIGINS: ${APP_URL}
      WHATOMATE_DATABASE__HOST: whatomate-db
      WHATOMATE_DATABASE__USER: whatomate
      WHATOMATE_DATABASE__PASSWORD: ${POSTGRES_PASSWORD}
      WHATOMATE_DATABASE__NAME: whatomate
      WHATOMATE_REDIS__HOST: whatomate-redis
      WHATOMATE_JWT__SECRET: ${JWT_SECRET}
      WHATOMATE_WHATSAPP__WEBHOOK_VERIFY_TOKEN: ${WEBHOOK_VERIFY_TOKEN}
      WHATOMATE_RATE_LIMIT__ENABLED: "true"
      WHATOMATE_RATE_LIMIT__TRUST_PROXY: "true"
      # Only used on the first start, to create the first admin account.
      WHATOMATE_DEFAULT_ADMIN__EMAIL: ${ADMIN_EMAIL}
      WHATOMATE_DEFAULT_ADMIN__PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - whatomate-uploads:/app/uploads
      - whatomate-audio:/app/audio

  whatomate-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: whatomate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: whatomate
    volumes:
      - whatomate-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatomate -d whatomate"]
      interval: 10s
      timeout: 5s
      retries: 6

  whatomate-redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    volumes:
      - whatomate-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  whatomate-uploads:
  whatomate-audio:
  whatomate-db-data:
  whatomate-redis-data:
