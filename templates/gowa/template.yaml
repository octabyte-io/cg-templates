name: GOWA
description: "Self-hosted GOWA is a free, unofficial WhatsApp API in one small program, with webhooks, scheduled sends and an MCP server. WhatsApp can ban the number."
version: "v9.9.0"
tags:
  - self-hosted whatsapp api
  - whatsapp business api alternative
  - whatsapp rest api
  - whatsapp gateway
  - whatsapp webhook
  - whatsapp mcp server
  - gowa whatsapp
links:
  website: https://github.com/aldinokemal/go-whatsapp-web-multidevice
  docs: https://github.com/aldinokemal/go-whatsapp-web-multidevice#readme
  source: https://github.com/aldinokemal/go-whatsapp-web-multidevice
cloudgate: "0.3.11"
compose: app
size: xsmall
inputs:
  GOWA_URL: { value: "{{domains.gowa.url}}" }
  GOWA_USERNAME:
    ask:
      label: Username
      description: The name you sign in to the GOWA dashboard and API with. Cloudgate creates a strong password for it, shown afterwards on the app's variables page.
      default: admin
      pattern: "[a-z][a-z0-9_-]{2,31}"
  GOWA_PASSWORD: { generate: password }
  WEBHOOK_SECRET: { generate: hex }
signIn:
  username: GOWA_USERNAME
  password: GOWA_PASSWORD
domains:
  - { service: gowa, port: 3000 }
