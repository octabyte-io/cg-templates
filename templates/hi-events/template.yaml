name: Hi.Events
description: "Hi.Events is self-hosted, open-source event ticketing: event pages, ticket sales paid into your own Stripe account, and check-in at the door."
version: "2.2.0"
tags: [event ticketing, eventbrite alternative, sell tickets online, event management, event check-in, ticket tailor alternative]
links:
  website: https://hi.events
  docs: https://hi.events/docs
  source: https://github.com/HiEventsDev/Hi.Events
cloudgate: 0.1.0
compose: app
size: medium
inputs:
  APP_URL: { value: "{{domains.hi-events.url}}" }
  APP_KEY: { generate: base64 }
  JWT_SECRET: { generate: base64 }
  DB_PASSWORD: { generate: password }
  MAIL_FROM_ADDRESS:
    ask:
      label: Send emails from (optional)
      description: The address tickets, order confirmations and invitations come from. Leave the email questions empty to add them later on the app's variables page.
      format: email
      required: false
  MAIL_HOST:
    ask:
      label: Email server (SMTP host, optional)
      description: From your email sending service, for example smtp.postmarkapp.com or email-smtp.eu-west-1.amazonaws.com. Needed to send tickets and password resets.
      required: false
  MAIL_PORT:
    ask:
      label: Email server port
      description: 587 works with most email services.
      default: "587"
      format: number
      required: false
  MAIL_USERNAME:
    ask:
      label: Email server username (optional)
      required: false
  MAIL_PASSWORD:
    ask:
      label: Email server password (optional)
      secret: true
      required: false
  STRIPE_PUBLIC_KEY:
    ask:
      label: Stripe publishable key (optional)
      description: Needed only to sell paid tickets by card. Starts with pk_. Free events and offline payments work without Stripe; you can add the keys later.
      required: false
  STRIPE_SECRET_KEY:
    ask:
      label: Stripe secret key (optional)
      description: Starts with sk_. From the same Stripe account, under Developers > API keys.
      secret: true
      required: false
  STRIPE_WEBHOOK_SECRET:
    ask:
      label: Stripe webhook signing secret (optional)
      description: Starts with whsec_. Add a webhook in Stripe pointing to your app's address followed by /api/public/webhooks/stripe.
      secret: true
      required: false
domains:
  - { service: hi-events, port: 80 }
