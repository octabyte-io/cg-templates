name: Gancio
description: "Gancio is a self-hosted community event calendar, an alternative to Facebook Events, where anyone can post local events and others follow them."
version: "1.28.2"
tags: [community calendar, facebook events alternative, meetup alternative, shared event agenda, local events calendar, fediverse events, embed events calendar]
links:
  website: https://gancio.org
  docs: https://gancio.org/install/docker
  source: https://framagit.org/les/gancio
cloudgate: "0.3.11"
compose: app
size: small
signIn:
  firstVisit:
    path: /
    note: "Fill in the setup page, then copy the admin login and password it shows; the password is shown only once."
domains:
  - { service: gancio, port: 13120 }
