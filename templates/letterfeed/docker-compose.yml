services:
  letterfeed-backend:
    image: ghcr.io/leonmuscoden/letterfeed-backend:0.5.3
    restart: unless-stopped
    environment:
      LETTERFEED_APP_BASE_URL: ${APP_URL}
      LETTERFEED_DATABASE_URL: sqlite:////data/letterfeed.db
      LETTERFEED_SECRET_KEY: ${SECRET_KEY}
      # Sign-in for the web app. Without these, anyone with the address could use it.
      LETTERFEED_AUTH_USERNAME: admin
      LETTERFEED_AUTH_PASSWORD: ${ADMIN_PASSWORD}
      # The mailbox LetterFeed reads newsletters from (IMAP over SSL, port 993).
      # Set here, these are shown locked in the app's settings page.
      LETTERFEED_IMAP_SERVER: ${IMAP_SERVER}
      LETTERFEED_IMAP_USERNAME: ${IMAP_USERNAME}
      LETTERFEED_IMAP_PASSWORD: ${IMAP_PASSWORD}
    volumes:
      - letterfeed-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  letterfeed:
    image: ghcr.io/leonmuscoden/letterfeed-frontend:0.5.3
    restart: unless-stopped
    environment:
      LETTERFEED_BACKEND_URL: http://letterfeed-backend:8000
    depends_on:
      letterfeed-backend:
        condition: service_healthy

volumes:
  letterfeed-data:
