name: AdventureLog
description: "AdventureLog is a self-hosted travel tracker: log the places you visit, plan trips day by day and see the countries you've been to on a world map."
version: "0.13.1"
tags: [travel tracker, trip planner, travel journal, visited countries map, polarsteps alternative, wanderlog alternative]
links:
  website: https://adventurelog.app
  docs: https://adventurelog.app/docs/intro/adventurelog_overview.html
  source: https://github.com/seanmorley15/AdventureLog
cloudgate: "0.3.11"
compose: app
# The first start downloads world country and region data, which needs about 2 GB of memory.
size: medium
inputs:
  SITE_URL: { value: "{{domains.adventurelog.url}}" }
  POSTGRES_PASSWORD: { generate: password }
  SECRET_KEY: { generate: hex }
  ADMIN_PASSWORD: { generate: password }
  ADMIN_EMAIL:
    ask:
      label: Admin email
      description: The email of the admin account, whose username is admin. Cloudgate creates a strong password for it, shown afterwards on the app's variables page.
      format: email
signIn:
  username: { value: admin }
  password: ADMIN_PASSWORD
domains:
  - { service: adventurelog, port: 80 }
