# From AdventureLog's official docker-compose.yml (v0.13.1, "Standard Deployment"): one image
# runs the web app, the API and nginx on port 80, next to a PostGIS database.
services:
  adventurelog:
    image: ghcr.io/seanmorley15/adventurelog:v0.13.1
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL}
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: adventurelog-db
      POSTGRES_DB: adventurelog
      POSTGRES_USER: adventurelog
      DJANGO_ADMIN_USERNAME: admin
      DJANGO_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DJANGO_ADMIN_EMAIL: ${ADMIN_EMAIL}
      DISABLE_REGISTRATION: "False"
      GUNICORN_WORKERS: "2"
    volumes:
      - adventurelog-media:/code/media/
    depends_on:
      adventurelog-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s

  adventurelog-db:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: adventurelog
      POSTGRES_USER: adventurelog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - adventurelog-db-data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adventurelog -d adventurelog"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  adventurelog-media:
  adventurelog-db-data:
