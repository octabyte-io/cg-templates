# Indico's settings, from indico-containers (indico-prod/indico.conf). The file
# is Python; every value that differs per install comes from the container's
# environment, which docker-compose.yml fills in from template.yaml.
import os

env = os.environ.get

SQLALCHEMY_DATABASE_URI = f'postgresql://{env("PGUSER")}:{env("PGPASSWORD")}@{env("PGHOST")}:5432/{env("PGDATABASE")}'
SECRET_KEY = env('INDICO_SECRET_KEY')
BASE_URL = env('INDICO_BASE_URL').rstrip('/')
# Cloudgate's proxy sets X-Forwarded-Host and X-Forwarded-Proto.
USE_PROXY = True

# Each event, category and user has its own time zone; this is the default.
DEFAULT_TIMEZONE = 'UTC'
DEFAULT_LOCALE = 'en_GB'

REDIS_CACHE_URL = 'redis://indico-redis:6379/0'
CELERY_BROKER = 'redis://indico-redis:6379/1'

# Email. SUPPORT_EMAIL is shown to users as the contact; emails are sent from
# NO_REPLY_EMAIL (or SUPPORT_EMAIL when no sender address was given).
SUPPORT_EMAIL = env('INDICO_SUPPORT_EMAIL')
NO_REPLY_EMAIL = env('INDICO_MAIL_FROM') or SUPPORT_EMAIL
SMTP_SERVER = (env('INDICO_SMTP_HOST') or 'localhost', int(env('INDICO_SMTP_PORT') or 25))
SMTP_LOGIN = env('INDICO_SMTP_USERNAME') or None
SMTP_PASSWORD = env('INDICO_SMTP_PASSWORD') or None
SMTP_USE_SSL = SMTP_SERVER[1] == 465
SMTP_USE_TLS = SMTP_SERVER[1] == 587

ENABLE_ROOMBOOKING = True

LOG_DIR = '/opt/indico/log'
TEMP_DIR = '/opt/indico/tmp'
CACHE_DIR = '/opt/indico/cache'
CUSTOMIZATION_DIR = '/opt/indico/custom'

STORAGE_BACKENDS = {'default': 'fs:/opt/indico/archive'}
ATTACHMENT_STORAGE = 'default'

# Plugins from the indico-plugins package in the image: the official setup's
# list, plus PayPal and Stripe payments (each needs the organiser's own account
# keys, entered in Indico's administration).
PLUGINS = {'previewer_code', 'vc_zoom', 'payment_manual', 'payment_paypal', 'payment_stripe'}

del os, env
