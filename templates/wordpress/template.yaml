name: WordPress
description: "Self-hosted WordPress, the open-source Wix and Squarespace alternative: build a website, blog or online shop with themes and thousands of plugins."
version: "7.1.4"
tags: [website builder, blog, cms, wordpress hosting, online shop, wix alternative]
links:
  website: https://wordpress.org
  docs: https://wordpress.org/documentation/
  source: https://github.com/WordPress/WordPress
cloudgate: 0.1.0
compose: app
size: small
inputs:
  DB_PASSWORD: { generate: password }
  DB_ROOT_PASSWORD: { generate: password }
domains:
  - { service: wordpress, port: 80 }
files:
  - { path: uploads.ini }
