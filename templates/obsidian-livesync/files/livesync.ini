; CouchDB settings for Self-hosted LiveSync, from the project's own
; docker/config/livesync.ini and docker/scripts/couchdb-init.sh
; (github.com/vrtmrz/obsidian-livesync, main branch).
; Copied into /opt/couchdb/etc/default.d/ at every start, so changes made
; later in CouchDB's admin pages (saved in local.d/docker.ini) still win.

[couchdb]
; Run as one node: CouchDB creates its system databases on first start.
single_node = true
; Largest document: 50 MB, enough for attachments.
max_document_size = 50000000

[chttpd]
bind_address = 0.0.0.0
port = 5984
; Largest request: 4 GB, for very large vaults.
max_http_request_size = 4294967296
; Every request needs a user name and password.
require_valid_user = true
enable_cors = true

[chttpd_auth]
require_valid_user = true

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
; The origins Obsidian uses on desktop and mobile.
credentials = true
origins = app://obsidian.md,capacitor://localhost,http://localhost

[log]
level = warning
