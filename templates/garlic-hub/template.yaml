name: Garlic-Hub
description: "Garlic-Hub is self-hosted, open-source digital signage: build playlists, screen zones and schedules, and play them on free players or SMIL screens."
version: "1.2.0"
tags: [digital signage, open source digital signage, free digital signage software, raspberry pi digital signage, smil digital signage, yodeck alternative]
links:
  website: https://garlic-signage.com/garlic-hub/
  docs: https://garlic-signage.com/garlic-hub/docs/
  source: https://github.com/garlic-signage/garlic-hub
cloudgate: 0.1.0
compose: app
size: small
inputs:
  APP_SECRET: { generate: hex }
domains:
  - { service: garlic-hub, port: 80 }
