name: TimeTracker
description: "TimeTracker is self-hosted time tracking with timers, projects, timesheets, expenses and PDF invoices, replacing Harvest and Toggl Track."
version: "5.20.0"
tags: [time tracking, harvest alternative, toggl alternative, timesheets, invoicing, billable hours, expense tracking]
links:
  website: https://timetracker.drytrix.com
  docs: https://github.com/DRYTRIX/TimeTracker/tree/main/docs
  source: https://github.com/DRYTRIX/TimeTracker
cloudgate: "0.3.11"
compose: app
size: medium
inputs:
  APP_URL: { value: "{{domains.timetracker.url}}" }
  SECRET_KEY: { generate: hex }
  SETTINGS_ENCRYPTION_KEY: { generate: base64 }
  DB_PASSWORD: { generate: password }
signIn:
  firstVisit:
    path: /
    note: "Sign in with the username admin and type the password you want to use; it becomes the admin password."
domains:
  - { service: timetracker, port: 8080 }
