# From the official docker-compose.yml (rmyndharis/OpenWA v0.30.3), reduced to
# the openwa-api service on its first-run defaults: SQLite and local storage
# in the data volume. Left out: the host port, the Docker socket proxy (it
# only serves the dashboard's optional "built-in datastore" toggles, which
# start extra containers through the Docker API) and the optional Postgres,
# Redis and MinIO profiles.
services:
  openwa:
    image: ghcr.io/rmyndharis/openwa:0.30.3
    restart: unless-stopped
    # Room for the ordered shutdown (Chromium, usage flush, database close).
    stop_grace_period: 75s
    # The official hardening: Chromium runs with --no-sandbox, so the
    # container is the confinement boundary. The entrypoint chowns the data
    # volume and drops to the openwa user with gosu.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 2048
    environment:
      NODE_ENV: production
      TZ: UTC
      PORT: "2785"
      # Chromium's writes go to the tmpfs, not the read-only root.
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache
      PUPPETEER_EXECUTABLE_PATH: /usr/local/bin/puppeteer-chrome
      LOG_LEVEL: info
      # The admin API key: sign in to the dashboard with it and send it as
      # the X-API-Key header. Seeded on the first boot only; later keys are
      # made in the dashboard.
      API_MASTER_KEY: ${API_MASTER_KEY}
      # The app's public address (startup banner, links) and the only
      # browser origin allowed to call the API.
      BASE_URL: ${OPENWA_URL}
      DASHBOARD_URL: ${OPENWA_URL}
      CORS_ORIGINS: ${OPENWA_URL}
      PLUGINS_DIR: /app/data/plugins
    volumes:
      # Database (SQLite), WhatsApp sessions (the linked-device login),
      # media and generated config.
      - openwa-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2785/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  openwa-data:
