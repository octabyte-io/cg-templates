# From Beszel's official hub compose file (supplemental/docker/hub/docker-compose.yml
# at v0.21.2). Only the hub (the web app) runs here. The agent that collects a
# server's numbers is installed on each server you want to watch, using the
# command the hub shows under "Add system"; it is left out because it needs host
# networking and the Docker socket. Agents reach the hub over its web address.
services:
  beszel:
    image: henrygd/beszel:0.21.2
    restart: unless-stopped
    environment:
      # The hub's own address, used for links in alerts and the agent install command.
      APP_URL: ${APP_URL}
    volumes:
      - beszel-data:/beszel_data
    healthcheck:
      # The image is built FROM scratch, so it has no shell, curl or wget; the
      # binary has its own health command (as in the official compose file).
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 30s
      start_period: 10s
      timeout: 5s
      retries: 5

volumes:
  beszel-data:
