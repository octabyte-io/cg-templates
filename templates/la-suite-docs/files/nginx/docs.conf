# From Docs' docker/files/production/etc/nginx/conf.d/default.conf.template at
# v6.1.0, with the stack's own service names. Changes: the object storage is
# reached inside the stack over plain http (it has no web address of its own),
# the backend is told the visit came over https (Cloudgate serves the app on
# https only), and a second server on 8084, reachable only inside the stack,
# lets the collaboration and conversion servers call the backend's API without
# going out to the internet and back.

upstream docs_backend {
    server docs-backend:8000 fail_timeout=0;
}

upstream docs_frontend {
    server 127.0.0.1:3000 fail_timeout=0;
}

server {
    listen 8083;
    server_name localhost;
    charset utf-8;

    # increase max upload size
    client_max_body_size 10m;

    # Disables server version feedback on pages and in headers
    server_tokens off;

    location @proxy_to_docs_backend {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_redirect off;
        proxy_pass http://docs_backend;
    }

    location @proxy_to_docs_frontend {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_redirect off;
        proxy_pass http://docs_frontend;
    }

    location / {
        try_files $uri @proxy_to_docs_frontend;
    }

    location /api {
        try_files $uri @proxy_to_docs_backend;
    }

    location /admin {
        try_files $uri @proxy_to_docs_backend;
    }

    location /external_api {
        try_files $uri @proxy_to_docs_backend;
    }

    location /static {
        try_files $uri @proxy_to_docs_backend;
    }

    # Collaboration server. Only the routes below are published: it also serves
    # create-ydoc, reset-connections, migrate, restore-ydoc and reset-ydoc,
    # which the backend calls inside the stack and which must not be reachable
    # from the outside.
    location /collaboration/ws/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_pass http://docs-yhub:3002;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Origin $http_origin;
        proxy_set_header Host $host;
    }

    location ~ ^/collaboration/(ydoc|rollback|prune|changeset|activity|jwks)/ {
        proxy_pass http://docs-yhub:3002;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Origin $http_origin;
        proxy_set_header Host $host;
    }

    # Files in documents: the backend checks the visitor may see the file and
    # signs the request, then the file is read from the object storage.
    location /media/ {
        auth_request /media-auth;
        auth_request_set $authHeader $upstream_http_authorization;
        auth_request_set $authDate $upstream_http_x_amz_date;
        auth_request_set $authContentSha256 $upstream_http_x_amz_content_sha256;

        proxy_set_header Authorization $authHeader;
        proxy_set_header X-Amz-Date $authDate;
        proxy_set_header X-Amz-Content-SHA256 $authContentSha256;

        proxy_pass http://docs-s3:9000/docs-media-storage/;
        proxy_set_header Host docs-s3:9000;

        add_header Content-Security-Policy "default-src 'none'" always;
    }

    location /media-auth {
        proxy_pass http://docs_backend/api/v1.0/documents/media-auth/;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Original-URL $request_uri;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;
    }
}

# Inside the stack only (no web address points here): the backend's API, for
# the collaboration server (docs-yhub) and the conversion server
# (docs-y-provider), with the app's own host name so the backend accepts it.
server {
    listen 8084;
    server_name localhost;
    server_tokens off;

    location /api/ {
        proxy_set_header Host {{domains.docs.host}};
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_pass http://docs_backend;
    }

    location / {
        return 404;
    }
}
