name: LaraPaper
description: "LaraPaper is a self-hosted TRMNL server for TRMNL and compatible e-ink displays: manage your devices and pick the recipes and screens each one shows."
version: "0.47.0"
tags: [trmnl alternative, trmnl byos, self-hosted trmnl server, e-ink dashboard, trmnl recipes, kindle dashboard]
links:
  website: https://usetrmnl.github.io/larapaper/
  docs: https://usetrmnl.github.io/larapaper/
  source: https://github.com/usetrmnl/larapaper
cloudgate: "0.3.11"
compose: app
size: small
inputs:
  APP_URL: { value: "{{domains.larapaper.url}}" }
  # Laravel's APP_KEY (32 random bytes, base64); the compose file adds the "base64:" prefix.
  APP_KEY: { generate: base64 }
signIn:
  firstVisit:
    path: /register
    note: "Register your account; the first account is yours and sign-up then closes."
domains:
  - { service: larapaper, port: 8080 }
