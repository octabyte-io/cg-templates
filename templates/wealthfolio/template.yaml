name: Wealthfolio
description: "Self-hosted Wealthfolio tracks your investments, returns, dividends, net worth and spending in one private dashboard on your own server."
version: "3.13.0"
tags: [portfolio tracker, net worth tracker, investment tracker, dividend tracker, sharesight alternative, empower alternative, kubera alternative]
links:
  website: https://wealthfolio.app
  docs: https://wealthfolio.app/docs/guide/self-hosting/docker
  source: https://github.com/wealthfolio/wealthfolio
cloudgate: 0.1.0
compose: app
size: xsmall
inputs:
  # The password the Wealthfolio sign-in page asks for (there is no username).
  ADMIN_PASSWORD: { generate: password }
  # Encrypts saved secrets (such as API keys) and signs sign-in sessions.
  WF_SECRET_KEY: { generate: base64 }
  APP_URL: { value: "{{domains.wealthfolio.url}}" }
signIn:
  password: ADMIN_PASSWORD
domains:
  - { service: wealthfolio, port: 8088 }
