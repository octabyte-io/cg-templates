services:
  yourls:
    image: yourls:1.10.6-apache
    restart: unless-stopped
    depends_on:
      yourls-db:
        condition: service_healthy
    environment:
      YOURLS_SITE: ${YOURLS_SITE}
      YOURLS_USER: ${YOURLS_USER}
      YOURLS_PASS: ${YOURLS_PASS}
      # Fixed so sign-ins survive a container being recreated.
      YOURLS_COOKIEKEY: ${YOURLS_COOKIEKEY}
      YOURLS_DB_HOST: yourls-db
      YOURLS_DB_USER: yourls
      YOURLS_DB_PASS: ${DB_PASSWORD}
      YOURLS_DB_NAME: yourls
    volumes:
      # Plugins installed or turned on by the admin. The rest of YOURLS comes from the image,
      # so updating the image tag updates the app; links and stats live in the database.
      - yourls-plugins:/var/www/html/user/plugins
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/admin/install.php"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  yourls-db:
    image: mariadb:11.8.9
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: yourls
      MARIADB_USER: yourls
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: 1
      MARIADB_DISABLE_UPGRADE_BACKUP: 1
      MARIADB_INITDB_SKIP_TZINFO: 1
    volumes:
      - yourls-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  yourls-plugins:
  yourls-db-data:
