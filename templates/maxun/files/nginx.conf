# One address for Maxun, as in the project's docs/nginx.conf: API routes and the
# websocket go to the backend, stored screenshots to MinIO, the rest to the web app.
server {
    listen 80;
    server_name _;
    client_max_body_size 512M;

    location ~ ^/(auth|storage|record|workflow|robot|proxy|api-docs|api|webhook|socket\.io)(/|$) {
        proxy_pass http://maxun-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Screenshots a robot takes; the backend links to them under this path.
    location /files/ {
        proxy_pass http://maxun-minio:9000/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://maxun-frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
