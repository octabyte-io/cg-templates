name: Rallly
description: "Self-hosted Rallly, an open-source Doodle alternative: share a meeting poll, let people vote on times without an account, and pick the best date."
version: "4.17.0"
tags: [doodle alternative, meeting poll, scheduling poll, group scheduling, availability poll, find a meeting time]
links:
  website: https://rallly.co
  docs: https://support.rallly.co/self-hosting/introduction
  source: https://github.com/lukevella/rallly
cloudgate: 0.1.0
compose: app
size: medium
inputs:
  NEXT_PUBLIC_BASE_URL: { value: "{{domains.rallly.url}}" }
  # Rallly requires at least 32 characters; a generated password is 32.
  SECRET_PASSWORD: { generate: password }
  POSTGRES_PASSWORD: { generate: password }
  S3_ACCESS_KEY_ID: { generate: password }
  S3_SECRET_ACCESS_KEY: { generate: hex }
  # Garage wants 32 bytes as 64 hex characters.
  GARAGE_RPC_SECRET: { generate: hex }
  ADMIN_EMAIL:
    ask:
      label: Admin email
      description: The email you sign in with to become Rallly's administrator. It is also shown to people as the support address.
      format: email
  NOREPLY_EMAIL:
    ask:
      label: Sender email (optional)
      description: The address sign-in codes and notifications are sent from. Leave it empty to send from the admin email.
      format: email
      required: false
  SMTP_HOST:
    ask:
      label: Email server (SMTP host)
      description: Rallly signs people in with a code sent by email, so it needs an email sending service, for example smtp.resend.com or email-smtp.eu-west-1.amazonaws.com. You can add it later on the app's variables page.
      required: false
  SMTP_PORT:
    ask:
      label: Email server port
      description: 587 works with most email services.
      default: "587"
      format: number
      required: false
  SMTP_USER:
    ask:
      label: Email server username
      required: false
  SMTP_PWD:
    ask:
      label: Email server password
      secret: true
      required: false
  SMTP_SECURE:
    ask:
      label: Use implicit TLS
      description: "true only for port 465; false for port 587 (STARTTLS) or 25."
      default: "false"
      pattern: "true|false"
      required: false
domains:
  - { service: rallly, port: 3000 }
files:
  - { path: garage/garage.toml }
