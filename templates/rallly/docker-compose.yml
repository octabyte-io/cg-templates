# From lukevella/rallly-selfhosted's docker-compose.yml, without its Traefik
# proxy (Cloudgate routes the web address).
services:
  rallly:
    image: lukevella/rallly:4.17.0
    restart: unless-stopped
    depends_on:
      rallly-db:
        condition: service_healthy
      rallly-garage:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      SECRET_PASSWORD: ${SECRET_PASSWORD}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@rallly-db:5432/rallly
      INITIAL_ADMIN_EMAIL: ${ADMIN_EMAIL}
      SUPPORT_EMAIL: ${ADMIN_EMAIL}
      NOREPLY_EMAIL: ${NOREPLY_EMAIL:-${ADMIN_EMAIL}}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PWD: ${SMTP_PWD}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      S3_ENDPOINT: http://rallly-garage:3900
      S3_BUCKET_NAME: rallly
      S3_REGION: garage
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}

  rallly-db:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rallly
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql.
      - rallly-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # S3-compatible store for uploaded images (profile pictures, branding).
  rallly-garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    command: [/garage, server, --single-node, --default-bucket]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
      GARAGE_DEFAULT_BUCKET: rallly
    volumes:
      - ../files/garage/garage.toml:/etc/garage.toml:ro
      - rallly-garage-meta:/var/lib/garage/meta
      - rallly-garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "stats", "-a"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 5s

volumes:
  rallly-db-data:
  rallly-garage-meta:
  rallly-garage-data:
