# SurveyKing, from the official Docker Compose setup (surveyking.cn/surveyking-docker/setup.sh,
# linked from surveyking.cn/en/open-source/deploy/docker-compose-deploy/): SurveyKing with
# MySQL 8.0, the database its docs recommend for production. Changes from it: no host ports,
# pinned images, MySQL in UTC instead of +8:00, and named volumes for config and data.
#
# On the first visit SurveyKing opens its /setup page. Pick "MySQL Database" and the
# Docker Compose option: the connection below is filled in from this file. Setup creates
# the tables, then SurveyKing restarts and shows the sign-in page.
services:
  surveyking:
    image: surveyking/surveyking:v1.13.2
    restart: unless-stopped
    depends_on:
      surveyking-db:
        condition: service_healthy
    environment:
      PROFILE: mysql
      MYSQL_USER: surveyking
      MYSQL_PASS: ${MYSQL_PASSWORD}
      DB_URL: jdbc:mysql://surveyking-db:3306/surveyking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true
      TZ: ${TIMEZONE:-Etc/UTC}
      JAVA_OPTS: "-Xms256m -Xmx1g -Dfile.encoding=UTF-8"
    volumes:
      # config/application.properties, written by the /setup page; it marks the
      # system as set up, so it must outlive the container.
      - surveyking-config:/app/config
      # Uploaded images and attachments.
      - surveyking-files:/app/files
      # The built-in H2 database, used only if H2 is picked on the /setup page.
      - surveyking-h2:/app/db
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:1991/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  surveyking-db:
    image: mysql:8.0.46
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: surveyking
      MYSQL_USER: surveyking
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - surveyking-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -usurveyking -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' surveyking"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  surveyking-config:
  surveyking-files:
  surveyking-h2:
  surveyking-db-data:
