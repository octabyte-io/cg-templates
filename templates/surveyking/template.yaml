name: SurveyKing
description: "Build surveys, forms, exams and quizzes with logic and scoring, share them by link or QR code, and see the results in live reports."
version: "1.13.2"
tags: [online survey, form builder, online exam, quiz maker, surveymonkey alternative]
links:
  website: https://surveyking.cn/en/
  docs: https://surveyking.cn/en/open-source/deploy/
  source: https://github.com/javahuang/SurveyKing
cloudgate: 0.1.0
compose: app
# SurveyKing (Java) and MySQL 8 on one server; the docs ask for at least 2 GB.
size: medium
inputs:
  MYSQL_PASSWORD: { generate: password }
  MYSQL_ROOT_PASSWORD: { generate: password }
  TIMEZONE:
    ask:
      label: Time zone
      description: Used for survey schedules and the times shown on responses, as an IANA name such as Europe/Berlin.
      default: Etc/UTC
      required: false
domains:
  - { service: surveyking, port: 1991 }
