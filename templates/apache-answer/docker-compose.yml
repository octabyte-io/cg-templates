services:
  answer:
    image: apache/answer:2.0.3
    restart: unless-stopped
    depends_on:
      answer-db:
        condition: service_healthy
    environment:
      # Installs Answer on the first start (database tables, site settings and
      # the admin account); on later starts the existing install is kept.
      AUTO_INSTALL: "true"
      DB_TYPE: postgres
      DB_HOST: answer-db:5432
      DB_USERNAME: answer
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: answer
      LANGUAGE: en_US
      SITE_NAME: ${SITE_NAME:-Answer}
      SITE_URL: ${SITE_URL}
      CONTACT_EMAIL: ${ADMIN_EMAIL}
      ADMIN_NAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      EXTERNAL_CONTENT_DISPLAY: always_display
      TZ: Etc/UTC
    volumes:
      # config.yaml, uploads and plugin data.
      - answer-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  answer-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: answer
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: answer
    volumes:
      - answer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U answer"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  answer-data:
  answer-db-data:
