name: Apache Answer
description: "Self-hosted Apache Answer is a Stack Overflow-style Q&A site for your team or community: ask, answer, vote and build a searchable knowledge base."
version: "2.0.3"
tags: [stack overflow for teams alternative, q&a platform, internal knowledge base, community forum, help center, stack internal alternative]
links:
  website: https://answer.apache.org
  docs: https://answer.apache.org/docs
  source: https://github.com/apache/answer
cloudgate: 0.1.0
compose: app
size: small
inputs:
  SITE_URL: { value: "{{domains.answer.url}}" }
  DB_PASSWORD: { generate: password }
  ADMIN_PASSWORD: { generate: password }
  ADMIN_EMAIL:
    ask:
      label: Admin email
      description: You sign in with this email. Cloudgate creates a strong password for it, shown afterwards on the app's variables page. Also shown as the site's contact address.
      format: email
  SITE_NAME:
    ask:
      label: Site name
      description: The name shown at the top of your Q&A site. You can change it later in the admin settings.
      default: Answer
      pattern: "[^<>]{1,30}"
      required: false
signIn:
  username: ADMIN_EMAIL
  password: ADMIN_PASSWORD
domains:
  - { service: answer, port: 80 }
