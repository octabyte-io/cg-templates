name: Request Tracker
description: "Request Tracker (RT) is a self-hosted ticketing system, like Zendesk, that turns support and IT email into tickets sorted into queues."
version: "6.0.2"
tags: [ticketing system, help desk, zendesk alternative, email ticketing, it service desk, issue tracker, open source ticketing system]
links:
  website: https://bestpractical.com/request-tracker
  docs: https://docs.bestpractical.com/rt/latest/
  source: https://github.com/bestpractical/rt
cloudgate: "0.3.11"
compose: app
size: small
inputs:
  RT_URL: { value: "{{domains.request-tracker.url}}" }
  RT_ROOT_PASSWORD: { generate: password }
  DB_PASSWORD: { generate: password }
  DB_ROOT_PASSWORD: { generate: password }
signIn:
  username: { value: root }
  password: RT_ROOT_PASSWORD
domains:
  - { service: request-tracker, port: 80 }
files:
  - { path: cloudgate-init.sh.txt }
