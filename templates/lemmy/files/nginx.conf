# Lemmy's internal proxy, from lemmy-ansible's templates/nginx_internal.conf (for Lemmy 0.19.21):
# ActivityPub lookups and every non-GET request go to the backend, as do /api, /pictrs, feeds,
# nodeinfo, .well-known, version and the sitemap; page views go to lemmy-ui. Listens on port 80
# inside the network (Cloudgate adds HTTPS in front), without the optional Anubis bot filter.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's internal DNS, so restarted containers are found without reloading nginx.
    resolver 127.0.0.11 valid=5s;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    map "$request_method:$http_accept" $proxpass {
        default "http://lemmy-ui:1234";
        "~^(?:GET|HEAD):.*?application\/(?:activity|ld)\+json" "http://lemmy:8536";
        "~^(?!(GET|HEAD)).*:" "http://lemmy:8536";
    }

    server {
        set $lemmy_ui "lemmy-ui:1234";
        set $lemmy "lemmy:8536";
        listen 80;

        server_name _;
        server_tokens off;

        # Upload limit, relevant for pictrs
        client_max_body_size 20M;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # frontend general requests
        location / {
            proxy_pass $proxpass;
            rewrite ^(.+)/+$ $1 permanent;
        }

        location = /.well-known/security.txt {
            proxy_pass "http://$lemmy_ui";
        }

        # backend
        location ~ ^/(api|pictrs|feeds|nodeinfo|.well-known|version|sitemap.xml) {
            proxy_pass "http://$lemmy";
        }
    }
}
