name: Lemmy
description: "Lemmy is self-hosted, Reddit-style community software: topic communities, voting and threaded comments on your own domain, linked to the fediverse."
version: "0.19.21"
tags: [reddit alternative, self-hosted forum, link aggregator, fediverse, community platform, circle alternative]
links:
  website: https://join-lemmy.org
  docs: https://join-lemmy.org/docs/
  source: https://github.com/LemmyNet/lemmy
cloudgate: 0.1.0
compose: app
# Five containers: the Lemmy backend (Rust), lemmy-ui (Node), pict-rs for images, Postgres and
# Lemmy's own nginx router. A small community fits in 2 GB; federating with large instances
# grows Postgres.
size: medium
inputs:
  LEMMY_HOST: { value: "{{domains.proxy.host}}" }
  POSTGRES_PASSWORD: { generate: password }
  PICTRS_API_KEY: { generate: hex }
  # The first admin, created by Lemmy's setup block on the first start: user "admin".
  ADMIN_PASSWORD: { generate: password }
domains:
  - { service: proxy, port: 80 }
files:
  - { path: nginx.conf }
