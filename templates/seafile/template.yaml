name: Seafile
description: "Self-hosted Seafile syncs and shares your team's files fast, with desktop apps and file history."
version: "13.0.29"
tags: [dropbox alternative, file sync, file sharing, self-hosted cloud storage, google drive alternative, seafile vs nextcloud]
links:
  website: https://www.seafile.com
  docs: https://manual.seafile.com/13.0/setup/setup_ce_by_docker/
  source: https://github.com/haiwen/seafile-server
cloudgate: 0.1.0
compose: app
size: medium
inputs:
  SEAFILE_SERVER_HOSTNAME: { value: "{{domains.seafile.host}}" }
  JWT_PRIVATE_KEY: { generate: hex }
  SEAFILE_MYSQL_DB_PASSWORD: { generate: password }
  INIT_SEAFILE_MYSQL_ROOT_PASSWORD: { generate: password }
  REDIS_PASSWORD: { generate: password }
  INIT_SEAFILE_ADMIN_EMAIL:
    ask:
      label: Admin email
      description: The email you sign in to Seafile with as its first admin. Cloudgate creates a strong password for it, shown afterwards on the app's variables page.
      format: email
  INIT_SEAFILE_ADMIN_PASSWORD: { generate: password }
  TIME_ZONE:
    ask:
      label: Time zone
      description: The server's time zone, as an IANA name such as Europe/Berlin.
      default: Etc/UTC
      required: false
domains:
  - { service: seafile, port: 80 }
