# Based on Plane's Community Edition compose file
# (deployments/cli/community/docker-compose.yml at v1.4.3).

# Settings shared by the API, the workers and the migrator.
x-backend-env: &backend-env
  WEB_URL: ${WEB_URL}
  CORS_ALLOWED_ORIGINS: ${WEB_URL}
  DEBUG: "0"
  SECRET_KEY: ${SECRET_KEY}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
  GUNICORN_WORKERS: "1"
  API_KEY_RATE_LIMIT: 60/minute
  # Database
  DATABASE_URL: postgresql://plane:${POSTGRES_PASSWORD}@plane-db:5432/plane
  PGHOST: plane-db
  PGDATABASE: plane
  POSTGRES_USER: plane
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: plane
  POSTGRES_PORT: "5432"
  # Cache
  REDIS_HOST: plane-redis
  REDIS_PORT: "6379"
  REDIS_URL: redis://plane-redis:6379/
  # Message queue
  AMQP_URL: amqp://plane:${RABBITMQ_PASSWORD}@plane-mq:5672/plane
  # File uploads, kept in the bundled MinIO and served through the proxy
  USE_MINIO: "1"
  MINIO_ENDPOINT_SSL: "0"
  AWS_REGION: ""
  AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
  AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  AWS_S3_BUCKET_NAME: uploads
  FILE_SIZE_LIMIT: "5242880"

services:
  # Plane's own Caddy proxy: routes /api, /auth, /god-mode, /spaces, /live and
  # /uploads to the right container and everything else to the web app.
  proxy:
    image: makeplane/plane-proxy:v1.4.3
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ":80"
      FILE_SIZE_LIMIT: "5242880"
      BUCKET_NAME: uploads
    volumes:
      - plane-proxy-config:/config
      - plane-proxy-data:/data
    depends_on:
      - web
      - space
      - admin
      - live
      - api

  web:
    image: makeplane/plane-frontend:v1.4.3
    restart: unless-stopped
    depends_on:
      - api
      - worker

  space:
    image: makeplane/plane-space:v1.4.3
    restart: unless-stopped
    depends_on:
      - api
      - worker
      - web

  admin:
    image: makeplane/plane-admin:v1.4.3
    restart: unless-stopped
    depends_on:
      - api
      - web

  live:
    image: makeplane/plane-live:v1.4.3
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
      REDIS_HOST: plane-redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://plane-redis:6379/
    depends_on:
      - api
      - web

  api:
    image: makeplane/plane-backend:v1.4.3
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    environment: *backend-env
    volumes:
      - plane-logs-api:/code/plane/logs
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      plane-minio:
        condition: service_started

  worker:
    image: makeplane/plane-backend:v1.4.3
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    environment: *backend-env
    volumes:
      - plane-logs-worker:/code/plane/logs
    depends_on:
      - api

  beat-worker:
    image: makeplane/plane-backend:v1.4.3
    restart: unless-stopped
    command: ./bin/docker-entrypoint-beat.sh
    environment: *backend-env
    volumes:
      - plane-logs-beat-worker:/code/plane/logs
    depends_on:
      - api

  # Runs once at each start: creates the database tables on the first start and
  # applies upgrades after an image update. The API waits for it.
  migrator:
    image: makeplane/plane-backend:v1.4.3
    restart: on-failure
    command: ./bin/docker-entrypoint-migrator.sh
    environment: *backend-env
    volumes:
      - plane-logs-migrator:/code/plane/logs
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy

  plane-db:
    image: postgres:15.20-alpine
    restart: unless-stopped
    command: postgres -c 'max_connections=1000'
    environment:
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: plane
      PGDATA: /var/lib/postgresql/data
    volumes:
      - plane-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plane -d plane"]
      interval: 10s
      timeout: 5s
      retries: 10

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    volumes:
      - plane-redis-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: plane
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: plane
    volumes:
      - plane-mq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # S3-compatible storage for uploads (the MinIO build Plane ships with).
  plane-minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    command: server /export --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - plane-uploads:/export

volumes:
  plane-proxy-config:
  plane-proxy-data:
  plane-logs-api:
  plane-logs-worker:
  plane-logs-beat-worker:
  plane-logs-migrator:
  plane-db-data:
  plane-redis-data:
  plane-mq-data:
  plane-uploads:
