# Based on the official docker-compose.yaml (github.com/mediacms-io/mediacms,
# v7.2.0). One image runs four roles: a one-off migrations job (database
# migrations, first admin user, collectstatic), the web server (nginx + uwsgi),
# the Celery workers that transcode uploads, and the Celery scheduler.
# Instead of mounting the whole source tree, only uploads, static files and
# logs are kept in named volumes, and Cloudgate's settings file is mounted.
x-mediacms-env: &mediacms-env
  FRONTEND_HOST: ${FRONTEND_HOST}
  SECRET_KEY: ${SECRET_KEY}
  POSTGRES_HOST: mediacms-db
  POSTGRES_NAME: mediacms
  POSTGRES_USER: mediacms
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_LOCATION: redis://mediacms-redis:6379/1
  ADMIN_EMAIL: ${ADMIN_EMAIL}
  ALLOW_SIGNUPS: ${ALLOW_SIGNUPS:-true}

x-mediacms-volumes: &mediacms-volumes
  - mediacms-media:/home/mediacms.io/mediacms/media_files
  - mediacms-static:/home/mediacms.io/mediacms/static
  - mediacms-logs:/home/mediacms.io/mediacms/logs
  - ../files/local_settings.txt:/home/mediacms.io/mediacms/deploy/docker/local_settings.py:ro

services:
  # Runs once on every start: migrations, then (first start only) the admin
  # user with ADMIN_PASSWORD, then collectstatic. Exits when done.
  mediacms-migrations:
    image: mediacms/mediacms:7.2.0
    restart: on-failure
    command: "./deploy/docker/prestart.sh"
    depends_on:
      mediacms-db:
        condition: service_healthy
      mediacms-redis:
        condition: service_healthy
    environment:
      <<: *mediacms-env
      ENABLE_UWSGI: "no"
      ENABLE_NGINX: "no"
      ENABLE_CELERY_SHORT: "no"
      ENABLE_CELERY_LONG: "no"
      ENABLE_CELERY_BEAT: "no"
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes: *mediacms-volumes

  mediacms:
    image: mediacms/mediacms:7.2.0
    restart: unless-stopped
    depends_on:
      mediacms-migrations:
        condition: service_completed_successfully
    environment:
      <<: *mediacms-env
      ENABLE_CELERY_BEAT: "no"
      ENABLE_CELERY_SHORT: "no"
      ENABLE_CELERY_LONG: "no"
      ENABLE_MIGRATIONS: "no"
    volumes: *mediacms-volumes

  mediacms-celery-worker:
    image: mediacms/mediacms:7.2.0
    restart: unless-stopped
    depends_on:
      mediacms-migrations:
        condition: service_completed_successfully
    environment:
      <<: *mediacms-env
      ENABLE_UWSGI: "no"
      ENABLE_NGINX: "no"
      ENABLE_CELERY_BEAT: "no"
      ENABLE_MIGRATIONS: "no"
    volumes: *mediacms-volumes

  mediacms-celery-beat:
    image: mediacms/mediacms:7.2.0
    restart: unless-stopped
    depends_on:
      mediacms-migrations:
        condition: service_completed_successfully
    environment:
      <<: *mediacms-env
      ENABLE_UWSGI: "no"
      ENABLE_NGINX: "no"
      ENABLE_CELERY_SHORT: "no"
      ENABLE_CELERY_LONG: "no"
      ENABLE_MIGRATIONS: "no"
    volumes: *mediacms-volumes

  mediacms-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediacms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mediacms
    volumes:
      - mediacms-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d mediacms -U mediacms"]
      interval: 10s
      timeout: 5s
      retries: 10

  mediacms-redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    volumes:
      - mediacms-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mediacms-media:
  mediacms-static:
  mediacms-logs:
  mediacms-db-data:
  mediacms-redis-data:
