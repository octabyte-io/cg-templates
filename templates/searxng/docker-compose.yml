services:
  searxng:
    image: searxng/searxng:2026.11.15-2d500cb6b
    restart: unless-stopped
    depends_on:
      searxng-valkey:
        condition: service_healthy
    environment:
      # The app's public address, used in links, the OpenSearch description and RSS.
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL}
      # Signs preference cookies and the image proxy. Overrides the key the image
      # writes into settings.yml on the first start.
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_VALKEY_URL: valkey://searxng-valkey:6379/0
      # The image listens on [::] by default, which fails on servers with IPv6
      # turned off in Docker ("Address family not supported by protocol").
      GRANIAN_HOST: 0.0.0.0
    volumes:
      # settings.yml, created from the image's template on the first start; edit
      # it to change engines, formats (e.g. json for AI chat apps) and the limiter.
      - searxng-config:/etc/searxng
      - searxng-data:/var/cache/searxng
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  searxng-valkey:
    image: valkey/valkey:9.1.3-alpine
    restart: unless-stopped
    command: valkey-server --save 300 1 --save 60 1000 --loglevel warning
    volumes:
      - searxng-valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  searxng-config:
  searxng-data:
  searxng-valkey-data:
