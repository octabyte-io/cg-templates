name: OpenClaw
description: "OpenClaw is a self-hosted personal AI assistant you message from WhatsApp, Telegram or Slack, using the AI model you choose instead of a hosted AI agent."
version: "2026.11.3"
tags: [personal ai assistant, manus alternative, lindy alternative, self-hosted ai agent, whatsapp ai assistant, telegram ai bot, open source ai agent]
links:
  website: https://openclaw.ai
  docs: https://docs.openclaw.ai
  source: https://github.com/openclaw/openclaw
cloudgate: 0.1.0
compose: app
size: large
inputs:
  # The Gateway token: paste it into the dashboard's sign-in screen.
  OPENCLAW_GATEWAY_TOKEN: { generate: hex }
  # The browser origin the dashboard is served from.
  OPENCLAW_PUBLIC_ORIGIN: { value: "{{domains.openclaw-gateway.url}}" }
signIn:
  password: OPENCLAW_GATEWAY_TOKEN
domains:
  - { service: openclaw-gateway, port: 18789 }
