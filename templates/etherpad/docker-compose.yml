services:
  etherpad:
    image: etherpad/etherpad:3.3.17
    restart: unless-stopped
    user: "5001:0"
    depends_on:
      etherpad-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_TYPE: postgres
      DB_HOST: etherpad-db
      DB_PORT: "5432"
      DB_NAME: etherpad
      DB_USER: etherpad
      DB_PASS: ${POSTGRES_PASSWORD}
      # The user "admin" for the /admin page. No other accounts: anyone with
      # the address can open or create a pad, as in the official setup.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # The /admin page signs in through Etherpad's built-in OpenID Connect
      # service, which must know the app's real address.
      SSO_ISSUER: ${APP_URL}
      ADMIN_SECRET: ${ADMIN_SECRET}
      ADMIN_REDIRECT: ${APP_URL}/admin/
      USER_SECRET: ${USER_SECRET}
      USER_REDIRECT: ${APP_URL}/
      PUBLIC_URL: ${APP_URL}
      # Cloudgate's proxy terminates HTTPS in front of Etherpad.
      TRUST_PROXY: "true"
    volumes:
      # Plugins installed from the /admin page.
      - etherpad-plugins:/opt/etherpad-lite/src/plugin_packages
      - etherpad-var:/opt/etherpad-lite/var

  etherpad-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: etherpad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: etherpad
    volumes:
      - etherpad-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etherpad"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  etherpad-plugins:
  etherpad-var:
  etherpad-db-data:
