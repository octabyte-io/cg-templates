services:
  metabase:
    image: metabase/metabase:v0.65.4.1
    restart: unless-stopped
    depends_on:
      metabase-db:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${DB_PASSWORD}
      MB_JETTY_PORT: 3000
      MB_SITE_URL: ${MB_SITE_URL}
      MB_ENCRYPTION_SECRET_KEY: ${MB_ENCRYPTION_SECRET_KEY}
      MB_SESSION_SECRET_KEY: ${MB_SESSION_SECRET_KEY}

  metabase-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: metabase
    volumes:
      - metabase-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  metabase-db-data:
