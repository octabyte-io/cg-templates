name: Metabase
description: "Self-hosted Metabase: open-source business intelligence and a free Tableau or Looker alternative. Build charts and dashboards from your data, no SQL needed."
version: "0.65.4.1"
tags: [business intelligence, dashboards, reporting, data visualization, tableau alternative, sql]
links:
  website: https://www.metabase.com
  docs: https://www.metabase.com/docs/latest/
  source: https://github.com/metabase/metabase
cloudgate: 0.1.0
inputs:
  MB_SITE_URL: { value: "{{domains.app.url}}" }
  MB_ENCRYPTION_SECRET_KEY: { generate: base64 }
  MB_SESSION_SECRET_KEY: { generate: hex }
