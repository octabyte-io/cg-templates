services:
  freshrss:
    image: freshrss/freshrss:1.30.4
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Etc/UTC}
      # Fetches new articles at minutes 3 and 33 of every hour.
      CRON_MIN: "3,33"
      TRUSTED_PROXY: 172.16.0.1/12 192.168.0.1/16 10.0.0.1/8
      # Runs on the first start only: installs FreshRSS with SQLite (kept in
      # the data volume), sets its address and creates the admin account.
      # New sign-ups stay closed (FreshRSS's default); the admin adds users.
      FRESHRSS_INSTALL: |-
        --base-url ${BASE_URL}
        --db-type sqlite
        --default-user admin
        --language en
        --disable-update
      FRESHRSS_USER: |-
        --user admin
        --password ${ADMIN_PASSWORD}
        --language en
    volumes:
      - freshrss-data:/var/www/FreshRSS/data
      - freshrss-extensions:/var/www/FreshRSS/extensions
    healthcheck:
      test: ["CMD", "cli/health.php"]
      timeout: 10s
      start_period: 60s
      interval: 30s
      retries: 3

volumes:
  freshrss-data:
  freshrss-extensions:
