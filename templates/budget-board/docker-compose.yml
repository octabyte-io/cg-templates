# From the project's compose.yml (v3.9.1). The client is nginx serving the web
# pages and passing /api/ to the server, so only the client gets the web address.
# Accounts are created on the sign-up page; the first visitor makes their own.
services:
  budget-board-server:
    image: ghcr.io/teelur/budget-board/server:v3.9.1
    restart: unless-stopped
    depends_on:
      budget-board-db:
        condition: service_healthy
    environment:
      Logging__LogLevel__Default: Information
      # The web pages' address, allowed for cross-origin requests.
      CLIENT_ADDRESS: ${APP_URL}
      ASPNETCORE_HTTP_PORTS: 8080
      POSTGRES_HOST: budget-board-db
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: budgetboard
      POSTGRES_USER: budgetboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OIDC_ENABLED: "false"
      DISABLE_NEW_USERS: ${DISABLE_NEW_USERS:-false}
      DISABLE_LOCAL_AUTH: "false"
      # Creates and upgrades the database tables at each start.
      AUTO_UPDATE_DB: "true"
      DISABLE_UPDATE_CHECK: "false"
      DISABLE_AUTO_SYNC: "false"
      SYNC_INTERVAL_HOURS: 8
      TZ: ${TZ:-Etc/UTC}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  budget-board-client:
    image: ghcr.io/teelur/budget-board/client:v3.9.1
    restart: unless-stopped
    depends_on:
      budget-board-server:
        condition: service_healthy
    environment:
      PORT: 6253
      VITE_SERVER_ADDRESS: budget-board-server
      VITE_OIDC_ENABLED: "false"
      VITE_OIDC_PROVIDER: ""
      VITE_OIDC_CLIENT_ID: ""
      VITE_DISABLE_NEW_USERS: ${DISABLE_NEW_USERS:-false}
      VITE_DISABLE_LOCAL_AUTH: "false"

  budget-board-db:
    image: postgres:16.16-alpine
    restart: unless-stopped
    command: ["-c", "timezone=${TZ:-Etc/UTC}"]
    environment:
      POSTGRES_USER: budgetboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: budgetboard
    volumes:
      - budget-board-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetboard -d budgetboard"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  budget-board-db-data:
