# Based on Countly's own Docker setup at tag 25.03.59: Dockerfile-core builds the all-in-one
# countly/countly-server image (API, dashboard and nginx in one container, on port 80), the same
# code the repo's docker-compose.yml runs as separate countly/api and countly/frontend containers
# behind nginx. MongoDB 8.0 is one of the versions Countly's installer sets up (8.0 and 9.0).

services:
  countly:
    image: countly/countly-server:25.03.59
    restart: unless-stopped
    depends_on:
      countly-mongo:
        condition: service_healthy
    environment:
      # Read by both the API and the dashboard; database names come from Countly's defaults.
      COUNTLY_CONFIG__MONGODB: mongodb://countly:${MONGO_PASSWORD}@countly-mongo:27017/?authSource=admin
      # The Lite plugins from Countly's docker-compose.yml and Dockerfile-core.
      COUNTLY_PLUGINS: mobile,web,desktop,plugins,density,locale,browser,sources,views,logger,systemlogs,populator,reports,crashes,push,star-rating,slipping-away-users,compare,server-stats,dbviewer,times-of-day,compliance-hub,alerts,onboarding,consolidate,remote-config,hooks,dashboards,sdk,data-manager,guides
      COUNTLY_CONFIG_API_API_WORKERS: 2
      COUNTLY_CONFIG__FILESTORAGE: gridfs
      # Signs the dashboard's session cookie (the default is a fixed string).
      COUNTLY_CONFIG_FRONTEND_WEB_SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      # The image's nginx config listens on IPv6 too and stops if the container has none.
      - ../files/countly-nginx.conf:/etc/nginx/conf.d/default.conf:ro

  countly-mongo:
    image: mongo:8.0.38
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: countly
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - countly-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  countly-mongo-data:
