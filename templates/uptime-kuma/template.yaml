name: Uptime Kuma
description: "Uptime Kuma is a self-hosted uptime monitor: get an alert the moment your website goes down and show customers a status page. Free, open source."
version: "2.5.9"
tags: [uptime monitoring, status page, website monitoring, pingdom alternative, uptimerobot alternative, ssl certificate monitoring]
links:
  website: https://uptime.kuma.pet
  docs: https://github.com/louislam/uptime-kuma/wiki
  source: https://github.com/louislam/uptime-kuma
cloudgate: 0.1.0
compose: app
size: xsmall
domains:
  - { service: uptime-kuma, port: 3001 }
