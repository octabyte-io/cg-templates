services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.9
    restart: unless-stopped
    environment:
      # Use the built-in SQLite database and skip the database step of the
      # first-run wizard; everything is kept in the data volume below.
      UPTIME_KUMA_DB_TYPE: sqlite
    volumes:
      - uptime-kuma-data:/app/data

volumes:
  uptime-kuma-data:
