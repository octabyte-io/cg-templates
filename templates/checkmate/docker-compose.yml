services:
  checkmate:
    image: ghcr.io/bluewave-labs/checkmate:v3.13.1
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      checkmate-mongodb:
        condition: service_healthy
    environment:
      DB_CONNECTION_STRING: mongodb://checkmate-mongodb:27017/uptime_db
      # The app's own address: used for links in alerts and emails.
      CLIENT_HOST: ${CLIENT_HOST}
      JWT_SECRET: ${JWT_SECRET}
      # Encrypts stored Docker TLS client keys (32 bytes, padded base64).
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NODE_ENV: production
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:52346/livez',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 3s
      start_period: 60s
      retries: 3

  # MongoDB is reachable only inside this app's network, without a password,
  # as in the official compose file.
  checkmate-mongodb:
    image: mongo:8.0.38
    restart: unless-stopped
    command: ["mongod", "--quiet", "--bind_ip_all"]
    volumes:
      - checkmate-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/27017"]
      interval: 5s
      timeout: 30s
      start_period: 10s
      retries: 30

volumes:
  checkmate-mongo-data:
