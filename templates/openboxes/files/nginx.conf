# OpenBoxes serves its pages under /openboxes, and parts of its interface
# expect that path. As in the project's reverse-proxy guide
# (docs.openboxes.com, Install > Reverse Proxy), the root of the address
# redirects to /openboxes/ and everything is forwarded to the app.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  # Product images, documents and import files are uploaded through here.
  client_max_body_size 100m;
  # Relative redirects keep the https address Cloudgate's proxy serves.
  absolute_redirect off;

  location = / {
    return 302 /openboxes/;
  }

  location / {
    proxy_pass http://openboxes-app:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 300s;
  }
}
