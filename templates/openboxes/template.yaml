name: OpenBoxes
description: "Self-hosted OpenBoxes: open-source warehouse inventory with lots, expiry dates and shipments between sites, and a Fishbowl and Cin7 alternative."
version: "0.9.9"
tags: [fishbowl alternative, cin7 alternative, warehouse management, inventory management, expiry date tracking, medical supply inventory, supply chain]
links:
  website: https://openboxes.com
  docs: https://docs.openboxes.com/en/latest/
  source: https://github.com/openboxes/openboxes
cloudgate: 0.1.0
compose: app
size: large
inputs:
  SERVER_URL: { value: "{{domains.openboxes.url}}/openboxes" }
  DB_PASSWORD: { generate: password }
  DB_ROOT_PASSWORD: { generate: password }
  ADMIN_PASSWORD: { generate: password }
signIn:
  username: { value: admin }
  password: ADMIN_PASSWORD
domains:
  - { service: openboxes, port: 80 }
files:
  - { path: nginx.conf }
