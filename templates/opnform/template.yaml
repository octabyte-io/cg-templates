name: OpnForm
description: "Self-hosted OpnForm: an open-source form builder for forms and surveys with logic and unlimited answers, in place of Typeform, Tally or Google Forms."
version: "2.8.4"
tags: [form builder, typeform alternative, tally alternative, google forms alternative, online forms, surveys, open source form builder]
links:
  website: https://opnform.com
  docs: https://docs.opnform.com/deployment/docker
  source: https://github.com/OpnForm/OpnForm
cloudgate: 0.1.0
compose: app
# Laravel API, queue worker, scheduler, the Nuxt web app, nginx, Postgres and
# Redis together; 2 GB keeps PHP and Node comfortable.
size: medium
inputs:
  APP_URL: { value: "{{domains.opnform.url}}" }
  # Laravel's key: 32 random bytes, base64-encoded (the compose file adds the
  # "base64:" prefix). It encrypts stored secrets, so it never changes.
  APP_KEY: { generate: base64 }
  JWT_SECRET: { generate: hex }
  # Shared between the API and the web app's server-side rendering.
  FRONT_API_SECRET: { generate: hex }
  DB_PASSWORD: { generate: password }
signIn:
  firstVisit:
    path: /setup
    note: "Create the admin account with your name, email and a password."
# OpnForm's own nginx ingress sends /api to the Laravel API and everything else
# to the Nuxt web app, so it is the service that gets the address.
domains:
  - { service: opnform, port: 80 }
files:
  - { path: nginx.conf }
