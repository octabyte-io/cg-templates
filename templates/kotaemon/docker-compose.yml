services:
  kotaemon:
    # The "lite" image: Kotaemon with PDF, text and web reading, using the AI
    # provider you choose. The "-full" image adds local OCR and Office-file
    # parsing (Unstructured, Docling, LibreOffice, Tesseract, PyTorch) and is
    # about twice the size; swap the tag if you need those.
    image: ghcr.io/cinnamon/kotaemon:0.11.0-lite
    restart: unless-stopped
    environment:
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: "7860"
      GRADIO_ANALYTICS_ENABLED: "false"
      # The admin account Kotaemon creates on first start. Without these it
      # would be admin / admin, which is unsafe on a public address.
      KH_FEATURE_USER_MANAGEMENT_ADMIN: admin
      KH_FEATURE_USER_MANAGEMENT_PASSWORD: ${KOTAEMON_ADMIN_PASSWORD}
      # The image's built-in .env sets a placeholder Voyage AI key, which
      # makes the app load the Voyage AI client; the lite image doesn't
      # include it and would crash on start. Leave it empty here.
      VOYAGE_API_KEY: ""
    volumes:
      # Users, chats, uploaded files, indexes and the AI provider settings
      # chosen in the app.
      - kotaemon-data:/app/ktem_app_data
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail --output /dev/null http://localhost:7860/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5

volumes:
  kotaemon-data:
