name: DataEase
description: "Self-hosted DataEase builds drag-and-drop dashboards and wall screens from your databases, Excel files or an API, with no per-viewer licence."
version: "3.2.1"
tags: [business intelligence, tableau alternative, power bi alternative, dashboard tool, data visualization, open source bi, excel dashboards]
links:
  website: https://dataease.io
  docs: https://docs.fit2cloud.com/dataease/
  source: https://github.com/dataease/dataease
cloudgate: "0.3.11"
compose: app
size: large
inputs:
  APP_URL: { value: "{{domains.dataease.url}}" }
  DB_PASSWORD: { generate: password }
  ADMIN_PASSWORD: { generate: password }
  TIMEZONE:
    ask:
      label: Time zone
      description: Used for dates and times in charts and data, as an IANA name such as Europe/Berlin.
      default: Etc/UTC
      required: false
signIn:
  username: { value: admin }
  password: ADMIN_PASSWORD
domains:
  - { service: dataease, port: 8100 }
