# MyBB's web server, from the virtual host the MyBB Docker image's README links to
# (gist.github.com/kawaii/ed2fbbf11309b8f635a623fa87abce8d). nginx serves the static files
# from the shared MyBB volume and hands PHP to the mybb container (PHP-FPM on port 9000).
# Listens on port 80 inside the network; Cloudgate adds HTTPS in front.

# Cloudgate's proxy reaches nginx from a private network and sends the visitor's address
# and scheme: use them, so MyBB logs and bans real IPs and knows the page was HTTPS.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $http_x_forwarded_proto $mybb_https {
    default "";
    https on;
}

upstream mybb {
    server mybb:9000;
}

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html index.php;

    # Matches the upload limit in the MyBB image's PHP settings (10M).
    client_max_body_size 10m;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # MyBB's code, config and caches are never served directly.
    location ~ inc/ {
        internal;
    }

    location ~ /\. {
        deny all;
    }

    location ~ ^/(images|cache|jscripts|uploads)/ {
        access_log off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass mybb;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $mybb_https;
    }
}
