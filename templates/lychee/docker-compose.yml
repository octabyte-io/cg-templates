# From the official compose file (github.com/LycheeOrg/Lychee, docker-compose.yaml at v7.13.0):
# the web container, the queue worker and MariaDB, pinned to one release. The optional
# sidecars (facial recognition, NSFW classification, reverse geocoding) and phpMyAdmin are
# left out, as are the official file's resource limits and its .env file.
x-lychee: &lychee
  image: ghcr.io/lycheeorg/lychee:v7.13.0
  restart: unless-stopped
  volumes:
    # Your photos and their resized copies.
    - lychee-uploads:/app/public/uploads
    - lychee-logs:/app/storage/logs
    # Uploads wait here until the worker processes them, so both containers share it.
    - lychee-tmp:/app/storage/tmp

x-lychee-env: &lychee-env
  APP_NAME: Lychee
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: base64:${APP_KEY}
  APP_URL: ${APP_URL}
  APP_TIMEZONE: ${TIMEZONE:-UTC}
  # Cloudgate's proxy sits in front; trust it so Lychee builds https links.
  TRUSTED_PROXIES: "*"
  PUID: "1000"
  PGID: "1000"
  DB_CONNECTION: mysql
  DB_HOST: lychee-db
  DB_PORT: "3306"
  DB_DATABASE: lychee
  DB_USERNAME: lychee
  DB_PASSWORD: ${DB_PASSWORD}
  SESSION_DRIVER: file
  # With a separate worker the cache must be shared by both containers (the official file
  # says so): the database store, whose tables Lychee's migrations create.
  CACHE_STORE: database
  LOG_VIEWER_CACHE_DRIVER: file
  QUEUE_CONNECTION: database

services:
  lychee:
    <<: *lychee
    # FrankenPHP on port 8000. Database migrations run on every start of this container.
    environment:
      <<: *lychee-env
    depends_on:
      lychee-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # Processes uploads, imports and album statistics in the background.
  lychee-worker:
    <<: *lychee
    environment:
      <<: *lychee-env
      LYCHEE_MODE: worker
    # The image's own healthcheck calls the web server, which the worker doesn't run.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      lychee-db:
        condition: service_healthy
      lychee:
        condition: service_healthy

  lychee-db:
    # The official file uses mariadb:11; this is that release line, pinned.
    image: mariadb:11.8.9
    restart: unless-stopped
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: lychee
      MARIADB_USER: lychee
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - lychee-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  lychee-uploads:
  lychee-logs:
  lychee-tmp:
  lychee-db-data:
