services:
  komga:
    # The official image from Komga's Docker docs (komga.org/docs/installation/docker).
    # It runs as root by default; the docs' "user: 1000:1000" is only for
    # matching host folder owners, which named volumes don't need.
    image: gotson/komga:1.30.1
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Etc/UTC}
    volumes:
      # The database and Komga's settings. Komga's docs ask for a local disk here.
      - komga-config:/config
      # The library, shared with FileBrowser Quantum below. Add a library in
      # Komga's web UI pointing at /data (or a folder under it); Komga scans it
      # for new files on its schedule, or on demand with "Scan library files".
      - komga-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:25600/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  # FileBrowser Quantum: Komga has no upload in its web UI (its "Import Books"
  # only reads folders already on the server), so this uploads comics and books
  # from the browser at its own address, into the same volume Komga reads.
  # Its default settings serve /srv with password sign-in and sign-ups off.
  # FILEBROWSER_ADMIN_PASSWORD sets the password of the user "admin" (created on
  # first start, and set back to this value on every start). Runs as root so it
  # can write to the shared volume, which both images create owned by root.
  filebrowser:
    image: gtstef/filebrowser:2.0.2-stable-slim
    restart: unless-stopped
    user: "0:0"
    environment:
      FILEBROWSER_ADMIN_PASSWORD: ${FILEBROWSER_ADMIN_PASSWORD}
    volumes:
      - komga-data:/srv
      # Its database and settings.
      - filebrowser-data:/home/filebrowser/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  komga-config:
  komga-data:
  filebrowser-data:
