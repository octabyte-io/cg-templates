services:
  typecho:
    image: joyqi/typecho:1.3.0-php8.2-apache
    restart: unless-stopped
    depends_on:
      typecho-db:
        condition: service_healthy
    environment:
      TYPECHO_SITE_URL: ${SITE_URL}
      # Install on first start; on later starts, rewrite the config and keep the existing tables.
      TYPECHO_INSTALL: "1"
      TYPECHO_DB_NEXT: keep
      TYPECHO_DB_ADAPTER: Pdo_Mysql
      TYPECHO_DB_HOST: typecho-db
      TYPECHO_DB_PORT: "3306"
      TYPECHO_DB_USER: typecho
      TYPECHO_DB_PASSWORD: ${DB_PASSWORD}
      TYPECHO_DB_DATABASE: typecho
      TYPECHO_USER_NAME: admin
      TYPECHO_USER_PASSWORD: ${ADMIN_PASSWORD}
      TYPECHO_USER_MAIL: ${ADMIN_EMAIL}
      MAX_POST_BODY: 50M
    volumes:
      - typecho-usr:/app/usr

  typecho-db:
    image: mariadb:11.8.9
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: typecho
      MARIADB_USER: typecho
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - typecho-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  typecho-usr:
  typecho-db-data:
