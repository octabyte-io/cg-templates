name: Shoutrrr
description: "Self-hosted Shoutrrr schedules posts to X, Bluesky, LinkedIn, Facebook, Instagram, Threads and Discord from one queue and calendar."
version: "1.5.8"
tags: [social media scheduler, buffer alternative, typefully alternative, hootsuite alternative, open source social media scheduler, schedule social media posts, bluesky scheduler]
links:
  website: https://shoutrrr.com
  docs: https://shoutrrr.com/docs
  source: https://github.com/coollabsio/shoutrrr
cloudgate: "0.3.11"
compose: app
size: small
inputs:
  APP_URL: { value: "{{domains.shoutrrr.url}}" }
  # Laravel's APP_KEY (32 random bytes, base64); the compose file adds the "base64:" prefix.
  APP_KEY: { generate: base64 }
signIn:
  firstVisit:
    path: /register
    note: "Register with your name, email and a password; the first account made is the owner."
domains:
  - { service: shoutrrr, port: 8080 }
