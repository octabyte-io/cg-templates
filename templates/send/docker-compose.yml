services:
  send:
    image: registry.gitlab.com/timvisee/send:v3.5.1
    restart: unless-stopped
    depends_on:
      send-redis:
        condition: service_healthy
      send-uploads-owner:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      BASE_URL: ${BASE_URL}
      PORT: "1443"
      FILE_DIR: /uploads
      REDIS_HOST: send-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Keep reconnecting to Redis for up to a day (the default gives up after
      # 10 seconds, leaving Send broken after a Redis restart).
      REDIS_RETRY_TIME: "86400000"
      # Send has no accounts: anyone who can open it can upload. These limits
      # keep strangers from using it as free long-term file hosting.
      # Largest upload: 1 GiB (Send's default is 2.5 GB).
      MAX_FILE_SIZE: "1073741824"
      MAX_FILES_PER_ARCHIVE: "64"
      # Expiry choices: 5 minutes, 1 hour, 1 day (preselected), 7 days at most.
      EXPIRE_TIMES_SECONDS: "300,3600,86400,604800"
      DEFAULT_EXPIRE_SECONDS: "86400"
      MAX_EXPIRE_SECONDS: "604800"
      # Download-limit choices, 1 preselected, 100 at most.
      DOWNLOAD_COUNTS: "1,2,3,4,5,20,50,100"
      DEFAULT_DOWNLOADS: "1"
      MAX_DOWNLOADS: "100"
      SEND_FOOTER_DMCA_URL: ${SEND_FOOTER_DMCA_URL:-}
    volumes:
      - send-uploads:/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:1443/__lbheartbeat__"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Runs once at each start: the app runs as user 1000, and a new volume
  # belongs to root.
  send-uploads-owner:
    image: registry.gitlab.com/timvisee/send:v3.5.1
    restart: "no"
    user: root
    entrypoint: [chown, "1000:1000", /uploads]
    volumes:
      - send-uploads:/uploads

  # Send does not delete every expired file itself (its maintainer's compose
  # setup adds a cron job for this). Every hour, this deletes uploads older
  # than the longest expiry, 7 days, plus a margin.
  send-cleanup:
    image: registry.gitlab.com/timvisee/send:v3.5.1
    restart: unless-stopped
    depends_on:
      send-uploads-owner:
        condition: service_completed_successfully
    entrypoint:
      - sh
      - -c
      - >-
        trap 'exit 0' TERM;
        while true; do
        find /uploads -type f -mmin +10140 -delete;
        sleep 3600 & wait $$!;
        done
    volumes:
      - send-uploads:/uploads

  send-redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --requirepass, "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - send-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  send-uploads:
  send-redis-data:
