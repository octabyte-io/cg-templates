name: Overleaf Community Edition
description: "Overleaf Community Edition, self-hosted: write LaTeX papers and theses together in your browser with a live PDF preview, without an overleaf.com plan."
version: "6.3.3"
tags: [self-hosted overleaf, overleaf alternative, latex editor, collaborative latex, academic writing, thesis writing]
links:
  website: https://www.overleaf.com
  docs: https://docs.overleaf.com/on-premises
  source: https://github.com/overleaf/overleaf
cloudgate: "0.3.11"
compose: app
size: large
inputs:
  OVERLEAF_SITE_URL: { value: "{{domains.overleaf.url}}" }
  OVERLEAF_INVITE_TOKEN_SECRET: { generate: base64 }
signIn:
  firstVisit:
    path: /launchpad
    note: "Create the admin account with your email and a password; the admin then adds everyone else."
domains:
  - { service: overleaf, port: 80 }
