name: It's a Plan
description: "It's a Plan is a self-hosted, open-source issue tracker like Linear, with boards, cycles, docs and AI agents that take issues like a teammate."
version: "1.11.0"
tags: [linear alternative, issue tracker, project management, jira alternative, kanban board, ai agents]
links:
  website: https://itsaplan.dev
  docs: https://github.com/croffasia/itsaplan/blob/v1.11.0/docs/self-hosting.md
  source: https://github.com/croffasia/itsaplan
cloudgate: 0.1.0
compose: app
size: medium
inputs:
  APP_URL: { value: "{{domains.itsaplan.url}}" }
  API_URL: { value: "{{domains.itsaplan-api.url}}" }
  POSTGRES_PASSWORD: { generate: password }
  BETTER_AUTH_SECRET: { generate: base64 }
  # Encrypts stored provider credentials; changing it makes them unreadable.
  APP_ENCRYPTION_KEY: { generate: base64 }
  # Root credentials of the built-in RustFS file store that keeps attachments.
  S3_ACCESS_KEY_ID: { generate: password }
  S3_SECRET_ACCESS_KEY: { generate: password }
# The first address is the web app people use; the second is its API, which the
# browser calls and the sign-in cookie is shared with (both sit under one parent domain).
domains:
  - { service: itsaplan, port: 3001 }
  - { service: itsaplan-api, port: 3000 }
