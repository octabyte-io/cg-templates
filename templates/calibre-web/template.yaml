name: Calibre-Web
description: "Calibre-Web is a self-hosted e-book library: upload your books, read them in the browser, send them to a Kindle or sync a Kobo."
version: "0.6.27"
tags: [self-hosted ebook library, ebook server, calibre web, opds server, kindle alternative, kobo sync]
links:
  website: https://github.com/janeczku/calibre-web
  docs: https://github.com/janeczku/calibre-web/wiki
  source: https://github.com/janeczku/calibre-web
cloudgate: 0.1.0
compose: app
size: small
inputs:
  # Replaces the default password (admin123) of the account "admin" on the first start.
  ADMIN_PASSWORD: { generate: password }
  TIMEZONE:
    ask:
      label: Time zone
      description: Used for dates and times in Calibre-Web, as an IANA name such as Europe/Berlin.
      default: Etc/UTC
      required: false
signIn:
  username: { value: admin }
  password: ADMIN_PASSWORD
domains:
  - { service: calibre-web, port: 8083 }
files:
  - { path: calibre-web-setup.py.txt }
  - { path: calibre-metadata.sql }
