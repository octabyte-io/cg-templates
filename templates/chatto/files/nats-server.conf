# NATS JetStream settings from Chatto's official Docker Compose example
# (examples/dockercompose/nats-server.conf). Chatto keeps all of its data,
# messages and uploaded files in JetStream, stored in the nats-data volume.
jetstream {
  store_dir: /data
  sync_interval: always
}

# Monitoring endpoint, used only by the healthcheck inside the network.
http_port: 8222
