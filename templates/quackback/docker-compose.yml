# Based on Quackback's docker-compose.prod.yml at v0.15.0: the app, PostgreSQL
# with pgvector, and Silo (a maintained MinIO build) for uploaded files.
services:
  quackback:
    image: ghcr.io/quackbackio/quackback:0.15.0
    restart: unless-stopped
    init: true
    depends_on:
      quackback-db:
        condition: service_healthy
      quackback-storage-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "3000"
      BASE_URL: ${BASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      # Cloudgate's web address sits in front of the app as one reverse proxy.
      TRUSTED_PROXY_HOPS: "1"
      DATABASE_URL: postgresql://quackback:${POSTGRES_PASSWORD}@quackback-db:5432/quackback
      S3_ENDPOINT: http://quackback-storage:9000
      S3_BUCKET: quackback
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "true"
      # Storage has no web address: uploads are served through the app.
      S3_PROXY: "true"
      # Email: leave the host empty and emails are written to the app's log.
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASS: ${EMAIL_SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      # AI summaries and duplicate detection (optional).
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    healthcheck:
      # The official check: Bun is always in the image (no curl or wget).
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # PostgreSQL 18 with pgvector; pg_trgm ships with it. The app creates both
  # extensions and runs its migrations on startup.
  quackback-db:
    image: pgvector/pgvector:0.8.7-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: quackback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: quackback
    command: postgres -c max_connections=200
    volumes:
      - quackback-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quackback -d quackback"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage for images and videos attached to feedback.
  quackback-storage:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
      MINIO_BROWSER: "off"
    volumes:
      - quackback-storage-data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the private upload bucket on first start, then exits.
  quackback-storage-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    restart: "no"
    depends_on:
      quackback-storage:
        condition: service_healthy
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://quackback-storage:9000 "$$STORAGE_ACCESS_KEY" "$$STORAGE_SECRET_KEY" &&
        mc mb --ignore-existing local/quackback

volumes:
  quackback-db-data:
  quackback-storage-data:
