name: Scriberr
description: "Scriberr is a self-hosted transcription app that turns audio and video recordings into text on your own server, with speaker labels and AI summaries."
version: "v1.2.0"
tags: [audio transcription, speech to text, otter alternative, whisper transcription, speaker diarization, interview transcription, rev alternative]
links:
  website: https://scriberr.app
  docs: https://github.com/rishikanthc/Scriberr#readme
  source: https://github.com/rishikanthc/Scriberr
cloudgate: "0.3.11"
compose: app
size: large
inputs:
  APP_URL: { value: "{{domains.scriberr.url}}" }
signIn:
  firstVisit:
    path: /
    note: "Create your account; the first account made is the only one, and sign-up closes after it."
domains:
  - { service: scriberr, port: 8080 }
