services:
  teable:
    image: ghcr.io/teableio/teable-community:release.2026-10-26T07-49-03Z.1718
    restart: unless-stopped
    depends_on:
      teable-db:
        condition: service_healthy
      teable-cache:
        condition: service_healthy
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      SECRET_KEY: ${SECRET_KEY}
      PRISMA_DATABASE_URL: postgresql://teable:${POSTGRES_PASSWORD}@teable-db:5432/teable
      BACKEND_CACHE_REDIS_URI: redis://default:${REDIS_PASSWORD}@teable-cache:6379/0
      NEXT_ENV_IMAGES_ALL_REMOTE: "true"
      TELEMETRY_REPORT_DISABLED: "true"
      TZ: UTC
    volumes:
      - teable-data:/app/.assets
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 10

  teable-db:
    image: postgres:15.20-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teable
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: teable
    volumes:
      - teable-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teable -d teable"]
      interval: 10s
      timeout: 5s
      retries: 10

  teable-cache:
    image: redis:7.2.17-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - teable-cache-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  teable-data:
  teable-db-data:
  teable-cache-data:
