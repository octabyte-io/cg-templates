name: Teable
description: "Teable is an open-source Airtable alternative you host yourself: linked tables and formulas, with free grid, kanban, calendar, gallery and form views."
version: "release.2026-10-26T07-49-03Z.1718"
tags: [airtable alternative, no-code database, spreadsheet database, open source airtable, smartsheet alternative, crm]
links:
  website: https://teable.ai
  docs: https://help.teable.ai/en/deploy/docker
  source: https://github.com/teableio/teable
cloudgate: "0.3.11"
compose: app
size: large
inputs:
  PUBLIC_ORIGIN: { value: "{{domains.teable.url}}" }
  SECRET_KEY: { generate: base64 }
  POSTGRES_PASSWORD: { generate: password }
  REDIS_PASSWORD: { generate: password }
signIn:
  firstVisit:
    path: /auth/signup
    note: "Sign up to become the admin, then turn off new sign-ups in System Admin > Instance settings."
domains:
  - { service: teable, port: 3000 }
