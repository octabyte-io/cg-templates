services:
  joomla:
    image: joomla:6.2.0-php8.4-apache
    restart: unless-stopped
    depends_on:
      joomla-db:
        condition: service_healthy
    environment:
      JOOMLA_DB_HOST: joomla-db
      JOOMLA_DB_NAME: joomla
      JOOMLA_DB_USER: joomla
      JOOMLA_DB_PASSWORD: ${DB_PASSWORD}
      # Installs the site on first start (no browser installer), with this administrator.
      # Sign in at https://<domain>/administrator with the username "admin".
      JOOMLA_SITE_NAME: ${SITE_NAME}
      JOOMLA_ADMIN_USER: Administrator
      JOOMLA_ADMIN_USERNAME: admin
      JOOMLA_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JOOMLA_ADMIN_EMAIL: ${ADMIN_EMAIL}
    volumes:
      # Joomla's code, configuration.php, extensions, templates and uploaded images.
      - joomla-files:/var/www/html
      # Marks requests that reached Cloudgate's proxy over HTTPS as HTTPS.
      - ../files/forwarded-https.conf:/etc/apache2/conf-enabled/forwarded-https.conf:ro

  joomla-db:
    image: mariadb:11.8.9
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: joomla
      MARIADB_USER: joomla
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - joomla-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  joomla-files:
  joomla-db-data:
