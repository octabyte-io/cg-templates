# Element's own nginx site (apps/web/docker/nginx-templates/default.conf.template
# in element-web v1.12.35), IPv4 only, with /config.json answered from SYNAPSE_URL and
# SERVER_NAME. The image runs this file through envsubst at start.
server {
    listen       ${ELEMENT_WEB_PORT};
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /version {
        add_header Cache-Control "no-cache";
    }
    location /i18n/ {
        add_header Cache-Control "no-cache";
    }
    location /usercontent/ {
        add_header Cache-Control "no-cache";
    }

    # config.json and config.<hostname>.json
    location /config {
        default_type application/json;
        add_header Cache-Control "no-cache";
        return 200 '{"default_server_config":{"m.homeserver":{"base_url":"${SYNAPSE_URL}","server_name":"${SERVER_NAME}"}},"disable_custom_urls":false,"disable_guests":true,"brand":"Element","default_theme":"light","show_labs_settings":false,"default_federate":true,"room_directory":{"servers":["${SERVER_NAME}"]},"setting_defaults":{"breadcrumbs":true}}';
    }
    location /modules {
        alias /modules;
    }

    error_page   500 502 503 504  /50x.html;
}
