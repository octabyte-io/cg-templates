services:
  synapse:
    # Synapse's official image, as in its Docker guide (docker/README.md).
    image: matrixdotorg/synapse:v1.165.0
    restart: unless-stopped
    # files/synapse-start.sh.txt writes /data/homeserver.yaml from the settings
    # below at every start (PostgreSQL, sign-ups closed, federation over 443 via
    # /.well-known/matrix/server), makes the signing key on first start, creates
    # the administrator "admin" once Synapse answers, then runs the image's own
    # /start.py, which drops to user 991.
    entrypoint: ["sh", "/cloudgate/synapse-start.sh"]
    depends_on:
      synapse-db:
        condition: service_healthy
    environment:
      SERVER_NAME: ${SERVER_NAME}
      SYNAPSE_URL: ${SYNAPSE_URL}
      DB_PASSWORD: ${DB_PASSWORD}
      REGISTRATION_SHARED_SECRET: ${REGISTRATION_SHARED_SECRET}
      MACAROON_SECRET_KEY: ${MACAROON_SECRET_KEY}
      FORM_SECRET: ${FORM_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      # Config, signing key and uploaded media.
      - synapse-data:/data
      - ../files/synapse-start.sh.txt:/cloudgate/synapse-start.sh:ro
    healthcheck:
      # The image's own check.
      test: ["CMD-SHELL", "curl -fSs http://localhost:8008/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  synapse-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: synapse
      # Synapse refuses a database whose collation isn't C.
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - synapse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 10s
      timeout: 5s
      retries: 10

  element:
    # Element's official web app image.
    image: vectorim/element-web:v1.12.35
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME}
      SYNAPSE_URL: ${SYNAPSE_URL}
    volumes:
      # Replaces the image's nginx site: the same site, but /config.json is
      # written from the settings above, so Element signs in to this Synapse.
      - ../files/element-site.conf:/etc/nginx/templates/default.conf.template:ro

  synapse-admin:
    # Ketesa (formerly Synapse Admin), the maintained admin web panel for
    # Synapse: sign in as admin to add people, reset passwords, make
    # registration tokens and manage rooms. Its config.json locks it to this
    # Synapse, so the sign-in form needs only a username and password.
    image: ghcr.io/etkecc/ketesa:v1.5.2
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - printf '{"restrictBaseUrl":"%s"}' "$$SYNAPSE_URL" > /var/public/config.json && exec /usr/local/bin/entrypoint.sh static-web-server
    environment:
      SYNAPSE_URL: ${SYNAPSE_URL}
      # IPv4, so it starts on servers without IPv6 too.
      SERVER_HOST: 0.0.0.0

volumes:
  synapse-data:
  synapse-db-data:
