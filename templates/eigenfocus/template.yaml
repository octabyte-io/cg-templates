name: Eigenfocus
description: "Self-hosted Eigenfocus gives one person project boards with a timer on every task and time reports, in place of Trello."
version: "1.6.0-free"
tags: [trello alternative, kanban board, time tracking, project management, task board]
links:
  website: https://eigenfocus.com
  docs: https://github.com/Eigenfocus/eigenfocus#installation
  source: https://github.com/Eigenfocus/eigenfocus
cloudgate: 0.1.0
compose: app
size: small
inputs:
  # The free edition has no sign-in of its own, so the whole app sits behind the
  # browser's sign-in prompt (username: admin, password: this value).
  HTTP_AUTH_PASSWORD: { generate: password }
  DEFAULT_HOST_URL: { value: "{{domains.eigenfocus.url}}" }
signIn:
  username: { value: admin }
  password: HTTP_AUTH_PASSWORD
domains:
  - { service: eigenfocus, port: 3000 }
