# From Chibisafe's official docker-compose.example.yml and Caddyfile (v6.7.0):
# the Next.js web app, the API server (SQLite database and uploads on disk) and
# Caddy, which serves the uploaded files and routes requests between the two.
services:
  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    environment:
      BASE_URL: ":80"
    volumes:
      - ../files/Caddyfile:/etc/caddy/Caddyfile:ro
      - chibisafe-uploads:/app/uploads:ro
    depends_on:
      - chibisafe
      - chibisafe-server

  chibisafe:
    image: chibisafe/chibisafe:v6.7.0
    restart: unless-stopped
    environment:
      BASE_API_URL: http://chibisafe-server:8000

  chibisafe-server:
    image: chibisafe/chibisafe-server:v6.7.0
    restart: unless-stopped
    environment:
      # Only used when the "admin" account is first created.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - chibisafe-database:/app/database
      - chibisafe-uploads:/app/uploads
      - chibisafe-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  chibisafe-database:
  chibisafe-uploads:
  chibisafe-logs:
