name: PinePods
description: "PinePods is a self-hosted podcast player: subscribe, stream and download episodes, and sync your queue and progress across web, desktop and phone apps."
version: "0.9.2"
tags: [self-hosted podcast player, pocket casts alternative, overcast alternative, podcast manager, gpodder sync server, podcast app]
links:
  website: https://www.pinepods.online
  docs: https://www.pinepods.online/docs/intro
  source: https://github.com/madeofpendletonwool/PinePods
cloudgate: 0.1.0
compose: app
size: small
inputs:
  BASE_URL: { value: "{{domains.pinepods.url}}" }
  DB_PASSWORD: { generate: password }
  VALKEY_PASSWORD: { generate: password }
  ADMIN_USERNAME:
    ask:
      label: Admin username
      description: The name you sign in to PinePods with. Cloudgate creates a strong password for it, shown afterwards on the app's variables page.
      default: admin
  ADMIN_PASSWORD: { generate: password }
  ADMIN_EMAIL:
    ask:
      label: Admin email
      description: The admin account's email address, used for password resets once email is set up in PinePods.
      format: email
  TIMEZONE:
    ask:
      label: Time zone
      description: Used for episode dates and the download schedule, as an IANA name such as Europe/Berlin.
      default: Etc/UTC
      required: false
signIn:
  username: ADMIN_USERNAME
  password: ADMIN_PASSWORD
domains:
  - { service: pinepods, port: 8040 }
