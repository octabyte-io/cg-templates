# From the official deploy/docker-compose.yml (nexu-io/open-design
# open-design-v0.27.1). The host port, the local build section and the
# optional Codex sandbox override are left out.
services:
  open-design:
    image: ghcr.io/nexu-io/od:0.27.1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
      OD_BIND_HOST: 0.0.0.0
      OD_PORT: "7456"
      OD_WEB_PORT: "7456"
      # Every request that does not come from inside the container must carry
      # this token: the browser asks for it as a password (username
      # open-design), API clients send it as a Bearer token.
      OD_API_TOKEN: ${OD_API_TOKEN}
      OD_ALLOWED_ORIGINS: ${OD_ALLOWED_ORIGINS}
    volumes:
      - open-design-data:/app/.od
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  open-design-data:
