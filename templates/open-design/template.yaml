name: Open Design
description: "Open Design is a self-hosted AI design studio that turns a brief into web pages, prototypes and slide decks in your brand's style, using your own AI key."
version: "0.27.1"
tags: [claude design alternative, ai design tool, ai prototyping, ai slide deck generator, v0 alternative, open source ai design]
links:
  website: https://open-design.ai
  docs: https://github.com/nexu-io/open-design/blob/main/deploy/README.md
  source: https://github.com/nexu-io/open-design
cloudgate: 0.1.0
compose: app
size: small
inputs:
  # The workspace's shared password: the browser asks for it on first visit
  # (username: open-design). The daemon refuses to listen on the network
  # without it.
  OD_API_TOKEN: { generate: hex }
  # The browser origin allowed to call the API.
  OD_ALLOWED_ORIGINS: { value: "{{domains.open-design.url}}" }
domains:
  - { service: open-design, port: 7456 }
