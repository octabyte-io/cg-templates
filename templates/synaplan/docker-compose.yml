# Based on Synaplan's published-image deployment (deploy/compose.yaml at v5.8.2).
# Left out: the secrets-init helper (Cloudgate generates the secrets), the
# local-tls proxy, and the opt-in profiles (Ollama local AI, Collabora office
# conversion, the compute sidecar).
x-synaplan-env: &synaplan-env
  APP_ENV: prod
  APP_DEBUG: "0"
  SYNAPLAN_PLATFORM: selfhost
  APP_VERSION: "5.8.2"
  APP_URL: ${APP_URL}
  FRONTEND_URL: ${APP_URL}
  APP_SECRET: ${APP_SECRET}
  TOKEN_SECRET: ${TOKEN_SECRET}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
  BOOTSTRAP_ADMIN_FORCE_PASSWORD_CHANGE: "false"
  FRANKENPHP_WORKER_NUM: "8"
  # The worker and scheduler wait for the web service here (default http://backend).
  SYNAPLAN_WEB_HEALTH_URL: http://synaplan/api/health
  DB_HOST: synaplan-db
  DB_PORT: "3306"
  DB_NAME: synaplan
  DB_USER: synaplan
  DB_PASSWORD: ${MARIADB_PASSWORD}
  DB_SERVER_VERSION: mariadb-12.3.2
  REDIS_DSN: redis://synaplan-redis:6379
  LOCK_DSN: redis://synaplan-redis:6379
  REALTIME_ENABLED: "true"
  REALTIME_API_URL: http://synaplan-centrifugo:8000/api
  REALTIME_API_KEY: ${REALTIME_API_KEY}
  REALTIME_TOKEN_SECRET: ${REALTIME_TOKEN_SECRET}
  REALTIME_PUBLIC_WS_URL: ""
  REALTIME_ALLOWED_ORIGINS: ${APP_URL}
  QDRANT_URL: http://synaplan-qdrant:6333
  TIKA_BASE_URL: http://synaplan-tika:9998
  SYNAPLAN_TTS_URL: http://synaplan-tts:10200
  OLLAMA_BASE_URL: ""
  AUTO_DOWNLOAD_MODELS: "false"
  WHISPER_ENABLED: "false"
  AI_DEFAULT_PROVIDER: groq
  MAILER_DSN: null://null
  LOG_FORMAT: json
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  synaplan:
    image: ghcr.io/metadist/synaplan:5.8.2
    restart: unless-stopped
    environment:
      <<: *synaplan-env
      SYNAPLAN_ROLE: web
    volumes:
      - synaplan-uploads:/var/www/backend/var/uploads
    depends_on:
      synaplan-db:
        condition: service_healthy
      synaplan-redis:
        condition: service_healthy
      synaplan-centrifugo:
        condition: service_healthy
      synaplan-tika:
        condition: service_healthy
      synaplan-qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/container-healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 300s

  synaplan-worker:
    image: ghcr.io/metadist/synaplan:5.8.2
    restart: unless-stopped
    environment:
      <<: *synaplan-env
      SYNAPLAN_ROLE: worker
    volumes:
      - synaplan-uploads:/var/www/backend/var/uploads
    depends_on:
      synaplan:
        condition: service_healthy
      synaplan-redis:
        condition: service_healthy

  synaplan-scheduler:
    image: ghcr.io/metadist/synaplan:5.8.2
    restart: unless-stopped
    environment:
      <<: *synaplan-env
      SYNAPLAN_ROLE: scheduler
    volumes:
      - synaplan-uploads:/var/www/backend/var/uploads
    depends_on:
      synaplan:
        condition: service_healthy
      synaplan-redis:
        condition: service_healthy

  synaplan-db:
    image: mariadb:13.0.2
    restart: unless-stopped
    command: ["--max-allowed-packet=256M", "--innodb-buffer-pool-size=512M"]
    environment:
      MARIADB_DATABASE: synaplan
      MARIADB_USER: synaplan
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - synaplan-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  synaplan-redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - synaplan-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  synaplan-centrifugo:
    image: centrifugo/centrifugo:v6.10.3
    restart: unless-stopped
    environment:
      CENTRIFUGO_HTTP_SERVER_ADDRESS: "0.0.0.0"
      CENTRIFUGO_HTTP_SERVER_PORT: "8000"
      CENTRIFUGO_LOG_LEVEL: info
      CENTRIFUGO_ENGINE_TYPE: redis
      CENTRIFUGO_ENGINE_REDIS_ADDRESS: redis://synaplan-redis:6379/3
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${REALTIME_TOKEN_SECRET}
      CENTRIFUGO_HTTP_API_KEY: ${REALTIME_API_KEY}
      CENTRIFUGO_ADMIN_PASSWORD: ${REALTIME_ADMIN_PASSWORD}
      CENTRIFUGO_ADMIN_SECRET: ${REALTIME_ADMIN_SECRET}
      CENTRIFUGO_CLIENT_USER_CONNECTION_LIMIT: "16"
      CENTRIFUGO_CLIENT_PING_INTERVAL: 25s
      CENTRIFUGO_CLIENT_STALE_CLOSE_DELAY: 60s
      CENTRIFUGO_ADMIN_ENABLED: "true"
      CENTRIFUGO_HEALTH_ENABLED: "true"
      CENTRIFUGO_CHANNEL_NAMESPACES: '[{"name":"widget","presence":false,"history_size":100,"history_ttl":"10m","force_recovery":true,"allow_subscribe_for_anonymous":false,"allow_subscribe_for_client":false,"allow_publish_for_subscriber":false,"allow_publish_for_client":false,"allow_publish_for_anonymous":false},{"name":"widgettyping","presence":false,"history_size":0,"history_ttl":"0s","force_recovery":false,"allow_subscribe_for_anonymous":false,"allow_subscribe_for_client":false,"allow_publish_for_subscriber":true,"allow_publish_for_client":false,"allow_publish_for_anonymous":false},{"name":"user","presence":true,"history_size":50,"history_ttl":"5m","force_recovery":true,"allow_subscribe_for_anonymous":false,"allow_subscribe_for_client":false,"allow_publish_for_subscriber":false,"allow_publish_for_client":false,"allow_publish_for_anonymous":false},{"name":"admin","presence":true,"history_size":50,"history_ttl":"5m","force_recovery":true,"allow_subscribe_for_anonymous":false,"allow_subscribe_for_client":false,"allow_publish_for_subscriber":false,"allow_publish_for_client":false,"allow_publish_for_anonymous":false},{"name":"system","presence":false,"history_size":10,"history_ttl":"1m","force_recovery":false,"allow_subscribe_for_anonymous":true,"allow_subscribe_for_client":true,"allow_publish_for_subscriber":false}]'
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${APP_URL}
    depends_on:
      synaplan-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  synaplan-tika:
    image: apache/tika:3.3.3.0
    restart: unless-stopped
    command: -h 0.0.0.0 -p 9998
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9998 && printf 'GET /version HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *'200 OK'* ]]"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  synaplan-qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    volumes:
      - synaplan-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && printf 'GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *'200 OK'* ]]"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  synaplan-tts:
    image: ghcr.io/metadist/synaplan-tts:2.1.0
    restart: unless-stopped
    environment:
      VOICES_DIR: /voices
      EXTRA_VOICES_DIR: /voices-extra
      DEFAULT_VOICE: en_US-lessac-medium

volumes:
  synaplan-uploads:
  synaplan-db-data:
  synaplan-redis-data:
  synaplan-qdrant-data:
