# The public interface's own address. ArchivesSpace serves it on port 8081 of the
# app container, and its OAI-PMH feed on port 8082; this passes both through,
# as the proxy in the official Docker package does.
server {
  listen 8081;
  server_name _;
  charset utf-8;
  client_max_body_size 16M;

  proxy_buffer_size       128k;
  proxy_buffers           4 256k;
  proxy_busy_buffers_size 256k;
  proxy_http_version 1.1;
  proxy_read_timeout 300s;

  proxy_set_header Host              $host;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header X-Real-IP         $remote_addr;

  # Resolve the app container at request time, so this starts before it does.
  resolver 127.0.0.11 valid=30s;
  set $app archivesspace;

  location /oai {
    proxy_pass http://$app:8082;
  }

  location / {
    proxy_pass http://$app:8081;
  }
}
