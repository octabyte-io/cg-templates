name: pretalx
description: "Self-hosted pretalx runs your conference's call for papers, team review of talk proposals, speaker emails and the public schedule on your own server."
version: "v2026.2.1"
tags: [sessionize alternative, call for papers software, conference schedule software, speaker management, oxford abstracts alternative, open source cfp tool]
links:
  website: https://pretalx.com
  docs: https://docs.pretalx.org
  source: https://github.com/pretalx/pretalx
cloudgate: 0.1.0
compose: app
size: medium
inputs:
  PRETALX_URL: { value: "{{domains.pretalx.url}}" }
  DB_PASSWORD: { generate: password }
  ADMIN_EMAIL:
    ask:
      label: Admin email
      description: You sign in to pretalx with this email. Cloudgate creates a strong password for it, shown afterwards on the app's variables page.
      format: email
  ADMIN_PASSWORD: { generate: password }
  MAIL_FROM:
    ask:
      label: Send emails from (optional)
      description: The address speaker notifications and password resets come from. Leave the email questions empty to add them later on the app's variables page.
      format: email
      required: false
  MAIL_HOST:
    ask:
      label: Email server (SMTP host, optional)
      description: From your email sending service, for example smtp.postmarkapp.com. pretalx needs it to email speakers, reviewers and password resets.
      required: false
  MAIL_PORT:
    ask:
      label: Email server port
      description: 587 (STARTTLS) works with most email services; 465 uses SSL.
      default: "587"
      format: number
      required: false
  MAIL_USERNAME:
    ask:
      label: Email server username (optional)
      required: false
  MAIL_PASSWORD:
    ask:
      label: Email server password (optional)
      secret: true
      required: false
signIn:
  username: ADMIN_EMAIL
  password: ADMIN_PASSWORD
domains:
  - { service: pretalx, port: 80 }
files:
  - { path: nginx.conf }
