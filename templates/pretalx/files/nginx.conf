# Sits between Cloudgate's proxy and pretalx, as pretalx-docker's README and its
# reverse-proxy example (reverse-proxy-examples/nginx) describe: serves uploads
# from /media/ and passes everything else to the pretalx container, which serves
# its own static files.
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 50m;

    location /media/ {
        alias /data/media/;
        add_header Content-Disposition 'attachment';
        add_header X-Content-Type-Options nosniff;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://pretalx-app:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudgate's proxy terminates HTTPS and says so in X-Forwarded-Proto.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }
}
