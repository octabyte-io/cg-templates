name: Invio
description: "Invio is simple self-hosted invoicing for freelancers: create invoices, share them as a PDF or link, and export Factur-X, ZUGFeRD and PEPPOL UBL e-invoices."
version: "2.4.1"
tags: [invoicing, freshbooks alternative, wave alternative, e-invoicing, zugferd, peppol, freelancers]
links:
  website: https://invio.dev
  docs: https://github.com/kittendevv/Invio/wiki
  source: https://github.com/kittendevv/Invio
cloudgate: 0.1.0
compose: app
size: xsmall
inputs:
  ADMIN_USER: { value: "admin" }
  ADMIN_PASS: { generate: password }
  JWT_SECRET: { generate: hex }
  ORIGIN: { value: "{{domains.invio.url}}" }
domains:
  - { service: invio, port: 8000 }
