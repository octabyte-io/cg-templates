services:
  hortusfox:
    image: ghcr.io/danielbrendel/hortusfox-web:v6.4
    restart: unless-stopped
    depends_on:
      hortusfox-db:
        condition: service_healthy
    environment:
      # The image's entrypoint creates this admin account on the first start, if there is none.
      APP_ADMIN_EMAIL: ${ADMIN_EMAIL}
      APP_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      APP_TIMEZONE: ${TIMEZONE:-UTC}
      # The image defaults to showing PHP errors in the page.
      APP_DEBUG: "false"
      DB_HOST: hortusfox-db
      DB_PORT: 3306
      DB_DATABASE: hortusfox
      DB_USERNAME: hortusfox
      DB_PASSWORD: ${DB_PASSWORD}
      DB_CHARSET: utf8mb4
    volumes:
      # The volumes of HortusFox's official docker-compose.yml.
      - hortusfox-images:/var/www/html/public/img
      - hortusfox-attachments:/var/www/html/public/attachments
      - hortusfox-logs:/var/www/html/app/logs
      - hortusfox-backup:/var/www/html/public/backup
      - hortusfox-themes:/var/www/html/public/themes
      - hortusfox-migrate:/var/www/html/app/migrations

  hortusfox-db:
    image: mariadb:11.8.9
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: hortusfox
      MARIADB_USER: hortusfox
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: 1
      MARIADB_DISABLE_UPGRADE_BACKUP: 1
      MARIADB_INITDB_SKIP_TZINFO: 1
    volumes:
      - hortusfox-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  hortusfox-images:
  hortusfox-attachments:
  hortusfox-logs:
  hortusfox-backup:
  hortusfox-themes:
  hortusfox-migrate:
  hortusfox-db-data:
