# Based on the production setup in SolidPing's Docker Compose guide
# (https://solidping.io/docs/installation/docker-compose).
services:
  solidping:
    image: ghcr.io/fclairamb/solidping:0.50.2
    restart: unless-stopped
    depends_on:
      solidping-db:
        condition: service_healthy
    environment:
      SP_DB_TYPE: postgres
      SP_DB_URL: postgresql://solidping:${POSTGRES_PASSWORD}@solidping-db:5432/solidping?sslmode=disable
      SP_BASE_URL: ${SP_BASE_URL}
      SP_AUTH_JWT_SECRET: ${SP_AUTH_JWT_SECRET}
      # The first admin account is created with this address on the first
      # start; its password is "solidpass" and must be changed at first sign-in.
      SP_ADMIN_EMAIL: ${SP_ADMIN_EMAIL}
      # The worker name comes from the hostname unless set here, and it must
      # match ^[a-z][a-z0-9-]{2,20}$, which a container id may not.
      SP_NODE_NAME: solidping
      SP_LOG_LEVEL: info
    volumes:
      # Uploaded files (logos, status-page assets, incident screenshots).
      - solidping-data:/data
    healthcheck:
      test: ["CMD", "/app/solidping", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  solidping-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: solidping
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: solidping
    volumes:
      - solidping-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solidping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  solidping-data:
  solidping-db-data:
