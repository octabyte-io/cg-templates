name: Piwigo
description: "Piwigo is a free, self-hosted photo gallery: organise large photo collections in albums with tags and share them publicly or privately."
version: "16.5.0"
tags: [self-hosted photo gallery, open source photo gallery, flickr alternative, smugmug alternative, photo management, digital asset management]
links:
  website: https://piwigo.org
  docs: https://piwigo.org/guides
  source: https://github.com/Piwigo/Piwigo
cloudgate: 0.1.0
compose: app
size: small
inputs:
  DB_PASSWORD: { generate: password }
  DB_ROOT_PASSWORD: { generate: password }
  # The password of the webmaster "admin", created on first start.
  ADMIN_PASSWORD: { generate: password }
  ADMIN_EMAIL:
    ask:
      label: Admin email
      description: The email of the webmaster account "admin". Cloudgate creates a strong password for it, shown afterwards on the app's variables page.
      format: email
  TIMEZONE:
    ask:
      label: Time zone
      description: Used for dates and times shown in the gallery, as an IANA name such as Europe/Berlin.
      default: Etc/UTC
      required: false
signIn:
  username: { value: admin }
  password: ADMIN_PASSWORD
domains:
  - { service: piwigo, port: 80 }
files:
  - { path: piwigo-install.php.txt }
