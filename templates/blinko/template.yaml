name: Blinko
description: "Blinko is a self-hosted notes app for quick thoughts and longer Markdown notes, with optional AI search and chat over your own notes."
version: "1.8.9"
tags: [mem alternative, flomo alternative, ai notes, quick notes, markdown notes, self-hosted notes, google keep alternative]
links:
  website: https://blinko.space
  docs: https://docs.blinko.space
  source: https://github.com/blinko-space/blinko
cloudgate: "0.3.11"
compose: app
size: small
inputs:
  BLINKO_URL: { value: "{{domains.blinko.url}}" }
  NEXTAUTH_SECRET: { generate: base64 }
  POSTGRES_PASSWORD: { generate: password }
signIn:
  firstVisit:
    path: /signup
    note: "Create your account; the first account made is the admin."
domains:
  - { service: blinko, port: 1111 }
