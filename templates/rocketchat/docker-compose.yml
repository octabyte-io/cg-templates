# From RocketChat/rocketchat-compose (compose.yml, compose.database.yml and compose.nats.yml, the
# minimal stack its docs start with): Rocket.Chat, MongoDB as a one-member replica set, and NATS,
# the message broker Rocket.Chat's compose file points it at. Left out: Traefik (Cloudgate serves
# HTTPS), Prometheus, Grafana and the exporters. MongoDB is the official mongo image at 8.0, the
# version Rocket.Chat 9.0 supports (https://releases.rocket.chat/9.0.0/info), in place of the
# compose file's three-container mongodb-community-server setup.
services:
  rocketchat:
    image: registry.rocket.chat/rocketchat/rocket.chat:9.0.0
    restart: unless-stopped
    depends_on:
      rocketchat-db:
        condition: service_healthy
      rocketchat-nats:
        condition: service_started
    environment:
      ROOT_URL: ${ROOT_URL}
      PORT: "3000"
      DEPLOY_METHOD: docker
      DEPLOY_PLATFORM: compose
      MONGO_URL: mongodb://rocketchat-db:27017/rocketchat?replicaSet=rs0
      TRANSPORTER: monolith+nats://rocketchat-nats:4222
      # Creates the first admin on the first start (Rocket.Chat names it "admin") and marks the
      # setup wizard done, so its open "create admin" step is never shown and its "register your
      # workspace" step (which has no skip) doesn't block the admin. Registering with Rocket.Chat
      # Cloud stays optional, under Administration > Registration.
      OVERWRITE_SETTING_Show_Setup_Wizard: completed
      ADMIN_NAME: Admin
      ADMIN_PASS: ${ADMIN_PASS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    # No volume: uploads are kept in MongoDB (GridFS) unless an admin picks other storage.

  # MongoDB as a one-member replica set; the healthcheck starts the set on the first run.
  # Reached only inside the stack, with no password, as in the official compose file.
  rocketchat-db:
    image: mongo:8.0.38
    hostname: rocketchat-db
    restart: unless-stopped
    command: --replSet rs0 --bind_ip_all
    volumes:
      - rocketchat-db-data:/data/db
      - rocketchat-db-config:/data/configdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'if (!db.isMaster().primary) { try { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"rocketchat-db:27017\" }] }) } catch (e) {} }; quit(db.isMaster().ismaster ? 0 : 1)'"]
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 30s
      start_interval: 5s

  rocketchat-nats:
    image: nats:2.14.10-alpine
    restart: unless-stopped
    command: --http_port 8222

volumes:
  rocketchat-db-data:
  rocketchat-db-config:
