name: Grav
description: "Self-hosted Grav is a free flat-file CMS: build a fast website or blog in Markdown with an admin panel, themes and plugins, and no database."
version: "2.2.29"
tags: [flat-file cms, squarespace alternative, wix alternative, markdown cms, self-hosted cms, website builder, open source cms]
links:
  website: https://getgrav.org
  docs: https://learn.getgrav.org
  source: https://github.com/getgrav/grav
cloudgate: "0.3.11"
compose: app
size: xsmall
inputs:
  TIMEZONE:
    ask:
      label: Time zone
      description: Used for dates and times in Grav, as an IANA name such as Europe/Berlin.
      default: Etc/UTC
      required: false
signIn:
  firstVisit:
    path: /admin
    note: "Create the administrator account on the welcome screen; there is no default login."
domains:
  - { service: grav, port: 80 }
