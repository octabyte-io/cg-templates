# Based on frappe_docker's pwd.yml (github.com/frappe/frappe_docker, branch main),
# run with the official Frappe HR image. Pinned to v15.64.8: every v16.x tag of
# ghcr.io/frappe/hrms checked so far holds version-15 code (Frappe HR 15.x on
# ERPNext 15 and Frappe 15), so the v15 tag is the honest one. MariaDB is 10.6,
# the version Frappe v15 is documented with. Redis pinned as in frappe_docker's
# compose.redis.yaml; a generated database root password and Administrator
# password; the site migrated at each start.

# Settings shared by every container that runs the Frappe HR image
# (Frappe, ERPNext and Frappe HR in one bench).
x-hrms: &hrms
  image: ghcr.io/frappe/hrms:v15.64.8
  restart: unless-stopped
  volumes:
    - hrms-sites:/home/frappe/frappe-bench/sites
    - hrms-logs:/home/frappe/frappe-bench/logs

# The long-running containers start once the site exists and is migrated.
x-after-site: &after-site
  depends_on:
    create-site:
      condition: service_completed_successfully

services:
  # nginx in front of backend and websocket. Every request goes to the one
  # site, named "frontend", whatever web address it came in on.
  frontend:
    <<: [*hrms, *after-site]
    command: [nginx-entrypoint.sh]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: frontend
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m

  # The web application (gunicorn on port 8000).
  backend:
    <<: [*hrms, *after-site]

  # Real-time updates in the browser (socket.io on port 9000).
  websocket:
    <<: [*hrms, *after-site]
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]

  # Background jobs: payroll runs, emails, reports, imports.
  queue-short:
    <<: [*hrms, *after-site]
    command: [bench, worker, --queue, "short,default"]

  queue-long:
    <<: [*hrms, *after-site]
    command: [bench, worker, --queue, "long,default,short"]

  # Scheduled jobs, such as leave allocation, attendance and reminders.
  scheduler:
    <<: [*hrms, *after-site]
    command: [bench, schedule]

  # Runs once at each start: writes the bench-wide config (database and Redis
  # addresses) into the sites volume.
  configurator:
    <<: *hrms
    restart: "no"
    entrypoint: [bash, -c]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: hrms-db
      DB_PORT: "3306"
      REDIS_CACHE: hrms-redis-cache:6379
      REDIS_QUEUE: hrms-redis-queue:6379
      SOCKETIO_PORT: "9000"
    depends_on:
      hrms-db:
        condition: service_healthy
      hrms-redis-cache:
        condition: service_started
      hrms-redis-queue:
        condition: service_started

  # Runs once at each start. On the first start it creates the site with
  # ERPNext and Frappe HR (which needs ERPNext) and the Administrator account
  # (password ADMIN_PASSWORD); on later starts it applies migrations, so an
  # image update just works. Each time it sets the site's public address, used in emails and links.
  create-site:
    <<: *hrms
    restart: "no"
    entrypoint: [bash, -c]
    command:
      - >
        set -e;
        wait-for-it -t 120 hrms-db:3306;
        wait-for-it -t 120 hrms-redis-cache:6379;
        wait-for-it -t 120 hrms-redis-queue:6379;
        if [ -f sites/frontend/site_config.json ]; then
        bench --site frontend migrate;
        else
        bench new-site frontend --mariadb-user-host-login-scope='%'
        --db-root-username=root --db-root-password="$$DB_ROOT_PASSWORD"
        --admin-password="$$ADMIN_PASSWORD" --install-app erpnext --install-app hrms --set-default;
        fi;
        bench --site frontend set-config host_name "$$APP_URL";
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      APP_URL: ${APP_URL}
    depends_on:
      configurator:
        condition: service_completed_successfully

  hrms-db:
    image: mariadb:10.6.28
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - hrms-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10

  hrms-redis-cache:
    image: redis:8.6.8-alpine
    restart: unless-stopped

  hrms-redis-queue:
    image: redis:8.6.8-alpine
    restart: unless-stopped
    volumes:
      - hrms-redis-queue-data:/data

volumes:
  hrms-sites:
  hrms-logs:
  hrms-db-data:
  hrms-redis-queue-data:
