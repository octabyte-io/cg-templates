# From Apache Fineract's docker-compose-postgresql.yml (1.12.1) and the Mifos X web app's
# docker instructions. Fineract serves plain HTTP on 8080 inside the network (upstream
# defaults to a self-signed HTTPS 8443); the web app's nginx passes /fineract-provider/
# through to it, so the browser reaches the app and its API at one address.

services:
  mifos:
    image: openmf/web-app:1.12
    restart: unless-stopped
    depends_on:
      mifos-fineract:
        condition: service_healthy
    environment:
      FINERACT_API_URLS: ${APP_URL}
      FINERACT_API_URL: ${APP_URL}
      FINERACT_API_PROVIDER: /fineract-provider/api
      FINERACT_API_VERSION: /v1
      FINERACT_API_ACTUATOR: /fineract-provider
      FINERACT_PLATFORM_TENANT_IDENTIFIER: default
      FINERACT_PLATFORM_TENANTS_IDENTIFIER: default
      MIFOS_ALLOW_SERVER_SWITCH_SELECTOR: "false"
      MIFOS_DISPLAY_TENANT_SELECTOR: "false"
      MIFOS_DEFAULT_LANGUAGE: en-US
    volumes:
      - ../files/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  mifos-fineract:
    image: apache/fineract:1.12.1
    restart: unless-stopped
    depends_on:
      mifos-db:
        condition: service_healthy
      mifos-content-perms:
        condition: service_completed_successfully
    environment:
      FINERACT_NODE_ID: "1"
      FINERACT_SERVER_PORT: "8080"
      FINERACT_SERVER_SSL_ENABLED: "false"
      FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
      FINERACT_HIKARI_JDBC_URL: jdbc:postgresql://mifos-db:5432/fineract_tenants
      FINERACT_HIKARI_USERNAME: fineract
      FINERACT_HIKARI_PASSWORD: ${DB_PASSWORD}
      FINERACT_HIKARI_MINIMUM_IDLE: "3"
      FINERACT_HIKARI_MAXIMUM_POOL_SIZE: "10"
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: mifos-db
      FINERACT_DEFAULT_TENANTDB_PORT: "5432"
      FINERACT_DEFAULT_TENANTDB_UID: fineract
      FINERACT_DEFAULT_TENANTDB_PWD: ${DB_PASSWORD}
      FINERACT_DEFAULT_TENANTDB_CONN_PARAMS: ""
      FINERACT_DEFAULT_TENANTDB_IDENTIFIER: default
      FINERACT_DEFAULT_TENANTDB_NAME: fineract_default
      FINERACT_DEFAULT_TENANTDB_DESCRIPTION: Default tenant
      FINERACT_DEFAULT_TENANTDB_TIMEZONE: ${TIMEZONE:-UTC}
      FINERACT_DEFAULT_TENANTDB_MASTER_PASSWORD: ${MASTER_PASSWORD}
      FINERACT_DEFAULT_MASTER_PASSWORD: ${MASTER_PASSWORD}
      FINERACT_CONTENT_FILESYSTEM_ROOT_FOLDER: /fineract-content
      FINERACT_MANAGEMENT_ENDPOINT_WEB_EXPOSURE_INCLUDE: health,info
      FINERACT_REMOTE_JOB_MESSAGE_HANDLER_SPRING_EVENTS_ENABLED: "true"
      JAVA_TOOL_OPTIONS: >-
        -Xmx1536m -XX:+UseContainerSupport -XX:+UseStringDeduplication
        --add-exports=java.naming/com.sun.jndi.ldap=ALL-UNNAMED
        --add-opens=java.base/java.lang=ALL-UNNAMED
        --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
        --add-opens=java.base/java.io=ALL-UNNAMED
        --add-opens=java.base/java.security=ALL-UNNAMED
        --add-opens=java.base/java.util=ALL-UNNAMED
        --add-opens=java.management/javax.management=ALL-UNNAMED
        --add-opens=java.naming/javax.naming=ALL-UNNAMED
    volumes:
      - mifos-content:/fineract-content
    # The image is Alpine-based (busybox wget). The first start creates the database
    # tables, which takes a few minutes.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/fineract-provider/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 15m

  # Fineract runs as "nobody"; this lets it write uploaded documents and images.
  mifos-content-perms:
    image: postgres:16.16-alpine
    restart: "no"
    user: root
    command: [chown, -R, "65534:65534", /fineract-content]
    volumes:
      - mifos-content:/fineract-content

  mifos-db:
    image: postgres:16.16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fineract
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: fineract_tenants
    volumes:
      - mifos-db-data:/var/lib/postgresql/data
      - ../files/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fineract -d fineract_tenants"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mifos-content:
  mifos-db-data:
