# From Coze Studio's docker/docker-compose.yml at v0.5.1: the web front end (nginx), the server,
# MySQL, Redis, Elasticsearch, a MinIO-compatible file store, Milvus (with its etcd) and NSQ,
# as upstream. Changes:
#   - Images are pinned. MinIO no longer publishes images, so the file store is Silo, a
#     maintained build of MinIO; the Bitnami images (no longer updated) are replaced by the
#     official Redis, Elasticsearch and etcd images. No container is privileged.
#   - Upstream's start scripts run as one-shot services: "mysql-migrate" applies the latest
#     database schema with Atlas (upstream downloads Atlas at each start), "elasticsearch-init"
#     creates the search indexes, "minio-init" creates the buckets and loads Coze Studio's
#     default icons from its repository at v0.5.1 (they are pictures, which files/ can't hold).
#   - Elasticsearch's memory is capped at 1 GB; upstream leaves it at half the server's memory.
#   - Passwords and secrets are generated instead of upstream's fixed ones; nsqadmin and the
#     published ports are left out.
x-coze-env: &coze-env
  LISTEN_ADDR: ":8888"
  LOG_LEVEL: info
  MAX_REQUEST_BODY_SIZE: "1073741824"
  SERVER_HOST: ${APP_URL}
  USE_SSL: "0"
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: opencoze
  MYSQL_USER: coze
  MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  MYSQL_DSN: "coze:${MYSQL_PASSWORD}@tcp(mysql:3306)/opencoze?charset=utf8mb4&parseTime=True"
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  FILE_UPLOAD_COMPONENT_TYPE: storage
  STORAGE_TYPE: minio
  # Cloudgate serves the web address over HTTPS, so uploads go over HTTPS too.
  STORAGE_UPLOAD_HTTP_SCHEME: https
  STORAGE_BUCKET: opencoze
  MINIO_ROOT_USER: coze
  MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
  MINIO_AK: coze
  MINIO_SK: ${MINIO_PASSWORD}
  MINIO_ENDPOINT: minio:9000
  MINIO_API_HOST: http://minio:9000
  MINIO_USE_SSL: "false"
  ES_ADDR: http://elasticsearch:9200
  ES_VERSION: v8
  ES_USERNAME: ""
  ES_PASSWORD: ""
  ES_NUMBER_OF_SHARDS: "1"
  ES_NUMBER_OF_REPLICAS: "0"
  COZE_MQ_TYPE: nsq
  MQ_NAME_SERVER: nsqd:4150
  VECTOR_STORE_TYPE: milvus
  MILVUS_ADDR: milvus:19530
  PLUGIN_AES_AUTH_SECRET: ${PLUGIN_AES_AUTH_SECRET}
  PLUGIN_AES_STATE_SECRET: ${PLUGIN_AES_STATE_SECRET}
  PLUGIN_AES_OAUTH_TOKEN_SECRET: ${PLUGIN_AES_OAUTH_TOKEN_SECRET}

services:
  coze-web:
    image: cozedev/coze-studio-web:0.5.1
    restart: unless-stopped
    depends_on:
      coze-server:
        condition: service_healthy
    volumes:
      - ../files/nginx-default.conf:/etc/nginx/conf.d/default.conf:ro

  coze-server:
    image: cozedev/coze-studio-server:0.5.1
    restart: unless-stopped
    # Settings not listed here (models, embedding, OCR, code runner) keep the defaults in the
    # image's /app/.env; models are added afterwards on the admin page.
    command: ["/app/opencoze"]
    environment:
      <<: *coze-env
    depends_on:
      mysql-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      elasticsearch-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      milvus:
        condition: service_healthy
      nsqd:
        condition: service_healthy
    healthcheck:
      # The server opens its port only once it has connected to every service it uses. A port
      # check, since every HTTP path without a session writes an error line to the log.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8888"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: opencoze
      MYSQL_USER: coze
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ../files/mysql-schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Over TCP, so it passes only after the first-start schema has loaded.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ucoze -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mysql-migrate:
    image: arigaio/atlas:1.3.10-community-alpine
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - schema
      - apply
      - --url
      - mysql://coze:${MYSQL_PASSWORD}@mysql:3306/opencoze
      - --to
      - file:///opencoze-schema.hcl
      - --exclude
      - atlas_schema_revisions,table_*
      - --auto-approve
    volumes:
      # Upstream's docker/atlas/opencoze_latest_schema.hcl (.txt: the kind of file a template ships).
      - ../files/opencoze-schema.hcl.txt:/opencoze-schema.hcl:ro

  redis:
    image: redis:8.2.11-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: elasticsearch:8.19.25
    restart: unless-stopped
    # Installs the Chinese text analyzer Coze Studio's indexes use (upstream ships its zip),
    # once per container, then starts Elasticsearch as the image does.
    entrypoint:
      - bash
      - -c
      - |
        if [ ! -d plugins/analysis-smartcn ]; then
          elasticsearch-plugin install --batch analysis-smartcn || exit 1
        fi
        exec /bin/tini -- /usr/local/bin/docker-entrypoint.sh eswrapper
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      cluster.routing.allocation.disk.watermark.low: 99%
      cluster.routing.allocation.disk.watermark.high: 99%
      cluster.routing.allocation.disk.watermark.flood_stage: 99%
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  elasticsearch-init:
    image: elasticsearch:8.19.25
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    # Upstream's setup_es.sh, shortened: registers each index template and creates its index.
    entrypoint:
      - bash
      - -c
      - |
        set -eu
        es=http://elasticsearch:9200
        for file in /es_index_schema/*.index-template.json; do
          name=$$(basename "$$file" .index-template.json)
          if ! curl -fsI "$$es/_index_template/$$name" >/dev/null; then
            curl -fsS -X PUT "$$es/_index_template/$$name" -H 'Content-Type: application/json' -d @"$$file"
            echo
          fi
          if ! curl -fs "$$es/_cat/indices/$$name" >/dev/null; then
            curl -fsS -X PUT "$$es/$$name"
            echo
            curl -fsS -X PUT "$$es/$$name/_settings" -H 'Content-Type: application/json' -d '{"index":{"refresh_interval":"10ms"}}'
            echo
          fi
        done
    volumes:
      - ../files/coze_resource.index-template.json:/es_index_schema/coze_resource.index-template.json:ro
      - ../files/project_draft.index-template.json:/es_index_schema/project_draft.index-template.json:ro

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: coze
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 30

  minio-init:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_PASSWORD: ${MINIO_PASSWORD}
    entrypoint:
      - bash
      - -c
      - |
        set -u
        mc alias set coze http://minio:9000 coze "$$MINIO_PASSWORD" || exit 1
        mc mb --ignore-existing coze/opencoze coze/milvus || exit 1
        # Default icons (models, plugins, workflow nodes), from the release this template installs.
        base=https://raw.githubusercontent.com/coze-dev/coze-studio/v0.5.1/docker/volumes/minio
        missing=0
        while read -r icon; do
          [ -n "$$icon" ] || continue
          mc stat "coze/opencoze/$$icon" >/dev/null 2>&1 && continue
          if curl -fsL --retry 3 -o /tmp/icon "$$base/$$icon"; then
            mc cp --quiet /tmp/icon "coze/opencoze/$$icon" >/dev/null || missing=$$((missing + 1))
          else
            missing=$$((missing + 1))
          fi
        done < /minio-icons.txt
        echo "Default icons loaded ($$missing could not be fetched; the next start retries them)."
    volumes:
      - ../files/minio-icons.txt:/minio-icons.txt:ro

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 10s
      retries: 20

  milvus:
    image: milvusdb/milvus:v2.5.10
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_BUCKET_NAME: milvus
      MINIO_ACCESS_KEY_ID: coze
      MINIO_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
      MINIO_USE_SSL: "false"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

  nsqlookupd:
    image: nsqio/nsq:v1.2.1
    restart: unless-stopped
    command: /nsqlookupd
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4161/ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  nsqd:
    image: nsqio/nsq:v1.2.1
    restart: unless-stopped
    command: /nsqd --lookupd-tcp-address=nsqlookupd:4160 --broadcast-address=nsqd --data-path=/data
    depends_on:
      nsqlookupd:
        condition: service_healthy
    volumes:
      - nsqd-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4151/ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  redis-data:
  elasticsearch-data:
  minio-data:
  etcd-data:
  milvus-data:
  nsqd-data:
