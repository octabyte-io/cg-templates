# Coze Studio's docker/nginx/conf.d/default.conf at v0.5.1, without the commented-out HTTPS
# server (Cloudgate serves the web address over HTTPS) and with the scheme of rewritten file
# links taken from the proxy in front, so pictures load over HTTPS too.
map $http_x_forwarded_proto $coze_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # From upstream's nginx.conf: no limit on upload size.
    client_max_body_size 0;

    # Static resources
    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index  index.html index.htm;

        etag on;
        if_modified_since exact;
        add_header Cache-Control "no-cache";
    }

    # API proxy
    location ~ ^/(api|v[1-3]|admin)(/|$) {
        proxy_pass http://coze-server:8888;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $coze_scheme;
        proxy_set_header Accept-Encoding "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 600s;   # long answers stream as server-sent events

        # Links to stored files point at the internal file store; rewrite them to this address.
        sub_filter 'http://minio:9000' '$coze_scheme://$http_host/local_storage';
        sub_filter ':8889' ':8888/local_storage';
        sub_filter 'minio:9000' '$http_host/local_storage';
        sub_filter_once off;
        sub_filter_types 'application/json' 'text/event-stream';
    }

    # Stored files (pictures, uploads), served from the file store.
    location /local_storage/ {
        if ($args ~* "(^|.*&)x-wf-file_name=[^&]*(&.*|$)") {
            set $args $1$2;
        }
        if ($args ~* "^x-wf-file_name=[^&]*$") {
            set $args "";
        }

        rewrite ^/local_storage/(.*)$ /$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host minio:9000;
    }
}
