# Based on frappe_docker's pwd.yml (github.com/frappe/frappe_docker, branch main),
# with Redis pinned as in its compose.redis.yaml override, a generated database
# root password and Administrator password, and the site migrated at each start.

# Settings shared by every container that runs the ERPNext image.
x-erpnext: &erpnext
  image: frappe/erpnext:v16.55.0
  restart: unless-stopped
  volumes:
    - erpnext-sites:/home/frappe/frappe-bench/sites
    - erpnext-logs:/home/frappe/frappe-bench/logs

# The long-running containers start once the site exists and is migrated.
x-after-site: &after-site
  depends_on:
    create-site:
      condition: service_completed_successfully

services:
  # nginx in front of backend and websocket. Every request goes to the one
  # site, named "frontend", whatever web address it came in on.
  frontend:
    <<: [*erpnext, *after-site]
    command: [nginx-entrypoint.sh]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: frontend
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m

  # The web application (gunicorn on port 8000).
  backend:
    <<: [*erpnext, *after-site]

  # Real-time updates in the browser (socket.io on port 9000).
  websocket:
    <<: [*erpnext, *after-site]
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]

  # Background jobs: emails, reports, imports.
  queue-short:
    <<: [*erpnext, *after-site]
    command: [bench, worker, --queue, "short,default"]

  queue-long:
    <<: [*erpnext, *after-site]
    command: [bench, worker, --queue, "long,default,short"]

  # Scheduled jobs, such as recurring invoices and auto-repeat documents.
  scheduler:
    <<: [*erpnext, *after-site]
    command: [bench, schedule]

  # Runs once at each start: writes the bench-wide config (database and Redis
  # addresses) into the sites volume.
  configurator:
    <<: *erpnext
    restart: "no"
    entrypoint: [bash, -c]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: erpnext-db
      DB_PORT: "3306"
      REDIS_CACHE: erpnext-redis-cache:6379
      REDIS_QUEUE: erpnext-redis-queue:6379
      SOCKETIO_PORT: "9000"
    depends_on:
      erpnext-db:
        condition: service_healthy
      erpnext-redis-cache:
        condition: service_started
      erpnext-redis-queue:
        condition: service_started

  # Runs once at each start. On the first start it creates the site with the
  # ERPNext app and the Administrator account (password ADMIN_PASSWORD); on
  # later starts it applies migrations, so an image update just works. Each
  # time it sets the site's public address, used in emails and links.
  create-site:
    <<: *erpnext
    restart: "no"
    entrypoint: [bash, -c]
    command:
      - >
        set -e;
        wait-for-it -t 120 erpnext-db:3306;
        wait-for-it -t 120 erpnext-redis-cache:6379;
        wait-for-it -t 120 erpnext-redis-queue:6379;
        if [ -f sites/frontend/site_config.json ]; then
        bench --site frontend migrate;
        else
        bench new-site frontend --mariadb-user-host-login-scope='%'
        --db-root-username=root --db-root-password="$$DB_ROOT_PASSWORD"
        --admin-password="$$ADMIN_PASSWORD" --install-app erpnext --set-default;
        fi;
        bench --site frontend set-config host_name "$$APP_URL";
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      APP_URL: ${APP_URL}
    depends_on:
      configurator:
        condition: service_completed_successfully

  erpnext-db:
    image: mariadb:11.8.9
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-snapshot-isolation=OFF
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - erpnext-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10

  erpnext-redis-cache:
    image: redis:8.6.8-alpine
    restart: unless-stopped

  erpnext-redis-queue:
    image: redis:8.6.8-alpine
    restart: unless-stopped
    volumes:
      - erpnext-redis-queue-data:/data

volumes:
  erpnext-sites:
  erpnext-logs:
  erpnext-db-data:
  erpnext-redis-queue-data:
