# Based on Lightdash's official docker-compose.yml (repo root, tag 3.278.1): the
# Lightdash server (which also runs the scheduler), PostgreSQL with pgvector,
# MinIO for the S3 storage Lightdash needs to start, and the browserless
# headless browser used for scheduled deliveries, Slack previews and image/PDF
# exports. Only the settings the app needs are kept; the rest of the official
# file passes optional integrations (SSO, SMTP, AI, Slack, GitHub) through empty.
# MinIO gets its own web address so the download links Lightdash signs for CSV,
# Excel and image exports open in the browser.
services:
  lightdash:
    image: lightdash/lightdash:3.278.1
    restart: unless-stopped
    depends_on:
      lightdash-db:
        condition: service_healthy
      lightdash-storage:
        condition: service_healthy
      lightdash-browser:
        condition: service_started
    environment:
      PGHOST: lightdash-db
      PGPORT: "5432"
      PGUSER: lightdash
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: lightdash
      PORT: "8080"
      SITE_URL: ${SITE_URL}
      LIGHTDASH_SECRET: ${LIGHTDASH_SECRET}
      # Cloudgate serves the app over HTTPS through its proxy.
      SECURE_COOKIES: "true"
      TRUST_PROXY: "true"
      LIGHTDASH_INSTALL_TYPE: docker_image
      LIGHTDASH_MIGRATION_EXECUTION_MODE: compose
      LIGHTDASH_MAX_PAYLOAD: 5mb
      ALLOW_MULTIPLE_ORGS: "false"
      SCHEDULER_ENABLED: "true"
      HEADLESS_BROWSER_HOST: lightdash-browser
      HEADLESS_BROWSER_PORT: "3000"
      S3_ENDPOINT: http://lightdash-storage:9000
      S3_PUBLIC_ENDPOINT: ${STORAGE_URL}
      S3_REGION: us-east-1
      S3_BUCKET: default
      S3_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      S3_SECRET_KEY: ${STORAGE_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "true"
    # The image has Node but neither curl nor wget.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 3m

  lightdash-db:
    image: pgvector/pgvector:0.8.1-pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: lightdash
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: lightdash
    volumes:
      - lightdash-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightdash"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The official file's MinIO, started by the project's own docker/init-minio.sh
  # (files/init-minio.sh.txt): it creates the "default" bucket, expires its
  # files after a day (exports and query results are temporary) and allows
  # browser uploads.
  lightdash-storage:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    entrypoint: ["sh", "/init-minio.sh"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
      MINIO_DEFAULT_BUCKETS: default
      MINIO_EXPIRATION_DAYS: "1"
    volumes:
      - ../files/init-minio.sh.txt:/init-minio.sh:ro
      - lightdash-storage-data:/data
    # The image has no curl or wget; the start script sets up the "local" alias.
    healthcheck:
      test: ["CMD", "mc", "ls", "local/default"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Official docker/Dockerfile.headless-browser is only "FROM" this image.
  lightdash-browser:
    image: ghcr.io/browserless/chromium:v2.49.0
    restart: unless-stopped
    environment:
      # Lightdash waits up to 180 s for a dashboard to render before a
      # screenshot; its docs say the browser's session timeout must be at least that.
      TIMEOUT: "180000"

volumes:
  lightdash-db-data:
  lightdash-storage-data:
