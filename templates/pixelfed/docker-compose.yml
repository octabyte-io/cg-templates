# Based on Pixelfed's official docker-compose.yml and .env.docker.example (pixelfed/pixelfed,
# tag v0.15.2), using the project's published image instead of a local build, without the
# published port, and with the .env settings written out. A one-off init service does what
# Pixelfed's installer does by hand: database, instance actor, OAuth keys, places and the admin.

x-pixelfed-env: &pixelfed-env
  APP_NAME: Pixelfed
  APP_ENV: production
  APP_KEY: base64:${APP_KEY}
  APP_DEBUG: "false"
  APP_LOCALE: en-US
  APP_URL: ${APP_URL}
  APP_DOMAIN: ${APP_DOMAIN}
  ADMIN_DOMAIN: ${APP_DOMAIN}
  # Sign-ups start closed; the admin can open them in the admin dashboard.
  OPEN_REGISTRATION: "false"
  ENFORCE_EMAIL_VERIFICATION: "true"
  PF_MAX_USERS: "1000"
  OAUTH_ENABLED: "true"
  OAUTH_PAT_ENABLED: "false"
  ENABLE_CONFIG_CACHE: "true"
  INSTANCE_DISCOVER_PUBLIC: "true"
  IMAGE_DRIVER: vips
  PF_OPTIMIZE_IMAGES: "true"
  IMAGE_QUALITY: "80"
  MAX_PHOTO_SIZE: "15000"
  MAX_CAPTION_LENGTH: "500"
  MAX_ALBUM_LENGTH: "4"
  MEDIA_TYPES: image/jpeg,image/jpg,image/png,image/gif
  MODERN_MEDIA_TYPES: image/heic,image/heif,image/avif,image/jxl,image/webp
  # Cloudgate's proxy is on the Docker network, which "local" trusts.
  TRUSTED_PROXY: local
  TRUST_PROXIES: "*"
  DB_CONNECTION: mysql
  DB_HOST: pixelfed-db
  DB_PORT: "3306"
  DB_DATABASE: pixelfed
  DB_USERNAME: pixelfed
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_CLIENT: phpredis
  REDIS_SCHEME: tcp
  REDIS_HOST: pixelfed-redis
  REDIS_PASSWORD: "null"
  REDIS_PORT: "6379"
  SESSION_DRIVER: database
  CACHE_STORE: redis
  QUEUE_DRIVER: redis
  BROADCAST_DRIVER: log
  LOG_CHANNEL: stderr
  HORIZON_PREFIX: horizon-
  ACTIVITY_PUB: "true"
  AP_REMOTE_FOLLOW: "true"
  AP_INBOX: "true"
  AP_OUTBOX: "true"
  AP_SHAREDINBOX: "true"
  EXP_EMC: "true"
  MAIL_DRIVER: smtp
  MAIL_HOST: ${MAIL_HOST}
  MAIL_PORT: ${MAIL_PORT}
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}
  MAIL_ENCRYPTION: tls
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-pixelfed@${APP_DOMAIN}}
  MAIL_FROM_NAME: Pixelfed
  PF_ENABLE_CLOUD: "false"
  PHP_POST_MAX_SIZE: 500M
  PHP_UPLOAD_MAX_FILE_SIZE: 500M
  PHP_OPCACHE_ENABLE: "1"
  PHP_OPCACHE_VALIDATE_TIMESTAMPS: "0"

# The same volumes for every Pixelfed container. The .env file is a placeholder: the settings
# come from the environment, and its presence keeps Pixelfed's web installer closed.
x-pixelfed-volumes: &pixelfed-volumes
  - pixelfed-storage:/var/www/html/storage
  - ../files/pixelfed-dotenv.txt:/var/www/html/.env:ro

services:
  # Web pages and the API (FrankenPHP).
  pixelfed:
    image: ghcr.io/pixelfed/pixelfed:v0.15.2
    restart: unless-stopped
    environment:
      <<: *pixelfed-env
      LOG_OUTPUT_LEVEL: error
      # HTTPS is handled by Cloudgate's proxy.
      SSL_MODE: "off"
      CADDY_SERVER_EXTRA_DIRECTIVES: |
        @service_worker path /sw.js
        header @service_worker Cache-Control "no-cache"
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"
      AUTORUN_LARAVEL_MIGRATION_ISOLATION: "true"
      AUTORUN_LARAVEL_STORAGE_LINK: "true"
      AUTORUN_LARAVEL_EVENT_CACHE: "true"
      AUTORUN_LARAVEL_ROUTE_CACHE: "true"
      AUTORUN_LARAVEL_VIEW_CACHE: "true"
      AUTORUN_LARAVEL_CONFIG_CACHE: "true"
    volumes: *pixelfed-volumes
    # The official file's healthcheck-frankenphp is not in the published image, and Pixelfed only
    # answers on its own host name, so this asks for the sign-in page with that host.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -H \"Host: $${APP_DOMAIN}\" http://127.0.0.1:8080/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      pixelfed-init:
        condition: service_completed_successfully

  # Runs at each start, before the others: migrates the database, then does the installer's
  # one-time steps (instance actor, OAuth keys, the places list and the admin account).
  pixelfed-init:
    image: ghcr.io/pixelfed/pixelfed:v0.15.2
    restart: on-failure
    command:
      - sh
      - -c
      - |
        set -eu
        cd /var/www/html

        # 1. Database: created on the first start, migrated after an update.
        php artisan migrate --force

        # 2. The server's own ActivityPub actor (does nothing once it exists).
        php artisan instance:actor

        # 3. OAuth keys for the apps and the API, kept in the storage volume.
        if [ ! -s storage/oauth-private.key ]; then
          php artisan passport:keys --force
        fi

        # 4. The places list for tagging a post's location, loaded once.
        if [ ! -f storage/app/.cloudgate-places-imported ]; then
          php artisan import:cities
          touch storage/app/.cloudgate-places-imported
        fi

        # 5. The admin account, made once with the username, email and password from setup.
        if php artisan tinker --execute='echo App\Models\User::whereUsername(getenv("ADMIN_USERNAME"))->orWhere("email", getenv("ADMIN_EMAIL"))->exists() ? "USER_EXISTS" : "NO_USER";' | grep -q USER_EXISTS; then
          echo "The admin account already exists."
        else
          php artisan user:create --name="$$ADMIN_USERNAME" --username="$$ADMIN_USERNAME" \
            --email="$$ADMIN_EMAIL" --password="$$ADMIN_PASSWORD" --is_admin=true --confirm_email=1
        fi
    environment:
      <<: *pixelfed-env
      AUTORUN_ENABLED: "false"
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes: *pixelfed-volumes
    depends_on:
      pixelfed-db:
        condition: service_healthy
      pixelfed-redis:
        condition: service_healthy

  # The queue worker: federation, image and video processing, timelines.
  pixelfed-horizon:
    image: ghcr.io/pixelfed/pixelfed:v0.15.2
    restart: unless-stopped
    command: ["php", "artisan", "horizon"]
    environment:
      <<: *pixelfed-env
      AUTORUN_ENABLED: "false"
      AUTORUN_LARAVEL_STORAGE_LINK: "true"
      AUTORUN_LARAVEL_CONFIG_CACHE: "true"
    volumes: *pixelfed-volumes
    healthcheck:
      test: ["CMD", "healthcheck-horizon"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      pixelfed-init:
        condition: service_completed_successfully

  # Pixelfed's scheduled tasks (the cron jobs).
  pixelfed-scheduler:
    image: ghcr.io/pixelfed/pixelfed:v0.15.2
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    stop_signal: SIGTERM
    environment:
      <<: *pixelfed-env
      AUTORUN_ENABLED: "false"
      AUTORUN_LARAVEL_STORAGE_LINK: "true"
      AUTORUN_LARAVEL_CONFIG_CACHE: "true"
    volumes: *pixelfed-volumes
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      pixelfed-init:
        condition: service_completed_successfully

  # Pixelfed supports MySQL 8+ and MariaDB 11+ (README); its compose file's own comment names MariaDB.
  pixelfed-db:
    image: mariadb:11.8.9
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: pixelfed
      MARIADB_USER: pixelfed
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - pixelfed-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  pixelfed-redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - pixelfed-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pixelfed-storage:
  pixelfed-db-data:
  pixelfed-redis-data:
