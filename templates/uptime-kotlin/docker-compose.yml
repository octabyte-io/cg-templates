# From the project's quick start (README, v1.6.3): one image runs the web
# interface, the API and the checks, next to PostgreSQL. The optional cluster
# workers are left out.
services:
  uptime-kotlin:
    image: ghcr.io/theomeunier/uptime-kotlin:1.6.3
    restart: unless-stopped
    # The project asks to keep this limit: the native heap is sized from the
    # memory the container sees (~50 MB with a limit, several hundred without).
    mem_limit: 512m
    depends_on:
      uptime-kotlin-db:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_USERNAME: uptime-kotlin
      QUARKUS_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://uptime-kotlin-db:5432/uptime-kotlin
      # At least 32 bytes; encrypts stored secrets and the JWT signing key.
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      MP_JWT_VERIFY_ISSUER: ${APP_URL}

  uptime-kotlin-db:
    image: postgres:17.12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: uptime-kotlin
      POSTGRES_USER: uptime-kotlin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - uptime-kotlin-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptime-kotlin -d uptime-kotlin"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  uptime-kotlin-db-data:
