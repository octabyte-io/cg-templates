name: Many Notes
description: "Many Notes is a self-hosted Markdown notes app in your browser, with Obsidian-style vaults, links, backlinks, tags, search and sharing."
version: "0.18.1"
tags: [markdown notes, obsidian alternative, self-hosted notes, note taking, personal knowledge base, notion alternative]
links:
  website: https://github.com/brufdev/many-notes
  docs: https://github.com/brufdev/many-notes#readme
  source: https://github.com/brufdev/many-notes
cloudgate: "0.3.11"
compose: app
size: small
inputs:
  APP_URL: { value: "{{domains.many-notes.url}}" }
  # Laravel's APP_KEY (32 random bytes, base64); the compose file adds the "base64:" prefix.
  # It replaces the key baked into the image, which is the same for every install.
  APP_KEY: { generate: base64 }
signIn:
  firstVisit:
    path: /register
    note: "Register your account; the first account made is the admin."
domains:
  - { service: many-notes, port: 8080 }
