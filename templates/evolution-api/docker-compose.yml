services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      evolution-api-db:
        condition: service_healthy
      evolution-api-redis:
        condition: service_healthy
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      # The app's public address, used in webhook payloads and media links.
      SERVER_URL: ${SERVER_URL}
      # The global API key: every API call needs it (apikey header), and the
      # manager at /manager asks for it to sign in.
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DEL_INSTANCE: "false"
      TELEMETRY_ENABLED: "false"
      LANGUAGE: en
      LOG_LEVEL: ERROR,WARN,INFO,LOG
      LOG_COLOR: "false"
      LOG_BAILEYS: error
      CORS_ORIGIN: "*"
      CORS_METHODS: GET,POST,PUT,DELETE
      CORS_CREDENTIALS: "true"
      CONFIG_SESSION_PHONE_CLIENT: Evolution API
      CONFIG_SESSION_PHONE_NAME: Chrome
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${DB_PASSWORD}@evolution-api-db:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-api-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      # WhatsApp sessions (the linked-device logins) and media.
      - evolution-api-instances:/evolution/instances

  evolution-api-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution-api-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10

  evolution-api-redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution-api-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  evolution-api-instances:
  evolution-api-db-data:
  evolution-api-redis-data:
