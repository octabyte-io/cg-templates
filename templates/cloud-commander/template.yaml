name: Cloud Commander
description: "Cloud Commander is a self-hosted, two-panel web file manager: upload, copy, move, view, edit and zip your server's files from any browser."
version: "19.23.2"
tags: [web file manager, two panel file manager, total commander alternative, file manager in browser, online text editor, self-hosted file manager]
links:
  website: https://cloudcmd.io
  docs: https://cloudcmd.io/#help
  source: https://github.com/coderaiser/cloudcmd
cloudgate: "0.3.11"
compose: app
size: xsmall
inputs:
  # The password of the user "admin". Cloud Commander reads it at every start
  # (it signs in with your browser's username and password prompt), so change
  # it here, not in the app.
  CLOUDCMD_PASSWORD: { generate: password }
signIn:
  username: { value: admin }
  password: CLOUDCMD_PASSWORD
domains:
  - { service: cloudcmd, port: 8000 }
