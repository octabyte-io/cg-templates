# From Rybbit's official docker-compose.yml (v2.9.2), without its optional
# Caddy web server and published ports. The small Caddy below only splits the
# one address between the backend (/api) and the web client, as Rybbit's own
# Caddyfile does; Cloudgate's proxy in front handles the domain and TLS.
services:
  rybbit:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    depends_on:
      rybbit-backend:
        condition: service_healthy
      rybbit-client:
        condition: service_healthy
    volumes:
      - ../files/Caddyfile.conf:/etc/caddy/Caddyfile:ro

  rybbit-backend:
    image: ghcr.io/rybbit-io/rybbit-backend:v2.9.2
    restart: unless-stopped
    depends_on:
      rybbit-clickhouse:
        condition: service_healthy
      rybbit-db:
        condition: service_healthy
      rybbit-redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # The address people open; sign-in, invitations and CORS use it.
      BASE_URL: ${BASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      CLICKHOUSE_HOST: http://rybbit-clickhouse:8123
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_QUERY_PASSWORD: ${CLICKHOUSE_PASSWORD}
      POSTGRES_HOST: rybbit-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: analytics
      POSTGRES_USER: rybbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: rybbit-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Anyone with the address can sign up; the first account becomes the admin.
      DISABLE_SIGNUP: "false"
      # Upstream starts 4 worker processes; 2 keep it within a 2 GB server.
      CLUSTER_WORKERS: 2
      DASHBOARD_CACHE_TTL_SECONDS: 30
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 1m

  rybbit-client:
    image: ghcr.io/rybbit-io/rybbit-client:v2.9.2
    restart: unless-stopped
    depends_on:
      - rybbit-backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: ${BASE_URL}
      NEXT_PUBLIC_DISABLE_SIGNUP: "false"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3002/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rybbit-clickhouse:
    image: clickhouse/clickhouse-server:26.3.17.4
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      # Lets the backend create its read-only "rybbit_query" user at startup.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../files/clickhouse/network.xml:/etc/clickhouse-server/config.d/network.xml:ro
      - ../files/clickhouse/logging_rules.xml:/etc/clickhouse-server/config.d/logging_rules.xml:ro
      - ../files/clickhouse/resource_limits.xml:/etc/clickhouse-server/config.d/resource_limits.xml:ro
      # Profile (user-level) settings are only read from users.d.
      - ../files/clickhouse/user_settings.xml:/etc/clickhouse-server/users.d/user_settings.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rybbit-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rybbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: analytics
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rybbit -d analytics"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Session tracking and bot counters. noeviction and AOF as upstream.
  rybbit-redis:
    image: redis:8.6.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  clickhouse-data:
  postgres-data:
  redis-data:
