# From Rybbit's official Caddyfile (v2.9.2): one address for the whole app,
# with /api/* (and the sign-in discovery documents) going to the backend and
# everything else to the web client. Plain HTTP on port 80: Cloudgate's own
# proxy in front handles the domain and TLS.
{
	# Trust the visitor address set by Cloudgate's proxy in front, so Rybbit
	# locates visitors by their own IP and not by the proxy's.
	servers {
		trusted_proxies static private_ranges
	}
}

:80 {
	encode zstd gzip

	request_body {
		max_size 10MB
	}

	handle /api/* {
		reverse_proxy rybbit-backend:3001
	}

	# OAuth/OIDC discovery documents for MCP clients are served by the
	# backend but must live at the domain root.
	handle /.well-known/oauth-* {
		reverse_proxy rybbit-backend:3001
	}
	handle /.well-known/openid-configuration* {
		reverse_proxy rybbit-backend:3001
	}

	handle {
		reverse_proxy rybbit-client:3002
	}
}
