services:
  open-archiver:
    image: logiclabshq/open-archiver:v0.6.2
    restart: unless-stopped
    depends_on:
      open-archiver-db:
        condition: service_healthy
      open-archiver-valkey:
        condition: service_healthy
      open-archiver-meilisearch:
        condition: service_started
      open-archiver-tika:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT_BACKEND: "4000"
      PORT_FRONTEND: "3000"
      APP_URL: ${APP_URL}
      ORIGIN: ${APP_URL}
      SYNC_FREQUENCY: "* * * * *"
      ALL_INCLUSIVE_ARCHIVE: "false"
      DATABASE_URL: postgresql://open_archiver:${POSTGRES_PASSWORD}@open-archiver-db:5432/open_archive
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_HOST: http://open-archiver-meilisearch:7700
      REDIS_HOST: open-archiver-valkey
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_TLS_ENABLED: "false"
      STORAGE_TYPE: local
      STORAGE_LOCAL_ROOT_PATH: /var/data/open-archiver
      BODY_SIZE_LIMIT: 100M
      ENABLE_DELETION: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TIKA_URL: http://open-archiver-tika:9998
    volumes:
      - open-archiver-data:/var/data/open-archiver

  open-archiver-db:
    image: postgres:17.12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: open_archive
      POSTGRES_USER: open_archiver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - open-archiver-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_archiver -d open_archive"]
      interval: 10s
      timeout: 5s
      retries: 10

  open-archiver-valkey:
    image: valkey/valkey:8.1.11-alpine
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - open-archiver-valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  open-archiver-meilisearch:
    image: getmeili/meilisearch:v1.38.2
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_SCHEDULE_SNAPSHOT: "86400"
    volumes:
      - open-archiver-meili-data:/meili_data

  # Extracts text from attachments (PDF, Office, scanned images) for search.
  open-archiver-tika:
    image: apache/tika:4.1.0-full
    restart: unless-stopped

volumes:
  open-archiver-data:
  open-archiver-db-data:
  open-archiver-valkey-data:
  open-archiver-meili-data:
