name: Ech0
description: "Ech0 is a self-hosted microblog: post short updates, photos and links to your own public timeline, with RSS, emoji reactions and comments."
version: "v5.9.9"
tags: [self-hosted microblog, micro.blog alternative, twitter alternative, personal timeline, rss feed, short posts]
links:
  website: https://ech0.app
  docs: https://ech0.app/docs
  source: https://github.com/lin-snow/Ech0
cloudgate: 0.1.0
compose: app
size: xsmall
inputs:
  # Signs sign-in tokens. Kept fixed so a restart doesn't sign everyone out.
  JWT_SECRET: { generate: hex }
  # The site's public address, used in links Ech0 builds (comments, feeds).
  SERVER_URL: { value: "{{domains.ech0.url}}" }
domains:
  - { service: ech0, port: 6277 }
