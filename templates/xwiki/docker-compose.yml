services:
  xwiki:
    image: xwiki:17.10.15-postgres-tomcat
    restart: unless-stopped
    # tini as PID 1 reaps LibreOffice child processes, as in the official compose file.
    init: true
    depends_on:
      xwiki-db:
        condition: service_healthy
    environment:
      DB_USER: xwiki
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: xwiki
      DB_HOST: xwiki-db
    volumes:
      - xwiki-data:/usr/local/xwiki

  xwiki-db:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xwiki
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: xwiki
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=builtin --locale=C.UTF-8"
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/<major>.
      - xwiki-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xwiki -d xwiki"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  xwiki-data:
  xwiki-db-data:
