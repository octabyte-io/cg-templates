name: Open Journal Systems
description: "Open Journal Systems (OJS) is self-hosted software that takes manuscript submissions, runs peer review and publishes journal issues, instead of Scholastica."
version: "3.5.0-6"
tags: [scholastica alternative, journal management software, peer review software, academic journal publishing, scholarone alternative, open access journal]
links:
  website: https://pkp.sfu.ca/software/ojs/
  docs: https://docs.pkp.sfu.ca/
  source: https://github.com/pkp/ojs
cloudgate: 0.1.0
compose: app
size: small
inputs:
  OJS_URL: { value: "{{domains.ojs.url}}" }
  ADMIN_EMAIL:
    ask:
      label: Admin email
      description: The email of the OJS site administrator (user name admin). Cloudgate creates a strong password for it, shown afterwards on the app's variables page.
      format: email
  ADMIN_PASSWORD: { generate: password }
  DB_PASSWORD: { generate: password }
  DB_ROOT_PASSWORD: { generate: password }
signIn:
  username: { value: admin }
  password: ADMIN_PASSWORD
domains:
  - { service: ojs, port: 80 }
files:
  # Tells Apache to trust the X-Forwarded-Proto header from Cloudgate's proxy.
  - { path: forwarded-https.conf }
