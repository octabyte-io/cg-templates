name: DokuWiki
description: "DokuWiki is a free, open-source, self-hosted wiki that keeps every page as a plain text file, with no database, for team docs, manuals and runbooks."
version: "2026-07-14c"
tags: ["dokuwiki", "self-hosted wiki", "wiki without database", "file based wiki", "knowledge base", "confluence alternative"]
links:
  website: https://www.dokuwiki.org
  docs: https://www.dokuwiki.org/manual
  source: https://github.com/dokuwiki/dokuwiki
cloudgate: 0.1.0
compose: app
size: xsmall
inputs:
  TIMEZONE:
    ask:
      label: Time zone
      description: Used for page dates and the change history, as an IANA name such as Europe/Berlin.
      default: Etc/UTC
      required: false
domains:
  - { service: dokuwiki, port: 80 }
