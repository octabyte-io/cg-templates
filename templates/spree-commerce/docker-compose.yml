# Based on spree/spree_starter's quick-start docker-compose.yml (v6.0.4.1):
# one app container (Puma serves the API, the Admin Dashboard at /dashboard and
# runs Solid Queue's job supervisor in-process) and Postgres. The cache and job
# queue live in Postgres, so there is no Redis. Mailpit (a local mail catcher)
# is left out; set the SMTP inputs to send real email.
services:
  spree:
    image: ghcr.io/spree/spree:6.0.4.1
    restart: unless-stopped
    depends_on:
      spree-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://spree:${DB_PASSWORD}@spree-db:5432/spree_production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}
      # Cloudgate's proxy terminates TLS: generate https URLs and secure
      # cookies, but leave the http-to-https redirect to the proxy.
      RAILS_ASSUME_SSL: "true"
      RAILS_FORCE_SSL: "false"
      SPREE_HOST: ${SPREE_HOST}
      # The first start seeds the store and creates this admin account.
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      STORE_COUNTRY: ${STORE_COUNTRY}
      # The job dashboard at /jobs (HTTP Basic auth).
      MISSION_CONTROL_USER: admin
      MISSION_CONTROL_PASSWORD: ${MISSION_CONTROL_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
    volumes:
      - spree-storage:/rails/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  spree-db:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spree
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: spree_production
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - spree-db-data:/var/lib/postgresql
    healthcheck:
      # Checked over TCP: on a new volume the image first runs a temporary
      # init server on the unix socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U spree -d spree_production"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  spree-storage:
  spree-db-data:
