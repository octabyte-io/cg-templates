name: OpenSEO
description: "OpenSEO is a self-hosted SEO tool for keyword research, rank tracking, backlinks and site audits, with data paid per lookup through DataForSEO."
version: "0.1.27"
tags: [self-hosted seo tool, open source seo tool, semrush alternative, ahrefs alternative, keyword research tool, rank tracker, site audit tool]
links:
  website: https://openseo.so
  docs: https://github.com/every-app/open-seo/blob/main/docs/SELF_HOSTING_DOCKER.md
  source: https://github.com/every-app/open-seo
cloudgate: 0.1.0
compose: app
size: large
inputs:
  BETTER_AUTH_URL: { value: "{{domains.openseo.url}}" }
  STORAGE_ACCESS_KEY: { value: openseo }
  STORAGE_SECRET_KEY: { generate: password }
  DATAFORSEO_API_KEY:
    ask:
      label: DataForSEO API key
      description: "Needed for keyword, backlink, rank and site data, from a paid DataForSEO account: your API login and password joined as login:password and Base64-encoded. You can leave it empty and add it later on the app's variables page."
      required: false
      secret: true
  OPENROUTER_API_KEY:
    ask:
      label: OpenRouter API key
      description: "Optional. Turns on the AI assistant, website research and summaries. You pay OpenRouter for what you use. You can add it later on the app's variables page."
      required: false
      secret: true
domains:
  - { service: openseo, port: 80 }
