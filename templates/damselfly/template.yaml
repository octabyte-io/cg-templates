name: Damselfly
description: "Damselfly is a self-hosted photo manager for large photo folders, with fast search, keyword tagging written into the files, and local face recognition."
version: "4.5.3"
tags: ["self-hosted photo manager", "lightroom alternative", "photo keyword tagging", "picasa replacement", "face recognition photos", "photo catalogue"]
links:
  website: https://damselfly.info
  docs: https://github.com/Webreaper/Damselfly/blob/master/docs/Installation.md
  source: https://github.com/Webreaper/Damselfly
cloudgate: "0.3.11"
compose: app
size: medium
inputs:
  # The password the sign-in prompt in front of Damselfly asks for
  # (username: admin). Damselfly's own accounts only change what its pages
  # show; its server answers anyone, so this prompt is what keeps photos private.
  ADMIN_PASSWORD: { generate: password }
  # Remembers a browser that passed the sign-in prompt, so Damselfly's own
  # log-in (which replaces the prompt's credentials) keeps working.
  SESSION_TOKEN: { generate: hex }
signIn:
  username: { value: admin }
  password: ADMIN_PASSWORD
domains:
  - { service: proxy, port: 80 }
files:
  - { path: Caddyfile.txt }
