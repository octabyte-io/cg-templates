name: Authelia
description: "Authelia is self-hosted single sign-on with two-step login: one account with passkeys and authenticator codes for your apps, through OpenID Connect."
version: "4.39.28"
tags:
  - okta alternative
  - single sign-on
  - two-factor authentication
  - openid connect provider
  - sso portal
  - passkeys
links:
  website: https://www.authelia.com
  docs: https://www.authelia.com/integration/prologue/get-started/
  source: https://github.com/authelia/authelia
cloudgate: 0.1.0
compose: app
# Authelia itself uses well under 100 MB of memory; Redis adds a little.
size: small
inputs:
  # The app's host. It is the session cookie domain and the portal's https
  # address. For single sign-on across apps on several subdomains, change the
  # cookie domain to their shared parent domain in /config/configuration.yml.
  APP_HOST: { value: "{{domains.authelia.host}}" }
  SESSION_SECRET: { generate: hex }
  STORAGE_ENCRYPTION_KEY: { generate: hex }
  RESET_PASSWORD_JWT_SECRET: { generate: hex }
  # The password of the admin user "admin", written to the users file on the
  # first start as an argon2 hash.
  ADMIN_PASSWORD: { generate: password }
  ADMIN_EMAIL:
    ask:
      label: Admin email
      description: The email of the admin user "admin". You sign in as admin with the password Cloudgate creates, shown afterwards on the app's variables page as ADMIN_PASSWORD.
      format: email
domains:
  - { service: authelia, port: 9091 }
files:
  - { path: configuration.yml }
