services:
  vaultwarden:
    image: vaultwarden/server:1.37.5
    restart: unless-stopped
    depends_on:
      vaultwarden-db:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
      DATABASE_URL: postgresql://vaultwarden:${DB_PASSWORD}@vaultwarden-db:5432/vaultwarden
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED}
    volumes:
      - vaultwarden-data:/data

  vaultwarden-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaultwarden
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: vaultwarden
    volumes:
      - vaultwarden-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultwarden -d vaultwarden"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  vaultwarden-data:
  vaultwarden-db-data:
