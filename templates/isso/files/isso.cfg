# Isso's configuration, read from /config/isso.cfg. Isso expands $NAME in
# values from the container's environment, so the settings chosen at setup
# arrive through docker-compose.yml. Every option: isso-comments.de/docs/reference/server-config/
[general]
# The SQLite database, on the isso-data volume.
dbpath = /db/comments.db
# The website(s) allowed to show and post comments (CORS).
host = $WEBSITE_URL
max-age = 15m
notify = stdout
gravatar = false
latest-enabled = false

[admin]
# The moderation page at <Isso address>/admin, signed in with this password.
enabled = true
password = $ADMIN_PASSWORD

[moderation]
# true holds new comments until you approve them on the admin page.
enabled = $MODERATION
approve-if-email-previously-approved = false
purge-after = 30d

[server]
listen = http://0.0.0.0:8080
public-endpoint = $ISSO_URL
reload = false
profile = false

[guard]
enabled = true
ratelimit = 2
direct-reply = 3
reply-to-self = false
require-author = false
require-email = false

[markup]
renderer = mistune

[hash]
# Salt for the hashed identifiers shown next to anonymous commenters.
salt = $HASH_SALT
algorithm = pbkdf2
