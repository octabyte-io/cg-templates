services:
  jellystat:
    image: cyfershepard/jellystat:1.1.12
    restart: unless-stopped
    depends_on:
      jellystat-db:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_IP: jellystat-db
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JWT_SECRET}
      TZ: ${TIMEZONE:-Etc/UTC}
    volumes:
      - jellystat-backup-data:/app/backend/backup-data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/auth/isConfigured || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  jellystat-db:
    image: postgres:18.1-alpine
    restart: unless-stopped
    shm_size: 1gb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 keeps its data in a versioned folder under /var/lib/postgresql.
      - jellystat-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=postgres --username=postgres"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  jellystat-backup-data:
  jellystat-db-data:
