services:
  readeck:
    image: codeberg.org/readeck/readeck:0.23.5
    restart: unless-stopped
    environment:
      READECK_LOG_LEVEL: info
      READECK_LOG_FORMAT: text
      READECK_SERVER_HOST: "0.0.0.0"
      READECK_SERVER_PORT: "8000"
    # Readeck keeps its config (with a secret key it generates on first launch),
    # its SQLite database and the saved pages in this volume.
    volumes:
      - readeck-data:/readeck
    security_opt:
      - no-new-privileges
    healthcheck:
      test: ["CMD", "/bin/readeck", "healthcheck", "-config", "config.toml"]
      interval: 30s
      timeout: 2s
      retries: 3

volumes:
  readeck-data:
