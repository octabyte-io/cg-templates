services:
  dmarc-report-viewer:
    image: ghcr.io/cry-inc/dmarc-report-viewer:2.7.0
    restart: unless-stopped
    environment:
      # The mailbox that receives the DMARC (rua) and SMTP TLS reports. The app reads
      # it every 30 minutes and keeps the parsed reports in memory only, so it needs
      # no volume: nothing is stored on disk.
      IMAP_HOST: ${IMAP_HOST}
      IMAP_PORT: ${IMAP_PORT}
      IMAP_USER: ${IMAP_USER}
      IMAP_PASSWORD: ${IMAP_PASSWORD}
      IMAP_FOLDER: ${IMAP_FOLDER}
      # The web UI is protected with HTTP basic auth (user name "dmarc").
      HTTP_SERVER_USER: dmarc
      HTTP_SERVER_PASSWORD: ${HTTP_SERVER_PASSWORD}
      HTTP_SERVER_PORT: "8080"
