name: WooCommerce
description: "Self-hosted WooCommerce: your own online store on WordPress with products, checkout, orders, stock, shipping and tax, and no fee from WooCommerce on each sale."
version: "11.3.0"
tags: [shopify alternative, online store, woocommerce, self-hosted ecommerce, wordpress online store, open source shopify alternative]
links:
  website: https://woocommerce.com
  docs: https://woocommerce.com/documentation/woocommerce/
  source: https://github.com/woocommerce/woocommerce
cloudgate: 0.1.0
compose: app
size: medium
inputs:
  DB_PASSWORD: { generate: password }
  DB_ROOT_PASSWORD: { generate: password }
domains:
  - { service: wordpress, port: 80 }
files:
  - { path: uploads.ini }
  - { path: activate-woocommerce.php.txt }
