# From RAGFlow's docker/docker-compose.yml and docker-compose-base.yml at v1.0.0, with the
# Infinity document engine (DOC_ENGINE=infinity), one of the engines RAGFlow ships, instead of
# the default Elasticsearch, which needs the host's vm.max_map_count raised. MySQL holds the
# accounts and settings, MinIO-compatible Silo the uploaded files, Kvrocks the cache and NATS
# the task queue, as upstream. The optional services (Kibana, local embedding server, code
# sandbox, tracing) and the published ports are left out.
x-ragflow-env: &ragflow-env
  DOC_ENGINE: infinity
  DB_TYPE: mysql
  DEVICE: cpu
  RAGFLOW_SECRET_KEY: ${RAGFLOW_SECRET_KEY}
  DEFAULT_SUPERUSER_EMAIL: ${ADMIN_EMAIL}
  DEFAULT_SUPERUSER_PASSWORD: ${ADMIN_PASSWORD}
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DBNAME: rag_flow
  MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  MYSQL_MAX_PACKET: "1073741824"
  MINIO_HOST: minio
  MINIO_USER: rag_flow
  MINIO_PASSWORD: ${MINIO_PASSWORD}
  INFINITY_HOST: infinity
  KVROCKS_HOST: kvrocks
  KVROCKS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  NATS_HOST: nats
  NATS_PORT: "4222"
  REGISTER_ENABLED: "1"
  ENABLE_REGISTER: "1"
  ALLOW_ANY_HOST: "0"
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
  THREAD_POOL_MAX_WORKERS: "128"

services:
  ragflow:
    image: infiniflow/ragflow:v1.0.0
    restart: unless-stopped
    # Starts the web app, the API, the background workers and the admin server, and creates
    # the superuser (ADMIN_EMAIL) on first start.
    command:
      - --enable-adminserver
      - --init-superuser
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      infinity:
        condition: service_healthy
      kvrocks:
        condition: service_healthy
      nats:
        condition: service_healthy
    # No ulimits (upstream raises nofile and nproc to 65535, Infinity's nofile to 500000): a
    # server whose Docker has a lower hard limit refuses to start the container, and Docker's
    # default open-file limit is already high on most servers.
    environment:
      <<: *ragflow-env
    volumes:
      - ragflow-logs:/ragflow/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/api/v1/system/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s

  infinity:
    image: infiniflow/infinity:v0.7.5-x64-v3
    restart: unless-stopped
    command: ["-f", "/infinity_conf.toml"]
    volumes:
      - infinity-data:/var/infinity
      - ../files/infinity_conf.toml:/infinity_conf.toml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:23820/admin/node/current"]
      interval: 10s
      timeout: 10s
      retries: 120

  mysql:
    image: mysql:8.0.40
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: rag_flow
    command:
      - --max_connections=1000
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --tls_version=TLSv1.2,TLSv1.3
      - --binlog_expire_logs_seconds=604800
      - --innodb-buffer-pool-size=1G
      - --innodb-io-capacity=2000
      - --innodb-io-capacity-max=4000
      - --innodb-redo-log-capacity=1G
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  minio:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    restart: unless-stopped
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: rag_flow
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 120

  kvrocks:
    image: apache/kvrocks:2.16.0
    restart: unless-stopped
    # Upstream's kvrocks-entrypoint.sh, inline: Kvrocks reads its password only from its config
    # file, so the file is written from REDIS_PASSWORD at each start.
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /var/lib/kvrocks
        printf 'bind 0.0.0.0\nport 6379\ndir /var/lib/kvrocks\nrequirepass %s\n' "$$REDIS_PASSWORD" > /var/lib/kvrocks/kvrocks.conf
        exec kvrocks -c /var/lib/kvrocks/kvrocks.conf --dir /var/lib/kvrocks
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - kvrocks-data:/var/lib/kvrocks
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 10s
      retries: 120

  nats:
    image: nats:2.14.2
    restart: unless-stopped
    command: -js -sd /data --http_port 8222
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "nats-server", "--health-check"]
      interval: 10s
      timeout: 10s
      retries: 30

volumes:
  ragflow-logs:
  infinity-data:
  mysql-data:
  minio-data:
  kvrocks-data:
  nats-data:
