# WebDAV server that stores Super Productivity's synced data (from the app's
# own webdav.yaml, with the password read from the environment).
address: 0.0.0.0
port: 2345

prefix: /
permissions: CRUD

# The browser app reaches this server through the app's /webdav/ path (same
# origin); CORS stays on, as upstream ships it, for desktop and mobile apps.
cors:
  enabled: true
  credentials: true
  allowed_headers:
    - '*'
  allowed_hosts:
    - '*'
  allowed_methods:
    - GET
    - HEAD
    - POST
    - PUT
    - DELETE
    - OPTIONS
    - PROPFIND
    - PROPPATCH
    - MKCOL
    - COPY
    - MOVE
    - LOCK
    - UNLOCK
  exposed_headers:
    - '*'

users:
  - username: admin
    password: "{env}WEBDAV_PASSWORD"
    directory: /data
