name: GrowthBook
description: "Self-hosted GrowthBook runs feature flags, gradual rollouts and A/B tests on your own server, with results read from your own data."
version: "5.2.0"
tags: [feature flags, "a/b testing", launchdarkly alternative, optimizely alternative, statsig alternative, experimentation, open source feature flags]
links:
  website: https://www.growthbook.io
  docs: https://docs.growthbook.io/self-host
  source: https://github.com/growthbook/growthbook
cloudgate: 0.1.0
compose: app
# GrowthBook's production docs ask for at least 2 GB of memory and 1 vCPU per app instance,
# plus MongoDB.
size: medium
inputs:
  APP_ORIGIN: { value: "{{domains.growthbook.url}}" }
  API_HOST: { value: "{{domains.growthbook-api.url}}" }
  JWT_SECRET: { generate: hex }
  ENCRYPTION_KEY: { generate: hex }
  MONGO_PASSWORD: { generate: password }
signIn:
  firstVisit:
    path: /
    note: "Create the admin account with your name, email, password and company name."
domains:
  # The web app, where people sign in and manage flags and experiments.
  - { service: growthbook, port: 3000 }
  # The API, which the web app and the SDKs in your own apps call.
  - { service: growthbook-api, port: 3100 }
