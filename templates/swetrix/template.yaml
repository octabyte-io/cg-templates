name: Swetrix
description: "Swetrix is self-hosted, cookieless web analytics that replaces Google Analytics and adds custom events, funnels, page speed and error tracking."
version: "5.5.4"
tags: [swetrix, google analytics alternative, cookieless analytics, privacy-friendly analytics, web analytics, error tracking, mixpanel alternative]
links:
  website: https://swetrix.com
  docs: https://swetrix.com/docs/selfhosting/how-to
  source: https://github.com/Swetrix/swetrix
cloudgate: 0.1.0
compose: app
size: medium
inputs:
  BASE_URL: { value: "{{domains.swetrix.url}}" }
  SECRET_KEY_BASE: { generate: base64 }
  CLICKHOUSE_PASSWORD: { generate: hex }
domains:
  - { service: swetrix, port: 80 }
files:
  - { path: nginx/default.conf }
  - { path: clickhouse/reduce-logs.xml }
  - { path: clickhouse/disable-user-logging.xml }
  - { path: clickhouse/preserve-ram-config.xml }
  - { path: clickhouse/preserve-ram-user.xml }
  - { path: clickhouse/sync-inserts.xml }
