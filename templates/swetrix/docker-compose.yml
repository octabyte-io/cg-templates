# From Swetrix's official self-hosting compose file (github.com/Swetrix/selfhosting).
# The Nginx service is kept: it serves the dashboard on / and the API on /backend/
# under one web address, which is how the frontend expects to reach the API.
services:
  # Routes / to the dashboard and /backend/ to the API (the official nginx/config).
  swetrix:
    image: nginx:1.31.8-alpine
    restart: unless-stopped
    depends_on:
      swetrix-fe:
        condition: service_healthy
      swetrix-api:
        condition: service_healthy
    volumes:
      - ../files/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  # The dashboard: shows the analytics, charts and settings.
  swetrix-fe:
    image: swetrix/swetrix-fe:v5.5.4
    restart: unless-stopped
    depends_on:
      - swetrix-api
    environment:
      BASE_URL: ${BASE_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # The API: collects tracking events and serves the data to the dashboard.
  swetrix-api:
    image: swetrix/swetrix-api:v5.5.4
    restart: unless-stopped
    depends_on:
      swetrix-redis:
        condition: service_healthy
      swetrix-clickhouse:
        condition: service_healthy
    environment:
      BASE_URL: ${BASE_URL}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      # Sign-up stays open only for the first account, which becomes the admin.
      DISABLE_REGISTRATION: "true"
      DEBUG_MODE: "false"
      CLIENT_IP_HEADER: x-forwarded-for
      # Emails (password resets, invitations) need SMTP; until it is set they are logged.
      SMTP_MOCK: "true"
      REDIS_HOST: swetrix-redis
      REDIS_PORT: 6379
      REDIS_USER: default
      CLICKHOUSE_HOST: http://swetrix-clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_DATABASE: analytics
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5005/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 1m

  swetrix-redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  swetrix-clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - events-data:/var/lib/clickhouse
      # Quieter logs and lower memory use (the official selfhosting settings).
      - ../files/clickhouse/reduce-logs.xml:/etc/clickhouse-server/config.d/reduce-logs.xml:ro
      - ../files/clickhouse/disable-user-logging.xml:/etc/clickhouse-server/users.d/disable-user-logging.xml:ro
      - ../files/clickhouse/preserve-ram-config.xml:/etc/clickhouse-server/config.d/preserve-ram-config.xml:ro
      - ../files/clickhouse/preserve-ram-user.xml:/etc/clickhouse-server/users.d/preserve-ram-user.xml:ro
      # Not in the official file: keeps sign-up working on ClickHouse 26.8 (see the file).
      - ../files/clickhouse/sync-inserts.xml:/etc/clickhouse-server/users.d/sync-inserts.xml:ro
    cap_add:
      - SYS_NICE
    # The official file raises the open-files limit to 262144; it is left to Docker's default
    # (usually 1048576) because a host with a lower hard limit refuses to start the container.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 1m

volumes:
  events-data:
  redis-data:
