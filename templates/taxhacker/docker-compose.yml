services:
  # TaxHacker's self-hosted mode has no accounts or sign-in: anyone with the
  # address could read and change your books. This proxy asks for the
  # username "admin" and the generated password first.
  proxy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    # Caddy needs a bcrypt hash of the password; make it at each start.
    entrypoint:
      - /bin/sh
      - -c
      - export BASIC_AUTH_HASH="$$(caddy hash-password --plaintext "$$ADMIN_PASSWORD")" && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ../files/Caddyfile.txt:/etc/caddy/Caddyfile:ro
    depends_on:
      taxhacker:
        condition: service_healthy

  taxhacker:
    image: ghcr.io/vas3k/taxhacker:0.8.5
    restart: unless-stopped
    # The image waits for the database and applies migrations, then starts.
    depends_on:
      taxhacker-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SELF_HOSTED_MODE: "true"
      BASE_URL: ${BASE_URL}
      UPLOAD_PATH: /app/data/uploads
      DATABASE_URL: postgresql://taxhacker:${POSTGRES_PASSWORD}@taxhacker-db:5432/taxhacker
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    volumes:
      # Uploaded receipts, invoices and other files.
      - taxhacker-data:/app/data
    security_opt:
      - no-new-privileges:true
    # The image has Node but neither curl nor wget.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:7331/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

  # Runs TaxHacker's scheduled jobs, such as importing receipts from the
  # mailboxes you connect in its settings.
  taxhacker-cron:
    image: ghcr.io/vas3k/taxhacker:0.8.5
    restart: unless-stopped
    command: ["docker-cron-entrypoint.sh"]
    depends_on:
      taxhacker:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SELF_HOSTED_MODE: "true"
      BASE_URL: ${BASE_URL}
      UPLOAD_PATH: /app/data/uploads
      DATABASE_URL: postgresql://taxhacker:${POSTGRES_PASSWORD}@taxhacker-db:5432/taxhacker
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    volumes:
      - taxhacker-data:/app/data
      - ../files/crontab.txt:/mnt/crontab:ro
    security_opt:
      - no-new-privileges:true

  taxhacker-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taxhacker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: taxhacker
    volumes:
      - taxhacker-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxhacker -d taxhacker"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  taxhacker-data:
  taxhacker-db-data:
