# From InvenTree's official Caddyfile (contrib/container/Caddyfile, 1.7.2):
# serves uploaded media (only to signed-in users, checked by InvenTree) and
# static files, and passes everything else to the InvenTree server. Plain HTTP
# on port 80: Cloudgate's own proxy in front handles the domain and TLS.
{
	# Trust the scheme and host set by Cloudgate's proxy in front, so InvenTree
	# sees https and its own address.
	servers {
		trusted_proxies static private_ranges
	}
}

(cors-headers) {
	header Allow GET,HEAD,OPTIONS
	header Access-Control-Allow-Origin *
	header Access-Control-Allow-Methods GET,HEAD,OPTIONS
	header Access-Control-Allow-Headers Authorization,Content-Type,User-Agent,traceparent

	@cors_preflight{args[0]} method OPTIONS

	handle @cors_preflight{args[0]} {
		respond "" 204
	}
}

:80 {
	encode gzip

	request_body {
		max_size 100MB
	}

	handle_path /static/* {
		import cors-headers static

		root * /srv/inventree/static
		file_server
	}

	handle_path /media/* {
		import cors-headers media

		root * /srv/inventree/media
		file_server

		# Force download of media files (for security)
		header Content-Disposition attachment

		# Only signed-in users may fetch media files
		forward_auth inventree-server:8000 {
			uri /auth/
		}
	}

	reverse_proxy inventree-server:8000
}
