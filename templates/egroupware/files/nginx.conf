# From EGroupware's doc/docker/nginx.conf (release 26.11.20261112). Left out: TLS (Cloudgate
# serves HTTPS in front), the Collabora and Rocket.Chat proxies, phpMyAdmin and SmallParT videos.
client_max_body_size 1g;
fastcgi_buffers 16 16k;
fastcgi_buffer_size 32k;

upstream fpm {
	server egroupware:9000;
}

# redirects use X-Forwarded-Proto set by the proxy in front
map $http_x_forwarded_proto $redirectscheme {
	default $scheme;
	https https;
}

server {
	access_log off;
	listen 80 default_server;
	server_name _;
	root /var/www/html;
	index index.php index.html;

	# EGroupware sources, shared from the egroupware container
	location ^~ /egroupware {
		alias  /usr/share/egroupware/;
		try_files $uri $uri/ =404;
		location ~ ^/egroupware(/(?U).+\.php) {
			# do not allow to call files meant to be included only
			location ~ ^/egroupware/(vendor|[^/]+/(src|setup|inc|vendor))/ {
				return 404;
			}
			alias  /usr/share/egroupware;
			fastcgi_pass fpm;
			# WebDAV/CalDAV/CardDAV
			fastcgi_read_timeout 60m;
			fastcgi_index  index.php;
			fastcgi_split_path_info ^((?U).+\.php)(.*)$;
			fastcgi_param  PATH_INFO          $fastcgi_path_info;
			fastcgi_param  PATH_TRANSLATED    $document_root$fastcgi_path_info;
			include fastcgi_params;
			fastcgi_param SCRIPT_FILENAME /usr/share/egroupware$1;
			fastcgi_param DOCUMENT_ROOT /var/www/html;
		}
		location ~ (?i)\.(ico|jpe?g|gif|png|svg|xet|xml|js|css|html|map|swf)$ {
			access_log off;
			expires 10d;
			add_header Pragma public;
			add_header Cache-Control "public";
			location ~ ^/egroupware(/.*)$ {
				alias /usr/share/egroupware/;
				try_files $1 =404;
			}
		}
	}

	# push server
	location /egroupware/push {
		proxy_read_timeout 3600;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
		proxy_pass http://egroupware-push:9501;
	}

	# ActiveSync
	location /Microsoft-Server-ActiveSync {
		fastcgi_pass fpm;
		fastcgi_read_timeout 60m;
		fastcgi_index  index.php;
		fastcgi_split_path_info ^((?U).+\.php)(.*)$;
		fastcgi_param  PATH_INFO          $fastcgi_path_info;
		fastcgi_param  PATH_TRANSLATED    $document_root$fastcgi_path_info;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME /usr/share/egroupware/activesync/index.php;
	}
	# CalDAV & CardDAV autoconfig
	location ~ ^/.well-known/(caldav|carddav)$ {
		return 301 $redirectscheme://$host/egroupware/groupdav.php/;
	}
	location ~ ^(/principals/users/.*)$ {
		return 301 $redirectscheme://$host/egroupware/groupdav.php$1;
	}
	# OpenID Connect autodiscovery
	location = /.well-known/openid-configuration {
		fastcgi_pass fpm;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME /usr/share/egroupware/openid/well-known-configuration.php;
	}
	# generated OpenAPI openapi.json
	location = /egroupware/doc/openapi/openapi.json {
		fastcgi_pass fpm;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME /usr/share/egroupware/doc/openapi/openapi-json.php;
	}
	# the site root and /egroupware open EGroupware
	location = / {
		return 301 $redirectscheme://$host/egroupware/index.php;
	}
	location = /egroupware {
		return 301 $redirectscheme://$host/egroupware/index.php;
	}
}
