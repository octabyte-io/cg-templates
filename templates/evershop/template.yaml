name: EverShop
description: "Self-hosted EverShop: an open-source online store with products, variants, Stripe and PayPal checkout, orders and coupons, built on Node.js."
version: "2.4.0"
tags: [shopify alternative, ecommerce, online store, open source ecommerce, node.js ecommerce, bigcommerce alternative]
links:
  website: https://evershop.io
  docs: https://evershop.io/docs/development/getting-started/introduction
  source: https://github.com/evershopcommerce/evershop
cloudgate: 0.1.0
compose: app
size: medium
inputs:
  DB_PASSWORD: { generate: password }
  ADMIN_EMAIL:
    ask:
      label: Admin email
      description: The email you sign in to the store's admin panel (/admin) with. Cloudgate creates a strong password for it, shown afterwards on the app's variables page.
      format: email
  ADMIN_PASSWORD: { generate: password }
signIn:
  username: ADMIN_EMAIL
  password: ADMIN_PASSWORD
domains:
  - { service: evershop, port: 3000 }
