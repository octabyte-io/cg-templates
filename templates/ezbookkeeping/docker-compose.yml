services:
  ezbookkeeping:
    image: mayswind/ezbookkeeping:2.1.1
    restart: unless-stopped
    depends_on:
      ezbookkeeping-db:
        condition: service_healthy
    environment:
      # The address people open, so links in emails, avatars and receipt
      # pictures point to the right place.
      EBK_SERVER_DOMAIN: ${APP_DOMAIN}
      EBK_SERVER_ROOT_URL: ${APP_URL}/
      EBK_SERVER_ENABLE_GZIP: "true"
      # The makers recommend MySQL or PostgreSQL over SQLite for real use.
      EBK_DATABASE_TYPE: postgres
      EBK_DATABASE_HOST: ezbookkeeping-db:5432
      EBK_DATABASE_NAME: ezbookkeeping
      EBK_DATABASE_USER: ezbookkeeping
      EBK_DATABASE_PASSWD: ${DB_PASSWORD}
      EBK_DATABASE_SSL_MODE: disable
      EBK_LOG_MODE: console
      EBK_SECURITY_SECRET_KEY: ${SECRET_KEY}
      # Open so the owner can create the first account (ezBookkeeping has no
      # separate admin). Set ENABLE_REGISTER=false on the variables page
      # afterwards to stop strangers signing up.
      EBK_USER_ENABLE_REGISTER: ${ENABLE_REGISTER:-true}
    volumes:
      # Receipt pictures, avatars and custom icons.
      - ezbookkeeping-storage:/ezbookkeeping/storage
      - ezbookkeeping-data:/ezbookkeeping/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz.json || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  ezbookkeeping-db:
    image: postgres:17.12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ezbookkeeping
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ezbookkeeping
    volumes:
      - ezbookkeeping-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezbookkeeping -d ezbookkeeping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ezbookkeeping-storage:
  ezbookkeeping-data:
  ezbookkeeping-db-data:
