name: wger
description: "Self-hosted wger plans workouts, logs training and meals, and tracks body weight and measurements, in place of Strong and MyFitnessPal."
version: "2.7.0"
tags: [workout tracker, fitness tracker, myfitnesspal alternative, strong app alternative, calorie counter, gym management, nutrition tracker]
links:
  website: https://wger.de
  docs: https://wger.readthedocs.io/en/latest/
  source: https://github.com/wger-project/wger
cloudgate: 0.1.0
compose: app
# The web server, Celery worker and beat (Python), PowerSync (Node), PostgreSQL,
# Redis and nginx together use about 1.5 GB.
size: medium
inputs:
  WGER_SITE_URL: { value: "{{domains.wger-nginx.url}}" }
  WGER_SECRET_KEY: { generate: base64 }
  # The password of the "admin" account wger creates on first start (it replaces
  # wger's default "adminadmin"); shown afterwards on the app's variables page.
  WGER_ADMIN_PASSWORD: { generate: password }
  DB_PASSWORD: { generate: password }
  POWERSYNC_DB_PASSWORD: { generate: password }
# nginx serves the static and media files and passes everything else to the
# wger server, so it is the service that gets the address.
domains:
  - { service: wger-nginx, port: 80 }
files:
  - { path: nginx.conf }
  - { path: powersync.yaml }
  - { path: sync_rules.yaml }
