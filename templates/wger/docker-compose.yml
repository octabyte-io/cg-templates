# From wger's official production compose (wger-project/docker at tag 2.7.0): the
# wger web server (gunicorn), nginx, PostgreSQL, Redis, the Celery worker and beat
# (exercise and ingredient sync, background jobs) and PowerSync (the mobile app's
# offline mode). nginx stays because it is how wger serves its static and media
# files in production, so it is the service that gets the address.
x-wger-env: &wger-env
  SECRET_KEY: ${WGER_SECRET_KEY}
  SITE_URL: ${WGER_SITE_URL}
  CSRF_TRUSTED_ORIGINS: ${WGER_SITE_URL}
  MEDIA_URL: ${WGER_SITE_URL}/media/
  STATIC_URL: ${WGER_SITE_URL}/static/
  # Cloudgate's proxy sets the https scheme.
  X_FORWARDED_PROTO_HEADER_SET: "True"
  TIME_ZONE: UTC
  TZ: UTC
  # The database (wger reads PS_DATABASE_URI as its own database too) and the
  # PowerSync storage user, created by the web container on start.
  PS_DATABASE_URI: postgres://wger:${DB_PASSWORD}@wger-db:5432/wger
  PS_STORAGE_PG_URI: postgres://powersync_storage:${POWERSYNC_DB_PASSWORD}@wger-db:5432/wger
  PS_PORT: "8080"
  POWERSYNC_URL_PATH: ps
  # Application settings, as in the official config/prod.env.
  WGER_INSTANCE: https://wger.de
  ALLOW_REGISTRATION: "True"
  ALLOW_GUEST_USERS: "False"
  ALLOW_UPLOAD_VIDEOS: "True"
  MIN_ACCOUNT_AGE_TO_TRUST: "21"
  SYNC_EXERCISES_CELERY: "True"
  SYNC_EXERCISE_IMAGES_CELERY: "True"
  SYNC_EXERCISE_VIDEOS_CELERY: "True"
  SYNC_INGREDIENTS_CELERY: "True"
  SYNC_INGREDIENTS_DUMP_URL: https://wger.de/media/ingredients/ingredients.jsonl.gz
  DOWNLOAD_INGREDIENTS_FROM: WGER
  CACHE_API_EXERCISES_CELERY: "True"
  CACHE_API_EXERCISES_CELERY_FORCE_UPDATE: "True"
  USE_CELERY: "True"
  CELERY_BROKER: redis://wger-cache:6379/2
  CELERY_BACKEND: redis://wger-cache:6379/2
  CELERY_WORKER_CONCURRENCY: "4"
  DJANGO_PERFORM_MIGRATIONS: "True"
  DJANGO_CACHE_BACKEND: django_redis.cache.RedisCache
  DJANGO_CACHE_LOCATION: redis://wger-cache:6379/1
  DJANGO_CACHE_TIMEOUT: "1296000"
  DJANGO_CACHE_CLIENT_CLASS: django_redis.client.DefaultClient
  AXES_ENABLED: "True"
  AXES_FAILURE_LIMIT: "10"
  AXES_COOLOFF_TIME: "30"
  AXES_HANDLER: axes.handlers.cache.AxesCacheHandler
  AXES_LOCKOUT_PARAMETERS: ip_address
  # Two proxies in front of wger: Cloudgate's and nginx.
  AXES_IPWARE_PROXY_COUNT: "2"
  AXES_IPWARE_META_PRECEDENCE_ORDER: HTTP_X_FORWARDED_FOR,REMOTE_ADDR
  NUMBER_OF_PROXIES: "2"
  DJANGO_DEBUG: "False"
  WGER_USE_GUNICORN: "True"
  WGER_PORT: "8000"
  EXERCISE_CACHE_TTL: "2419200"
  ACCESS_TOKEN_LIFETIME: "10"
  REFRESH_TOKEN_LIFETIME: "2880"
  LOG_LEVEL_PYTHON: INFO
  USE_RECAPTCHA: "False"
  DJANGO_CLEAR_STATIC_FIRST: "False"
  DJANGO_COLLECTSTATIC_ON_STARTUP: "True"
  FROM_EMAIL: wger Workout Manager <wger@example.com>
  # 2 workers instead of the official 3 to fit a 2 GB server.
  GUNICORN_CMD_ARGS: --workers 2 --threads 2 --worker-class gthread --timeout 240
  EXPOSE_PROMETHEUS_METRICS: "False"

services:
  wger-nginx:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    depends_on:
      wger-web:
        condition: service_healthy
    volumes:
      - ../files/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - wger-static:/wger/static:ro
      - wger-media:/wger/media:ro

  wger-web:
    image: wger/server:2.7.0
    restart: unless-stopped
    depends_on:
      wger-db:
        condition: service_healthy
      wger-cache:
        condition: service_healthy
    # Before the image's own entrypoint:
    # 1. wger needs an RSA key pair for the mobile app's sign-in and PowerSync, which
    #    a Cloudgate setting can't make, so wger's own command makes it once and it is
    #    kept in the wger-keys volume.
    # 2. Set up the database on first start (migrations, fixtures, the "admin" user).
    # 3. Create the PowerSync storage user and schema (the official README's manual step).
    # 4. wger creates "admin" with the password "adminadmin": replace it with the
    #    generated WGER_ADMIN_PASSWORD while it is still the default, so a password
    #    the admin changed later is kept.
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        KEYS=/home/wger/db/jwt-keys.env
        if [ ! -s "$$KEYS" ]; then
          python3 manage.py generate-jwt-keys | grep '^JWT_' > "$$KEYS.tmp"
          mv "$$KEYS.tmp" "$$KEYS"
          chmod 600 "$$KEYS"
        fi
        set -a; . "$$KEYS"; set +a
        wger bootstrap --no-process-static
        python3 manage.py setup-powersync-storage
        python3 manage.py shell -c "
        import os
        from django.contrib.auth.models import User
        u = User.objects.filter(username='admin').first()
        if u and u.check_password('adminadmin'):
            u.set_password(os.environ['WGER_ADMIN_PASSWORD'])
            u.save()
            print('*** Set the admin password to WGER_ADMIN_PASSWORD')
        "
        exec /home/wger/entrypoint.sh
    environment:
      <<: *wger-env
      WGER_ADMIN_PASSWORD: ${WGER_ADMIN_PASSWORD}
    volumes:
      - wger-static:/home/wger/static
      - wger-media:/home/wger/media
      # The generated JWT keys (an empty folder in the image, owned by wger).
      - wger-keys:/home/wger/db
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8000/api/v2/version/"]
      interval: 10s
      timeout: 5s
      start_period: 300s
      retries: 5

  wger-worker:
    image: wger/server:2.7.0
    restart: unless-stopped
    command: /start-worker
    depends_on:
      wger-web:
        condition: service_healthy
    environment: *wger-env
    volumes:
      - wger-media:/home/wger/media
    healthcheck:
      test: ["CMD", "celery", "-A", "wger", "inspect", "ping"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 60s

  wger-beat:
    image: wger/server:2.7.0
    restart: unless-stopped
    command: /start-beat
    depends_on:
      wger-worker:
        condition: service_healthy
    environment: *wger-env
    volumes:
      - wger-beat:/home/wger/beat

  wger-powersync:
    image: journeyapps/powersync-service:1.28.3
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    depends_on:
      wger-web:
        condition: service_healthy
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
      PS_DATABASE_URI: postgres://wger:${DB_PASSWORD}@wger-db:5432/wger
      PS_STORAGE_PG_URI: postgres://powersync_storage:${POWERSYNC_DB_PASSWORD}@wger-db:5432/wger
      PS_PORT: "8080"
      PS_JWKS_URL: http://wger-web:8000/api/v2/powersync-keys
    volumes:
      - ../files/powersync.yaml:/config/powersync.yaml:ro
      - ../files/sync_rules.yaml:/config/sync_rules.yaml:ro

  wger-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: wger
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: wger
    # Logical replication is needed by PowerSync; the rest is the official tuning.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - random_page_cost=1.1
      - -c
      - max_connections=30
    volumes:
      - wger-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wger -d wger"]
      interval: 10s
      timeout: 5s
      retries: 10

  wger-cache:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    # Cache and Celery broker; saves to disk with Redis' default snapshots.
    volumes:
      - wger-cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  wger-static:
  wger-media:
  wger-keys:
  wger-beat:
  wger-db-data:
  wger-cache-data:
