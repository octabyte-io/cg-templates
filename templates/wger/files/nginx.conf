# From wger's official nginx config (wger-project/docker, config/nginx.conf, tag 2.7.0):
# serves the static and media files and passes everything else to the wger server, and
# /ps/ to PowerSync (the mobile app's offline mode). Plain HTTP on port 80: Cloudgate's
# own proxy in front handles the domain and TLS. Upstreams are looked up per request
# (Docker DNS), so nginx starts even while PowerSync is still starting.
resolver 127.0.0.11 valid=30s ipv6=off;

# Keep the scheme set by Cloudgate's proxy in front (https).
map $http_x_forwarded_proto $final_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;

    # Allow video uploads.
    client_max_body_size 100M;

    location / {
        set $wger_upstream http://wger-web:8000;
        proxy_pass $wger_upstream;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $final_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /ps/ {
        set $powersync_upstream http://wger-powersync:8080;
        rewrite ^/ps/(.*)$ /$1 break;
        proxy_pass $powersync_upstream;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $final_forwarded_proto;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Sync streams are long-lived and must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    location /static/ {
        alias /wger/static/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
    }

    location /media/ {
        alias /wger/media/;
    }
}
