name: Outline
description: "Self-hosted Outline: a fast team wiki and knowledge base, and a Notion and Confluence alternative, where your team writes and finds its documents."
version: "1.12.0"
tags: [wiki, knowledge-base, team-wiki, notion-alternative, confluence-alternative, documentation]
links:
  website: https://www.getoutline.com
  docs: https://docs.getoutline.com/s/hosting
  source: https://github.com/outline/outline
cloudgate: 0.1.0
compose: app
size: medium
inputs:
  URL: { value: "{{domains.outline.url}}" }
  SECRET_KEY: { generate: hex }
  UTILS_SECRET: { generate: hex }
  POSTGRES_PASSWORD: { generate: password }
  OIDC_CLIENT_ID:
    ask:
      label: OIDC client ID
      description: The client ID of the app you registered for Outline in your sign-in service (Google, Microsoft Entra, Okta, Authentik and others). Use <Outline's address>/auth/oidc.callback as its redirect URL.
  OIDC_CLIENT_SECRET:
    ask:
      label: OIDC client secret
      secret: true
  OIDC_AUTH_URI:
    ask:
      label: Authorization URL
      description: Your provider's authorization endpoint, e.g. https://auth.example.com/application/o/authorize/
      format: url
  OIDC_TOKEN_URI:
    ask:
      label: Token URL
      format: url
  OIDC_USERINFO_URI:
    ask:
      label: User info URL
      format: url
  OIDC_DISPLAY_NAME:
    ask:
      label: Sign-in button text
      description: Shown on Outline's sign-in page as "Continue with …".
      default: Single sign-on
      required: false
domains:
  - { service: outline, port: 3000 }
