name: Fleetbase
description: "Self-hosted Fleetbase: open-source delivery software to dispatch orders, track drivers on a live map, plan routes and capture proof of delivery."
version: "0.7.75"
tags: ["onfleet alternative", "tookan alternative", "delivery management software", "dispatch software", "fleet management", "courier software", "proof of delivery"]
links:
  website: https://www.fleetbase.io
  docs: https://www.fleetbase.io/docs
  source: https://github.com/fleetbase/fleetbase
cloudgate: 0.1.0
compose: app
# Fleetbase asks for at least 4 GB of memory (README, "Deploy in Cloud").
size: large
inputs:
  CONSOLE_URL: { value: "{{domains.fleetbase.url}}" }
  CONSOLE_HOST_NAME: { value: "{{domains.fleetbase.host}}" }
  API_URL: { value: "{{domains.fleetbase-api.url}}" }
  # Laravel's APP_KEY (32 random bytes, base64); the compose file adds the "base64:" prefix.
  APP_KEY: { generate: base64 }
  DB_ROOT_PASSWORD: { generate: password }
  # Shared by the API and the socket server. Socket auth itself stays off, as upstream's
  # installer leaves it, so the driver and customer apps keep connecting.
  SOCKETCLUSTER_AUTH_KEY: { generate: hex }
domains:
  # The console, where people sign in and work.
  - { service: fleetbase, port: 4200 }
  # The API and its realtime socket (/socketcluster/), which the console and the
  # driver and customer apps call.
  - { service: fleetbase-api, port: 80 }
files:
  - { path: fleetbase.config.json }
  - { path: api-nginx.conf }
