# The API's address: upstream's httpd and "Deploy in Cloud" proxy put the API and its
# realtime socket behind one host, the socket at /socketcluster/.
server {
  listen 80;
  server_tokens off;
  client_max_body_size 600M;
  proxy_connect_timeout 600;
  proxy_send_timeout 600;
  proxy_read_timeout 600;

  location /socketcluster/ {
    proxy_pass http://fleetbase-socket:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://fleetbase-app:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }
}
