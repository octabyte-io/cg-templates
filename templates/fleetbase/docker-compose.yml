# Fleetbase, from upstream's docker-compose.yml and scripts/docker-install.sh (v0.7.75),
# with its production settings from "Deploy in Cloud": the console and the API each get
# their own address, and the API's address also carries the realtime socket.
x-fleetbase-env: &fleetbase-env
  APP_NAME: Fleetbase
  APP_ENV: production
  ENVIRONMENT: production
  APP_DEBUG: "false"
  APP_KEY: base64:${APP_KEY}
  APP_URL: ${API_URL}
  CONSOLE_HOST: ${CONSOLE_URL}
  DATABASE_URL: mysql://root:${DB_ROOT_PASSWORD}@fleetbase-db/fleetbase
  QUEUE_CONNECTION: redis
  CACHE_DRIVER: redis
  CACHE_PATH: /fleetbase/api/storage/framework/cache
  CACHE_URL: tcp://fleetbase-cache
  REDIS_URL: tcp://fleetbase-cache
  BROADCAST_DRIVER: socketcluster
  LOG_CHANNEL: stdout
  # Mail is written to the log until an admin sets up a mail server in the console
  # (Admin > Configure > Mail). A real from-address is needed even then: upstream's
  # .env example says "null", which breaks every send.
  MAIL_MAILER: log
  MAIL_FROM_ADDRESS: hello@fleetbase.io
  MAIL_FROM_NAME: Fleetbase
  REGISTRY_HOST: https://registry.fleetbase.io
  REGISTRY_PREINSTALLED_EXTENSIONS: "true"
  OSRM_HOST: https://router.project-osrm.org
  SOCKETCLUSTER_HOST: fleetbase-socket
  SOCKETCLUSTER_PORT: "8000"
  SOCKETCLUSTER_PUBLISH_URL: http://fleetbase-socket:8001
  SOCKETCLUSTER_ORIGIN: ${CONSOLE_URL}
  SOCKETCLUSTER_AUTH_ENABLED: "false"
  SOCKETCLUSTER_AUTH_KEY: ${SOCKETCLUSTER_AUTH_KEY}

services:
  # The console (web app). The published image is built with runtime config
  # switched off (APP.disableRuntimeConfig), so on its own it ignores
  # fleetbase.config.json, calls the API on the console's own host and opens the
  # socket on port 38000. The command switches runtime config back on at every
  # start, and drops the integrity hash of the one script it edits so the browser
  # still loads it.
  fleetbase:
    image: fleetbase/fleetbase-console:v0.7.75
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        for js in /usr/share/nginx/html/assets/@fleetbase/console-*.js; do
        sed -i 's/disableRuntimeConfig:!0/disableRuntimeConfig:!1/g' "$$js";
        name=$$(basename "$$js");
        sed -i "s#\(/assets/@fleetbase/$$name\"\) integrity=\"[^\"]*\"#\1#" /usr/share/nginx/html/index.html;
        done;
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    volumes:
      - ../files/fleetbase.config.json:/usr/share/nginx/html/fleetbase.config.json:ro

  # The API's address: upstream's httpd, passing the API to fleetbase-app and
  # /socketcluster/ to fleetbase-socket.
  fleetbase-api:
    image: nginx:1.30.2-alpine
    restart: unless-stopped
    depends_on:
      fleetbase-app:
        condition: service_started
      fleetbase-socket:
        condition: service_started
    volumes:
      - ../files/api-nginx.conf:/etc/nginx/conf.d/default.conf:ro

  fleetbase-app:
    image: fleetbase/fleetbase-api:v0.7.75
    restart: unless-stopped
    depends_on:
      fleetbase-deploy:
        condition: service_completed_successfully
    environment: *fleetbase-env
    volumes:
      - fleetbase-storage:/fleetbase/api/storage/app

  # Upstream's deploy.sh, run at every start: creates the databases, runs the
  # migrations (also after an image update), seeds and sets up permissions.
  fleetbase-deploy:
    image: fleetbase/fleetbase-api:v0.7.75
    restart: "no"
    command: ["./deploy.sh"]
    depends_on:
      fleetbase-db:
        condition: service_healthy
      fleetbase-cache:
        condition: service_healthy
    environment: *fleetbase-env
    volumes:
      - fleetbase-storage:/fleetbase/api/storage/app

  fleetbase-queue:
    image: fleetbase/fleetbase-api:v0.7.75
    restart: unless-stopped
    command: ["php", "artisan", "queue:work"]
    depends_on:
      fleetbase-deploy:
        condition: service_completed_successfully
    environment: *fleetbase-env
    volumes:
      - fleetbase-storage:/fleetbase/api/storage/app
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:status"]
      interval: 30s
      timeout: 10s
      retries: 3

  fleetbase-scheduler:
    image: fleetbase/fleetbase-api:v0.7.75
    restart: unless-stopped
    command: ["go-crond", "--verbose", "root:./crontab"]
    depends_on:
      fleetbase-deploy:
        condition: service_completed_successfully
    environment: *fleetbase-env
    volumes:
      - fleetbase-storage:/fleetbase/api/storage/app
    # The image's own healthcheck asks the web server's metrics port, which only
    # fleetbase-app runs.
    healthcheck:
      disable: true

  # SocketCluster: live updates for the console and the driver and customer apps.
  fleetbase-socket:
    image: fleetbase/fleetbase-socket:v0.7.75
    restart: unless-stopped
    environment:
      SOCKETCLUSTER_AUTH_ENABLED: "false"
      SOCKETCLUSTER_AUTH_KEY: ${SOCKETCLUSTER_AUTH_KEY}
      SOCKETCLUSTER_AUTHORIZE_URL: http://fleetbase-app:8000/int/v1/socket/authorize
      SOCKETCLUSTER_OPTIONS: '{"origins":"${CONSOLE_HOST_NAME}:*"}'

  fleetbase-db:
    image: mysql:8.0.46-oracle
    restart: unless-stopped
    # As upstream: binary logging is off, since nothing replicates from it.
    command: ["mysqld", "--skip-log-bin"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: fleetbase
    volumes:
      - fleetbase-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  fleetbase-cache:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    volumes:
      - fleetbase-cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fleetbase-storage:
  fleetbase-db-data:
  fleetbase-cache-data:
