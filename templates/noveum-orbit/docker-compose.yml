# Based on Orbit's container catalog (deploy/catalogs/compose.yaml) at release
# containers-2026.09.24, with the service names prefixed and every image pinned.
x-orbit-env: &orbit-env
  DATABASE_URL: postgres://orbit:${POSTGRES_PASSWORD}@orbit-db:5432/orbit
  DIRECT_URL: postgres://orbit:${POSTGRES_PASSWORD}@orbit-db:5432/orbit
  DATABASE_PREPARED_STATEMENTS: "true"
  REDIS_URL: redis://orbit-redis:6379
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: ${ORBIT_APP_URL}
  NEXT_PUBLIC_APP_URL: ${ORBIT_APP_URL}
  # Sign-up with email and password; email codes, invites and OAuth need
  # provider keys added later (see Orbit's configuration docs).
  ORBIT_PASSWORD_AUTH: "true"
  CRON_SECRET: ${CRON_SECRET}
  ORBIT_SELF_HOSTED: "true"
  S3_ENDPOINT: ${ORBIT_STORAGE_URL}
  S3_REGION: us-east-1
  S3_BUCKET: orbit-uploads
  S3_ACCESS_KEY_ID: orbit
  S3_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
  NEXT_TELEMETRY_DISABLED: "1"

services:
  # The gateway (Caddy) routes realtime traffic to orbit-realtime and the rest
  # to orbit-web.
  orbit:
    image: ghcr.io/noveum/orbit-gateway:2026.09.24
    restart: unless-stopped
    environment:
      ORBIT_TRUSTED_PROXIES: private_ranges
      ORBIT_WEB_UPSTREAM: orbit-web:3000
      ORBIT_REALTIME_UPSTREAM: orbit-realtime:3100
    depends_on:
      orbit-web:
        condition: service_healthy
      orbit-realtime:
        condition: service_healthy
      orbit-scheduler:
        condition: service_started

  # Applies database migrations, then starts the web app.
  orbit-web:
    image: ghcr.io/noveum/orbit-runtime:2026.09.24
    restart: unless-stopped
    init: true
    environment: *orbit-env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    depends_on:
      orbit-db:
        condition: service_healthy
      orbit-redis:
        condition: service_healthy
      orbit-bucket:
        condition: service_healthy

  orbit-realtime:
    image: ghcr.io/noveum/orbit-runtime:2026.09.24
    restart: unless-stopped
    init: true
    command: ["node", "apps/web/realtime.mjs"]
    environment: *orbit-env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      orbit-web:
        condition: service_healthy

  # Runs Orbit's timed jobs by calling the web app with CRON_SECRET.
  # Run exactly one.
  orbit-scheduler:
    image: ghcr.io/noveum/orbit-runtime:2026.09.24
    restart: unless-stopped
    init: true
    command: ["node", "apps/web/scheduler.mjs"]
    environment:
      CRON_SECRET: ${CRON_SECRET}
      ORBIT_INTERNAL_URL: http://orbit-web:3000
    stop_grace_period: 310s
    depends_on:
      orbit-web:
        condition: service_healthy

  orbit-db:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: orbit
    volumes:
      - orbit-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 3s
      retries: 20

  orbit-redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - orbit-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Private file storage for attachments and uploads. Browsers reach it at its
  # own web address with signed links; the bucket is not public.
  orbit-storage:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: orbit
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: ${ORBIT_APP_URL}
    volumes:
      - orbit-storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the uploads bucket and sets its CORS rule, then stays up idle.
  orbit-bucket:
    image: ghcr.io/noveum/orbit-bucket:2026.09.24
    restart: unless-stopped
    environment:
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      ORBIT_APP_URL: ${ORBIT_APP_URL}
      ORBIT_STORAGE_UPSTREAM: orbit-storage:9000
    depends_on:
      orbit-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/initialized"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  orbit-db-data:
  orbit-redis-data:
  orbit-storage-data:
