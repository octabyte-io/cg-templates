# From the "Run with Docker compose" example in Spliit's README, with the
# published image pinned and a generated database password.
#
# Spliit has no user accounts by design: whoever creates a group shares its
# link, and anyone with that link can see and edit the group. Group links are
# long random ids and the app never lists groups, so it is left open like the
# official spliit.app instance.
services:
  spliit:
    image: ghcr.io/spliit-app/spliit:1.30.0
    restart: unless-stopped
    depends_on:
      spliit-db:
        condition: service_healthy
    environment:
      # Applies database migrations at each start, then serves on port 3000.
      POSTGRES_PRISMA_URL: postgresql://spliit:${POSTGRES_PASSWORD}@spliit-db:5432/spliit
      POSTGRES_URL_NON_POOLING: postgresql://spliit:${POSTGRES_PASSWORD}@spliit-db:5432/spliit
      BASE_URL: ${BASE_URL}
      DEFAULT_CURRENCY_CODE: ${DEFAULT_CURRENCY_CODE:-USD}
      # Next.js otherwise listens only on the container's own hostname.
      HOSTNAME: 0.0.0.0
    healthcheck:
      # Ready means the app is up and can reach its database.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  spliit-db:
    image: postgres:17.12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spliit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: spliit
    volumes:
      - spliit-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spliit -d spliit"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  spliit-db-data:
