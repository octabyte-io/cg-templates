name: Appsmith
description: "Self-hosted Appsmith Community Edition: build internal tools, admin panels and dashboards on your own databases and APIs, with no per-user fee."
version: "2.7.0"
tags: [retool alternative, internal tools, low-code, admin panel builder, power apps alternative, app builder]
links:
  website: https://www.appsmith.com
  docs: https://docs.appsmith.com
  source: https://github.com/appsmithorg/appsmith
cloudgate: 0.1.0
compose: app
size: large
inputs:
  APPSMITH_ENCRYPTION_PASSWORD: { generate: hex }
  APPSMITH_ENCRYPTION_SALT: { generate: hex }
domains:
  - { service: appsmith, port: 80 }
