services:
  kener:
    image: rajnandan1/kener:4.2.1
    restart: unless-stopped
    depends_on:
      kener-redis:
        condition: service_healthy
    environment:
      KENER_SECRET_KEY: ${KENER_SECRET_KEY}
      # Kener's public address; used for CSRF protection and links in emails.
      ORIGIN: ${ORIGIN}
      REDIS_URL: redis://kener-redis:6379
      # The built-in SQLite database, kept in the data volume below.
      DATABASE_URL: sqlite://./database/kener.sqlite.db
      # Optional email (SMTP). Kener turns email on only when host, port, user, password and sender are all set.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_SECURE: ${SMTP_SECURE:-0}
    volumes:
      - kener-data:/app/database

  kener-redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    volumes:
      - kener-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  kener-data:
  kener-redis-data:
