# From Louez's own one-command docker-compose.yml (v2.3.1), in single-store
# ("standalone") mode. The optional background-removal worker (about 400 MB of
# image and 450 MB of memory) is left out: the app works without it, and the
# one-click "remove background" button stays off.
services:
  louez:
    image: synapsr/louez:2.3.1
    restart: unless-stopped
    depends_on:
      louez-db:
        condition: service_healthy
      louez-minio:
        condition: service_healthy
    environment:
      LOUEZ_MODE: standalone
      # Self-hosted instances bill nobody: no Louez fee, subscription or invoice.
      LOUEZ_BILLING: "off"
      DATABASE_URL: mysql://louez:${DB_PASSWORD}@louez-db:3306/louez
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      NEXT_PUBLIC_APP_DOMAIN: ${APP_DOMAIN}
      AUTH_URL: ${APP_URL}
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ${AUTH_SECRET}
      # A private bucket; the app serves images same-origin under /files.
      S3_ENDPOINT: http://louez-minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: louez
      S3_ACCESS_KEY_ID: louez
      S3_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
      S3_PUBLIC_URL: /files
    volumes:
      - louez-data:/app/data

  louez-db:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: louez
      MYSQL_USER: louez
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - louez-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The official minio/minio image is no longer published (upstream now uses an
  # unversioned Chainguard build); pgsty/silo is a maintained MinIO build with
  # release tags, as in the Plane and Maxun templates. A bucket is a top-level
  # folder of the data drive, so creating the folder creates the bucket.
  louez-minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /data/louez && exec /usr/bin/docker-entrypoint.sh server /data"]
    environment:
      MINIO_ROOT_USER: louez
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      MINIO_BROWSER: "off"
    volumes:
      - louez-files:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  louez-data:
  louez-db-data:
  louez-files:
