# Sharry's settings. Only what differs from Sharry's defaults is here; the
# defaults are listed at https://eikek.github.io/sharry/doc/configure.
# Values written ${?NAME} come from the environment set in docker-compose.yml.
sharry.restserver {
  # The app's public address, used for share links and the login cookie.
  base-url = ${?SHARRY_BASE_URL}

  bind {
    address = "0.0.0.0"
    port = 9090
  }

  backend {
    auth {
      # Signs login tokens; a fixed random value keeps people signed in
      # across restarts.
      server-secret = ${?SHARRY_BACKEND_AUTH_SERVER_SECRET}

      # The admin account. Its name and password come from Cloudgate's
      # inputs; Sharry creates the account at its first sign-in.
      fixed {
        enabled = true
        user = ${?SHARRY_BACKEND_AUTH_FIXED_USER}
        password = ${?SHARRY_BACKEND_AUTH_FIXED_PASSWORD}
      }
    }

    jdbc {
      url = "jdbc:postgresql://sharry-db:5432/sharry"
      user = "sharry"
      password = ${?SHARRY_BACKEND_JDBC_PASSWORD}
    }

    # Uploaded files are kept in the database (Sharry's default store).

    # Nobody can sign up without an invitation key, which the admin creates
    # under Administration > Invites using the invite password. People
    # without an account can still upload through an alias page.
    signup {
      mode = "invite"
      invite-password = ${?SHARRY_BACKEND_SIGNUP_INVITE_PASSWORD}
    }
  }
}
