# Based on the official compose file in github.com/Leantime/docker-leantime (app + MySQL).
services:
  leantime:
    # The official image: nginx + PHP-FPM on port 8080, with its own curl healthcheck.
    image: leantime/leantime:3.14.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      leantime-db:
        condition: service_healthy
    environment:
      # The app's public https address; Leantime builds its links and redirects from it.
      LEAN_APP_URL: ${LEAN_APP_URL}
      LEAN_SESSION_PASSWORD: ${LEAN_SESSION_PASSWORD}
      LEAN_SESSION_EXPIRATION: 28800
      # Cloudgate serves the app over https, so session cookies can be https-only.
      LEAN_SESSION_SECURE: "true"
      LEAN_DEFAULT_TIMEZONE: ${TIMEZONE:-UTC}
      LEAN_DB_HOST: leantime-db
      LEAN_DB_PORT: 3306
      LEAN_DB_USER: leantime
      LEAN_DB_PASSWORD: ${DB_PASSWORD}
      LEAN_DB_DATABASE: leantime
      LEAN_DEBUG: 0
    volumes:
      - leantime-public-userfiles:/var/www/html/public/userfiles
      - leantime-userfiles:/var/www/html/userfiles
      - leantime-plugins:/var/www/html/app/Plugins
      - leantime-logs:/var/www/html/storage/logs

  leantime-db:
    image: mysql:8.4.13
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: leantime
      MYSQL_USER: leantime
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - leantime-db-data:/var/lib/mysql
    healthcheck:
      # TCP, not the socket: MySQL's temporary first-run server listens on the socket only.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  leantime-public-userfiles:
  leantime-userfiles:
  leantime-plugins:
  leantime-logs:
  leantime-db-data:
