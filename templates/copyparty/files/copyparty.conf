# copyparty.conf: copyparty's settings, read at every start (upstream's
# basic-docker-compose example, adapted). The "admin" account and its password
# come from the command line in docker-compose.yml, so no password is in here.

[global]
  e2dsa         # index every file, so search and share links work
  e2ts          # read tags from music and video files
  hist: /cfg/hists/   # keep the index and thumbnails out of the shared files
  shr: /shr     # let signed-in users make share links (under /shr/)
  xff-src: lan  # trust the client address sent by Cloudgate's proxy
  rproxy: -1
  no-robots     # ask search engines not to index the files
  usernames     # sign in with user name and password
  ansi

[/]             # the web root shares /w (the files volume)
  /w
  accs:
    rwmda: admin   # admin can read, write, move, delete and administer
    # nobody else, and no visitor who is not signed in, has any access
