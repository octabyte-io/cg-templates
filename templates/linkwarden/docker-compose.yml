# From linkwarden/linkwarden's docker-compose.yml and .env.sample (v2.17.0), with
# the .env file written out as settings and every image pinned to a version.
services:
  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:v2.17.0
    restart: unless-stopped
    depends_on:
      linkwarden-db:
        condition: service_healthy
      linkwarden-meilisearch:
        condition: service_healthy
    environment:
      # NextAuth's base URL must end in /api/v1/auth.
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      DATABASE_URL: postgresql://linkwarden:${POSTGRES_PASSWORD}@linkwarden-db:5432/linkwarden
      MEILI_HOST: http://linkwarden-meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      # The first account to sign up is the administrator.
      NEXT_PUBLIC_DISABLE_REGISTRATION: ${NEXT_PUBLIC_DISABLE_REGISTRATION:-false}
      # AI tagging, S3 storage, email and single sign-on stay off until their
      # settings are added (see docs.linkwarden.app, environment variables).
    volumes:
      # Archived pages, screenshots, PDFs and uploads (STORAGE_FOLDER "data").
      - linkwarden-data:/data/data
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

  linkwarden-db:
    image: postgres:16.16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkwarden
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: linkwarden
    volumes:
      - linkwarden-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkwarden -d linkwarden"]
      interval: 10s
      timeout: 5s
      retries: 10

  linkwarden-meilisearch:
    image: getmeili/meilisearch:v1.13.3
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - linkwarden-meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  linkwarden-data:
  linkwarden-db-data:
  linkwarden-meilisearch-data:
