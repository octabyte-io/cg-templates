name: EspoCRM
description: "Self-hosted EspoCRM is a free, open-source CRM for leads, contacts, sales deals, email and support cases, with no per-user fee."
version: "10.1.1"
tags: [espocrm, open source crm, self-hosted crm, salesforce alternative, hubspot alternative, sales pipeline, zoho crm alternative]
links:
  website: https://www.espocrm.com
  docs: https://docs.espocrm.com/administration/docker/installation/
  source: https://github.com/espocrm/espocrm
cloudgate: 0.1.0
compose: app
# Web app, daemon, WebSocket server and MariaDB together; 2 GB keeps PHP and
# MariaDB comfortable.
size: medium
inputs:
  SITE_URL: { value: "{{domains.proxy.url}}" }
  SITE_HOST: { value: "{{domains.proxy.host}}" }
  ADMIN_PASSWORD: { generate: password }
  DB_PASSWORD: { generate: password }
  DB_ROOT_PASSWORD: { generate: password }
signIn:
  username: { value: admin }
  password: ADMIN_PASSWORD
# EspoCRM's documented proxy routes /ws to the WebSocket server and everything
# else to the web app, so it is the service that gets the address.
domains:
  - { service: proxy, port: 80 }
files:
  - { path: Caddyfile }
