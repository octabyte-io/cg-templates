name: Galette
description: "Self-hosted Galette keeps your association's members list, tracks membership fees, sends renewal reminders and mailings, and prints member cards."
version: "1.3.3"
tags: [membership management, association management software, wild apricot alternative, assoconnect alternative, membership dues tracking, nonprofit software]
links:
  website: https://galette.eu
  docs: https://doc.galette.eu
  source: https://github.com/galette/galette
cloudgate: 0.1.0
compose: app
size: small
inputs:
  GALETTE_URL: { value: "{{domains.galette.url}}" }
  ADMIN_PASSWORD: { generate: password }
  DB_PASSWORD: { generate: password }
  DB_ROOT_PASSWORD: { generate: password }
domains:
  - { service: galette, port: 80 }
files:
  - { path: galette-start.sh.txt }
