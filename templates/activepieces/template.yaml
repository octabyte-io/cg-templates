name: Activepieces
description: "Activepieces is an open-source Zapier alternative: automate work between your apps with step-by-step flows, AI steps and approvals, with no task limits."
version: "0.93.0"
tags: [zapier alternative, workflow automation, no-code, ai agents, integrations, open source]
links:
  website: https://www.activepieces.com
  docs: https://www.activepieces.com/docs/install/overview
  source: https://github.com/activepieces/activepieces
cloudgate: 0.1.0
compose: app
size: medium
inputs:
  FRONTEND_URL: { value: "{{domains.activepieces.url}}" }
  ENCRYPTION_KEY: { generate: password }
  JWT_SECRET: { generate: hex }
  POSTGRES_PASSWORD: { generate: password }
domains:
  - { service: activepieces, port: 80 }
