# The data-collection address (KoboToolbox's "KoboCAT" / OpenRosa server), the
# one KoboCollect and the web forms send submissions to, as kobo-docker's nginx
# serves it (nginx/kobo-docker-scripts/templates/nginx_site_default.conf.tmpl).
charset utf-8;

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 100M;
    large_client_header_buffers 8 16k;

    location /static {
        alias /srv/www/kpi;
    }

    location ~ ^/.+/bulk-submission(-form)?$ {
        include /etc/nginx/kobo-uwsgi.conf;
    }

    location ~ ^/.+/(exports|forms)/.+/ {
        include /etc/nginx/kobo-uwsgi.conf;
    }

    location ~ ^/.+/(formList|submission|xformsManifest|xformsMedia) {
        include /etc/nginx/kobo-uwsgi.conf;
    }

    location ~ ^/(attachment|media)/(.*)$ {
        include /etc/nginx/kobo-uwsgi.conf;
    }

    location ~ ^/(formList|formUpload|submission|upload)$ {
        include /etc/nginx/kobo-uwsgi.conf;
    }

    location ~ ^/view/(downloadSubmission|submissionList)$ {
        include /etc/nginx/kobo-uwsgi.conf;
    }

    location ~ ^/(forms|xformsManifest|xformsMedia)/([0-9]+) {
        include /etc/nginx/kobo-uwsgi.conf;
    }

    location /api/v1 {
        include /etc/nginx/kobo-uwsgi.conf;
    }

    location /legacy/ {
        include /etc/nginx/kobo-uwsgi.conf;
    }

    # Uploaded files, sent by the app after its permission check.
    location /protected/ {
        internal;
        alias /media/;
    }

    # The root sends people to the main address.
    location = / {
        return 301 {{KOBOFORM_URL}}/;
    }

    location / {
        return 404;
    }
}
