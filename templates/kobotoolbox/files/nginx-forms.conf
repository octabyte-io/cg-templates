# The main address (KoboToolbox's "KPI" / form builder), as kobo-docker's nginx
# serves it (nginx/kobo-docker-scripts/templates/nginx_site_default.conf.tmpl),
# listening on one address instead of choosing by host name.
charset utf-8;

map $arg_format $schema_v2_file {
    default /schema_v2.yaml;
    json    /schema_v2.json;
}

map $arg_format $schema_openrosa_file {
    default /schema_openrosa.yaml;
    json    /schema_openrosa.json;
}

map $arg_format $schema_type {
    default application/yaml;
    json    application/json;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 100M;
    large_client_header_buffers 8 16k;

    location ~ ^/forms/(.*) {
        return 301 /$1;
    }

    # The data-collection API lives on the collection address.
    location /api/v1 {
        return 404;
    }

    location /static {
        alias /srv/www/kpi;
    }

    # Public media, e.g. custom logos.
    location /media/__public {
        alias /srv/kpi_media/__public;
    }

    # The API schemas, served from the files the app generates.
    location ~ ^/api/(v2|openrosa)/schema$ {
        return 301 /api/$1/schema/$is_args$args;
    }

    location = /api/v2/schema/ {
       root /srv/www/kpi/openapi;
       try_files $schema_v2_file =404;
       add_header Content-Type $schema_type always;
    }

    location = /api/openrosa/schema/ {
       root /srv/www/kpi/openapi;
       try_files $schema_openrosa_file =404;
       add_header Content-Type $schema_type always;
    }

    # Uploaded files, sent by the app after its permission check.
    location /protected/ {
        internal;
        alias /media/;
    }

    location / {
        include /etc/nginx/kobo-uwsgi.conf;
    }
}
