# How both addresses pass a request to the app server (uWSGI on port 8000),
# from kobo-docker's nginx/kobo-docker-scripts/templates/uwsgi_pass.conf.tmpl.
uwsgi_read_timeout 130;
uwsgi_send_timeout 130;

# Resolve the app container at request time, so nginx starts before it does.
resolver 127.0.0.11 ipv6=off valid=1s;
set $upstream "kobotoolbox-kpi:8000";
uwsgi_pass $upstream;
uwsgi_param HTTP_X_REAL_IP $remote_addr;
uwsgi_param HTTP_X_FORWARDED_FOR $remote_addr;
include /etc/nginx/uwsgi_params;
# Tell the app the visitor's address is https when the proxy in front says so.
uwsgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;

uwsgi_buffers 8 16k;
uwsgi_buffer_size 16k;
uwsgi_force_ranges on;
