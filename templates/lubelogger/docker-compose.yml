services:
  lubelogger:
    image: ghcr.io/hargata/lubelogger:v1.7.4
    restart: unless-stopped
    # From the official docker-compose.yml. LubeLogger keeps its data in a
    # built-in LiteDB database under /App/data, with uploaded documents and
    # images. Sign-in is off until the owner turns on "Enable Authentication"
    # in Settings and sets the root username and password there. The image
    # has neither curl nor wget, so there is no healthcheck.
    environment:
      # Used to build the links in invitation and password-reset emails.
      LUBELOGGER_DOMAIN: ${LUBELOGGER_DOMAIN}
    volumes:
      - lubelogger-data:/App/data
      - lubelogger-keys:/root/.aspnet/DataProtection-Keys

volumes:
  lubelogger-data:
  lubelogger-keys:
