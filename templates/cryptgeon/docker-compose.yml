services:
  cryptgeon:
    image: cupcakearmy/cryptgeon:2.9.3
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS: redis://redis/
      # Largest note or file upload. The app allows up to 512 MiB.
      SIZE_LIMIT: 4 MiB
    healthcheck:
      # The image is Alpine with curl installed.
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/api/live"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    # Notes stay in memory only: no snapshots, no append-only file. When memory
    # is full the oldest notes are removed.
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
