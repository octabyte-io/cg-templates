name: PhotoPrism
description: "Self-hosted PhotoPrism: an open-source photo library that sorts pictures by place, face and subject, so you can find any photo without Google Photos."
version: "261029"
tags: [google photos alternative, self-hosted photo library, photo management, photo organizer, icloud photos alternative, raw photo library]
links:
  website: https://www.photoprism.app
  docs: https://docs.photoprism.app
  source: https://github.com/photoprism/photoprism
cloudgate: 0.1.0
compose: app
size: large
inputs:
  SITE_URL: { value: "{{domains.photoprism.url}}" }
  ADMIN_PASSWORD: { generate: password }
  DB_PASSWORD: { generate: password }
  DB_ROOT_PASSWORD: { generate: password }
domains:
  - { service: photoprism, port: 2342 }
