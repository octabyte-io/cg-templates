services:
  stirling-pdf:
    # The standard image the docs recommend ("latest"): all PDF tools, with
    # LibreOffice, Tesseract OCR and the other converters, plus sign-in and
    # admin settings. It runs on the Free plan; no licence key is needed.
    # The image has its own healthcheck (curl on /api/v1/info/status).
    image: stirlingtools/stirling-pdf:3.3.0
    restart: unless-stopped
    environment:
      # The first admin account, made only while the user database is empty.
      # Without these the app would start with admin / stirling.
      SECURITY_INITIALLOGIN_USERNAME: ${ADMIN_USERNAME}
      SECURITY_INITIALLOGIN_PASSWORD: ${ADMIN_PASSWORD}
      # The app's public address, used for links in emails.
      SYSTEM_FRONTENDURL: ${APP_URL}
    volumes:
      # Settings, the built-in database and generated keys.
      - stirling-pdf-configs:/configs
      # Files people save on the server (file storage is on by default).
      - stirling-pdf-storage:/storage
      - stirling-pdf-custom-files:/customFiles
      - stirling-pdf-pipeline:/pipeline
      - stirling-pdf-tessdata:/usr/share/tessdata
      - stirling-pdf-logs:/logs
    # The docs' suggested memory for this image.
    mem_limit: 4g

volumes:
  stirling-pdf-configs:
  stirling-pdf-storage:
  stirling-pdf-custom-files:
  stirling-pdf-pipeline:
  stirling-pdf-tessdata:
  stirling-pdf-logs:
