services:
  notifuse:
    image: notifuse/notifuse:v43.0
    restart: unless-stopped
    depends_on:
      notifuse-db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SERVER_HOST: 0.0.0.0
      ENVIRONMENT: production
      # Notifuse creates one database per workspace, so it signs in as the
      # database's owner (postgres), as its official compose file does.
      DB_HOST: notifuse-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PREFIX: notifuse
      DB_NAME: notifuse_system
      DB_SSLMODE: disable
      # Encrypts stored credentials and signs sessions and API keys.
      SECRET_KEY: ${SECRET_KEY}
      # The app's public address, used in links, tracking and unsubscribe URLs.
      API_ENDPOINT: ${API_ENDPOINT}
      # The admin email and the SMTP server are set in the setup wizard on first visit.
    volumes:
      - notifuse-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  notifuse-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - notifuse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  notifuse-data:
  notifuse-db-data:
