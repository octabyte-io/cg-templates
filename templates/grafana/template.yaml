name: Grafana
description: "Self-hosted Grafana turns your server metrics, logs and databases into live dashboards, with alerts by email, Slack or Teams when a number goes wrong."
version: "13.3.1"
tags: [grafana, datadog alternative, dashboards, server monitoring, metrics and logs, alerting, open source dashboards]
links:
  website: https://grafana.com/oss/grafana/
  docs: https://grafana.com/docs/grafana/latest/
  source: https://github.com/grafana/grafana
cloudgate: 0.1.0
compose: app
size: small
inputs:
  GF_SERVER_ROOT_URL: { value: "{{domains.grafana.url}}" }
  GF_SECURITY_ADMIN_PASSWORD: { generate: password }
  GF_SECURITY_SECRET_KEY: { generate: hex }
signIn:
  username: { value: admin }
  password: GF_SECURITY_ADMIN_PASSWORD
domains:
  - { service: grafana, port: 3000 }
