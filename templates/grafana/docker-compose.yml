services:
  grafana:
    # The open-source (OSS) image, not grafana/grafana-enterprise.
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL}
      # The first sign-in is "admin" with this generated password. It is read
      # only on the first start; change it later in Grafana's profile page.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      # Encrypts data source passwords and API keys stored in the database.
      GF_SECURITY_SECRET_KEY: ${GF_SECURITY_SECRET_KEY}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      # Dashboards, users and settings live in Grafana's built-in SQLite database here.
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data:
