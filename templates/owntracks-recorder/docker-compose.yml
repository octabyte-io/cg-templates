# From OwnTracks' official Docker image and its docs (github.com/owntracks/docker-recorder),
# in HTTP mode: phones send their locations to /pub over HTTPS instead of to an
# MQTT broker. The Recorder has no sign-in of its own, so a small Caddy proxy
# asks for a username and password first, as the Recorder's README recommends.
services:
  proxy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    environment:
      BASIC_AUTH_USER: ${RECORDER_USERNAME}
      BASIC_AUTH_PASSWORD: ${RECORDER_PASSWORD}
    # Caddy needs a bcrypt hash of the password; make it at each start.
    entrypoint:
      - /bin/sh
      - -c
      - export BASIC_AUTH_HASH="$$(caddy hash-password --plaintext "$$BASIC_AUTH_PASSWORD")" && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ../files/Caddyfile.txt:/etc/caddy/Caddyfile:ro
    depends_on:
      recorder:
        condition: service_healthy

  recorder:
    image: owntracks/recorder:1.0.4
    restart: unless-stopped
    environment:
      # HTTP mode only: port 0 turns off the MQTT connection.
      OTR_PORT: "0"
      # The image's config binds to [::], which fails where Docker has no IPv6.
      OTR_HTTPHOST: 0.0.0.0
      OTR_HTTPPORT: "8083"
      TZ: ${TIME_ZONE}
    volumes:
      # Every recorded location, per user and device, as plain files, plus
      # the Recorder's small databases (place names, friends, cards).
      - recorder-store:/store
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8083/api/0/version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  recorder-store:
