name: Gitea
description: "Self-hosted Gitea: an open-source GitHub alternative for private code hosting, code reviews, issue tracking and automatic builds, for small software teams."
version: "28.3.0"
tags: [git, git server, code hosting, code review, issue tracker, ci, devtools]
links:
  website: https://about.gitea.com
  docs: https://docs.gitea.com
  source: https://github.com/go-gitea/gitea
cloudgate: 0.1.0
compose: app
size: small
inputs:
  ROOT_URL: { value: "{{domains.gitea.url}}/" }
  DB_PASSWORD: { generate: password }
  SECRET_KEY: { generate: hex }
  DISABLE_REGISTRATION:
    ask:
      label: Turn off open sign-up
      description: >-
        Leave this "false" for now: the first account registered becomes the
        admin. Once your team has accounts, change it to "true" in this app's
        variables and redeploy, so only the admin can add people. "true" at
        setup leaves nobody able to register, not even the admin.
      default: "false"
      pattern: "true|false"
domains:
  - { service: gitea, port: 3000 }
