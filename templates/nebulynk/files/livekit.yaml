# From Nebulynk's livekit.yaml at v0.8.1. The API keys come from LIVEKIT_KEYS.
# Audio and video need TCP 7881 and UDP 7882 open to the internet, which a
# Cloudgate app does not get, so meetings and calls don't connect.
port: 7880
rtc:
  udp_port: 7882
  tcp_port: 7881
  # Upstream sets use_external_ip: true, which makes LiveKit stop if it can't
  # reach a STUN server. Media ports aren't open here anyway, so it stays off.
  use_external_ip: false
redis:
  address: nebulynk-redis:6379
