services:
  open-webui:
    # The standard image (not :cuda or :ollama): Open WebUI alone, with no
    # local model server. Connect an AI provider in Admin Settings > Connections.
    image: ghcr.io/open-webui/open-webui:v0.13.3
    restart: unless-stopped
    environment:
      WEBUI_URL: ${WEBUI_URL}
      CORS_ALLOW_ORIGIN: ${WEBUI_URL}
      # Signs sign-in tokens; set here so sessions survive a container rebuild.
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      # No Ollama is installed alongside; it can be turned on later in the
      # admin settings if you run one elsewhere.
      ENABLE_OLLAMA_API: "false"
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - open-webui-data:/app/backend/data
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

volumes:
  open-webui-data:
