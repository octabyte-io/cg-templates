# Based on the official docker-compose.yml of Tube Archivist v0.6.0.
services:
  tubearchivist:
    image: bbilly1/tubearchivist:v0.6.0
    restart: unless-stopped
    depends_on:
      tubearchivist-es:
        condition: service_healthy
      tubearchivist-redis:
        condition: service_healthy
    environment:
      ES_URL: http://tubearchivist-es:9200
      REDIS_CON: redis://tubearchivist-redis:6379
      TA_HOST: ${TA_HOST}
      # The admin account, created on the first start.
      TA_USERNAME: ${TA_USERNAME}
      TA_PASSWORD: ${TA_PASSWORD}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      TZ: ${TIMEZONE:-Etc/UTC}
    volumes:
      - tubearchivist-media:/youtube
      - tubearchivist-cache:/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  tubearchivist-redis:
    image: redis:8.6.8-alpine
    restart: unless-stopped
    volumes:
      - tubearchivist-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The official compose file names the upstream Elasticsearch image as the
  # alternative to bbilly1/tubearchivist-es (amd64 only); this one also runs on
  # arm64. Single-node mode skips Elasticsearch's production bootstrap checks,
  # so the server's vm.max_map_count does not have to be raised.
  tubearchivist-es:
    image: elasticsearch:9.5.5
    restart: unless-stopped
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      xpack.security.enabled: "true"
      discovery.type: single-node
      path.repo: /usr/share/elasticsearch/data/snapshot
    volumes:
      - tubearchivist-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u \"elastic:$$ELASTIC_PASSWORD\" 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  tubearchivist-media:
  tubearchivist-cache:
  tubearchivist-redis-data:
  tubearchivist-es-data:
