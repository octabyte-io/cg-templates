name: Steedos
description: "Self-hosted Steedos is an open-source low-code platform for building business apps with custom objects, approval processes and Salesforce-style permissions."
version: "3.0.14"
tags: [low-code platform, salesforce alternative, crm, business apps, workflow]
links:
  website: https://www.steedos.com
  docs: https://docs.steedos.com/
  source: https://github.com/steedos/steedos-platform
cloudgate: 0.1.0
compose: app
size: large
inputs:
  ROOT_URL: { value: "{{domains.steedos.url}}" }
domains:
  - { service: steedos, port: 80 }
