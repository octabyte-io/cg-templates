services:
  tooljet:
    # Community Edition image. It runs the API server and serves the web
    # editor, and starts its own Redis inside the container (loopback only).
    # On every start it creates or migrates its databases before listening.
    image: tooljet/tooljet-ce:v3.21.96-lts
    restart: unless-stopped
    command: npm run start:prod
    depends_on:
      tooljet-db:
        condition: service_healthy
    environment:
      SERVE_CLIENT: "true"
      PORT: "80"
      # Default is "::", which fails on hosts with IPv6 turned off in Docker.
      LISTEN_ADDR: 0.0.0.0
      TOOLJET_HOST: ${TOOLJET_HOST}
      LOCKBOX_MASTER_KEY: ${LOCKBOX_MASTER_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      # The app's own data: apps, users, encrypted data source credentials.
      PG_HOST: tooljet-db
      PG_PORT: "5432"
      PG_USER: tooljet
      PG_PASS: ${PG_PASS}
      PG_DB: tooljet_production
      # ToolJet Database (the built-in tables), reached through PostgREST.
      TOOLJET_DB: tooljet_db
      TOOLJET_DB_HOST: tooljet-db
      TOOLJET_DB_PORT: "5432"
      TOOLJET_DB_USER: tooljet
      TOOLJET_DB_PASS: ${PG_PASS}
      PGRST_HOST: tooljet-postgrest:3000
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_DB_PRE_CONFIG: postgrest.pre_config
      DEPLOYMENT_PLATFORM: docker
      CHECK_FOR_UPDATES: "true"
      USER_SESSION_EXPIRY: "2880"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s

  # Serves ToolJet Database tables to the app. ToolJet creates tooljet_db
  # on its first start; PostgREST retries until it exists.
  tooljet-postgrest:
    image: postgrest/postgrest:v12.2.0
    restart: unless-stopped
    depends_on:
      tooljet-db:
        condition: service_healthy
    environment:
      PGRST_SERVER_PORT: "3000"
      PGRST_DB_URI: postgres://tooljet:${PG_PASS}@tooljet-db:5432/tooljet_db
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_DB_PRE_CONFIG: postgrest.pre_config

  tooljet-db:
    image: postgres:16.16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tooljet
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_DB: tooljet_production
    volumes:
      - tooljet-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tooljet -d tooljet_production"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  tooljet-db-data:
