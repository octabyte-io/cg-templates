name: ILIAS
description: "Self-hosted ILIAS is an open-source LMS for courses, online tests and e-exams, learning progress and certificates, for schools, universities and staff training."
version: "11.5"
tags: [learning management system, open source lms, canvas alternative, blackboard alternative, talentlms alternative, e-learning, online exams]
links:
  website: https://www.ilias.de/en/
  docs: https://docu.ilias.de
  source: https://github.com/ILIAS-eLearning/ILIAS
cloudgate: 0.1.0
compose: app
# The project asks for at least 4 GB of memory.
size: large
inputs:
  ILIAS_HTTP_PATH: { value: "{{domains.ilias.url}}" }
  DB_PASSWORD: { generate: password }
  DB_ROOT_PASSWORD: { generate: password }
  ADMIN_PASSWORD: { generate: password }
domains:
  - { service: ilias, port: 80 }
