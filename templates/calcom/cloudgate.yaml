version: 1
services:
  app:
    kind: web
    description: The Cal.com booking pages, dashboard and API.
    source: { image: "calcom/cal.com:v6.2.0" }
    port: 3000
    size: medium
    env:
      - DATABASE_URL: db.url
      - DATABASE_DIRECT_URL: db.url
      - REDIS_URL: cache.url
      - NEXT_PUBLIC_WEBAPP_URL
      - NEXTAUTH_URL
      - NEXTAUTH_SECRET
      - CALENDSO_ENCRYPTION_KEY
      - CALCOM_TELEMETRY_DISABLED
  db:
    kind: postgres
    version: "16"
    database: calcom
  cache:
    kind: redis
    version: "7"
