name: Bludit
description: "Self-hosted Bludit is a free flat-file CMS: build a simple website or blog in a visual editor, with themes, plugins and no database."
version: "3.20.0"
tags: [flat-file cms, squarespace alternative, wix alternative, self-hosted cms, blog platform, no database cms, website builder]
links:
  website: https://www.bludit.com
  docs: https://docs.bludit.com
  source: https://github.com/bludit/bludit
cloudgate: "0.3.11"
compose: app
size: xsmall
signIn:
  firstVisit:
    path: /install.php
    note: "Choose a language and set the password for the user named admin."
domains:
  - { service: bludit, port: 80 }
files:
  - { path: bludit-nginx.conf }
