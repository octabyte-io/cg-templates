# Bludit's own nginx site config (github.com/bludit/docker, conf/default.conf), with one
# addition: PHP sees HTTPS=on when the proxy in front says the visitor used HTTPS.
map $http_x_forwarded_proto $bludit_https {
    default "";
    https on;
}

server {
    listen 0.0.0.0:80;

    root /usr/share/nginx/html;

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi.conf;
        fastcgi_param HTTPS $bludit_https if_not_empty;
    }

    # Cache static files (Browser Cache Control Directives)
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|eot|ttf|woff|woff2|otf)$ {
        access_log off;
        log_not_found off;
        expires 30d;
    }

    # Route to index.php
    location / {
        try_files $uri $uri/ /index.php?$args;
    }
}
