services:
  bludit:
    # Bludit's official image (github.com/bludit/docker): nginx and PHP-FPM in one container.
    # 3.20.0 is the newest image tag; it is built for amd64 only.
    image: bludit/docker:3.20.0
    restart: unless-stopped
    volumes:
      # Bludit is flat-file: pages, uploads, users and settings live in bl-content. No database.
      - bludit-content:/usr/share/nginx/html/bl-content
      # Themes and plugins installed from the admin panel. Empty volumes are filled
      # with the bundled ones on first start.
      - bludit-themes:/usr/share/nginx/html/bl-themes
      - bludit-plugins:/usr/share/nginx/html/bl-plugins
      # The image's own site config, plus telling PHP when the visitor came over HTTPS,
      # so the installer saves an https:// site address behind Cloudgate's proxy.
      - ../files/bludit-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  bludit-content:
  bludit-themes:
  bludit-plugins:
