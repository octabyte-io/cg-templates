services:
  nodebb:
    image: ghcr.io/nodebb/nodebb:4.16.8
    restart: unless-stopped
    depends_on:
      nodebb-db:
        condition: service_healthy
    environment:
      # With no config.json yet, the image runs "nodebb setup" instead of the web
      # installer: it reads the NODEBB_* values below, writes /opt/config/config.json,
      # creates the admin account and exits. The container then restarts and
      # starts the forum. Once config.json exists these values are not read again.
      NODEBB_INIT_VERB: setup
      NODEBB_URL: ${NODEBB_URL}
      NODEBB_PORT: "4567"
      NODEBB_ADMIN_USERNAME: ${ADMIN_USERNAME}
      NODEBB_ADMIN_EMAIL: ${ADMIN_EMAIL}
      NODEBB_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NODEBB_DB: postgres
      NODEBB_DB_HOST: nodebb-db
      NODEBB_DB_PORT: "5432"
      NODEBB_DB_USER: nodebb
      NODEBB_DB_PASSWORD: ${POSTGRES_PASSWORD}
      NODEBB_DB_NAME: nodebb
    volumes:
      - nodebb-build:/usr/src/app/build
      - nodebb-uploads:/usr/src/app/public/uploads
      - nodebb-config:/opt/config

  nodebb-db:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nodebb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nodebb
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/<major>.
      - nodebb-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodebb -d nodebb"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  nodebb-build:
  nodebb-uploads:
  nodebb-config:
  nodebb-db-data:
