# From Fider's "Hosting on Docker" guide (docs.fider.io/hosting-instance),
# with the SMTP group enabled. The image has its own healthcheck (fider ping).
services:
  fider:
    image: getfider/fider:v0.39.0
    restart: unless-stopped
    depends_on:
      fider-db:
        condition: service_healthy
    environment:
      BASE_URL: ${BASE_URL}
      DATABASE_URL: postgres://fider:${POSTGRES_PASSWORD}@fider-db:5432/fider?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_NOREPLY: ${EMAIL_NOREPLY}
      EMAIL: smtp
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}
      EMAIL_SMTP_ENABLE_IMPLICIT_TLS: ${EMAIL_SMTP_ENABLE_IMPLICIT_TLS:-false}

  fider-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fider
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fider
    volumes:
      - fider-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fider"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  fider-db-data:
