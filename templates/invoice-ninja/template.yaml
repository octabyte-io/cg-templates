name: Invoice Ninja
description: "Invoice Ninja is self-hosted invoicing with quotes, online payments, time tracking and a client portal."
version: "5.14.0"
tags: [invoicing software, freshbooks alternative, self-hosted invoicing, online payments, recurring invoices, client portal, time tracking]
links:
  website: https://invoiceninja.com
  docs: https://invoiceninja.github.io
  source: https://github.com/invoiceninja/invoiceninja
cloudgate: "0.3.11"
compose: app
# PHP, the queue workers, Chrome for PDFs and MySQL together need about 2 GB of memory.
size: medium
inputs:
  APP_URL: { value: "{{domains.invoice-ninja-web.url}}" }
  # Laravel's APP_KEY (32 random bytes, base64); the compose file adds the "base64:" prefix.
  # It encrypts stored secrets such as payment gateway keys, so it never changes.
  APP_KEY: { generate: base64 }
  DB_PASSWORD: { generate: password }
  DB_ROOT_PASSWORD: { generate: password }
  ADMIN_PASSWORD: { generate: password }
  ADMIN_EMAIL:
    ask:
      label: Admin email
      description: You sign in to Invoice Ninja with this email. Cloudgate creates a strong password for it, shown afterwards on the app's variables page.
      format: email
signIn:
  username: ADMIN_EMAIL
  password: ADMIN_PASSWORD
  path: /
domains:
  - { service: invoice-ninja-web, port: 80 }
files:
  - { path: laravel.conf }
  - { path: invoiceninja.conf }
