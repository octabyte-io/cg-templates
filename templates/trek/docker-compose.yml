services:
  trek:
    image: mauriceboe/trek:5.1.4
    restart: unless-stopped
    # Hardening from the official docker-compose.yml.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - KILL
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Encrypts stored secrets (API keys, SMTP and OIDC settings) at rest.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TZ: UTC
      LOG_LEVEL: info
      # Base address for links in email notifications, and the allowed origin.
      APP_URL: ${APP_URL}
      ALLOWED_ORIGINS: ${APP_URL}
      # First-run admin account; only used while the database has no users.
      # TREK asks for a new password at the first sign-in.
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - trek-data:/app/data
      - trek-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  trek-data:
  trek-uploads:
