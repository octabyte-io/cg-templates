name: Redash
description: "Self-hosted Redash: write SQL queries on your own databases, turn the results into shared dashboards and get alerts in Slack or Teams."
version: "26.9.0"
tags: [sql editor, sql dashboards, looker alternative, open source bi, sql alerts, data visualization]
links:
  website: https://redash.io
  docs: https://redash.io/help/
  source: https://github.com/getredash/redash
cloudgate: "0.3.11"
compose: app
size: medium
inputs:
  REDASH_HOST: { value: "{{domains.redash.url}}" }
  REDASH_COOKIE_SECRET: { generate: hex }
  REDASH_SECRET_KEY: { generate: hex }
  DB_PASSWORD: { generate: password }
signIn:
  firstVisit:
    path: /setup
    note: "Fill in the setup form to create the admin account and your organization."
domains:
  - { service: redash, port: 5000 }
