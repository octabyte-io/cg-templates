name: Kept
description: "Kept is a self-hosted inventory app for homes and small teams: where things are, QR labels, low stock, lending and offline phone use."
version: "1.14.7"
tags: [home inventory, sortly alternative, inventory app, qr code labels, stock tracking, homebox alternative]
links:
  website: https://keptinventory.info
  docs: https://keptinventory.info/install/compose/
  source: https://github.com/keptinventory/kept
cloudgate: "0.3.11"
compose: app
size: small
inputs:
  KEPT_PUBLIC_URL: { value: "{{domains.kept.url}}" }
  KEPT_DB_SUPERUSER_PASSWORD: { generate: hex }
  KEPT_DB_OWNER_PASSWORD: { generate: hex }
  KEPT_DB_APP_PASSWORD: { generate: hex }
  KEPT_DB_AUTH_PASSWORD: { generate: hex }
  KEPT_DB_SYSTEM_PASSWORD: { generate: hex }
signIn:
  firstVisit:
    path: /
    note: "Enter the one-time setup code from the app's logs and create your account; it becomes the admin."
domains:
  - { service: kept, port: 8080 }
