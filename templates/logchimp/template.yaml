name: LogChimp
description: "Self-hosted LogChimp collects customer feedback on public boards, lets people vote on ideas, and shares your product roadmap. A Canny alternative."
version: "0.9.4"
tags: [feedback board, feature requests, product roadmap, customer feedback, canny alternative]
links:
  website: https://logchimp.app
  docs: https://docs.logchimp.app/self-hosting/docker
  source: https://github.com/logchimp/logchimp
cloudgate: 0.1.0
compose: app
size: small
inputs:
  # The two public addresses: the web app people open, and the API the web app calls
  # from the browser. The web URL is also used in the links of emails LogChimp sends.
  LOGCHIMP_WEB_URL: { value: "{{domains.logchimp.url}}" }
  LOGCHIMP_API_URL: { value: "{{domains.logchimp-api.url}}" }
  # Signs sign-in and email tokens; LogChimp asks for a hex string. Changing it signs everyone out.
  LOGCHIMP_SECRET_KEY: { generate: hex }
  # This install's own id, used for licensing.
  LOGCHIMP_MACHINE_SIGNATURE: { generate: uuid }
  POSTGRES_PASSWORD: { generate: password }
  LOGCHIMP_MAIL_HOST:
    ask:
      label: Email server (SMTP host)
      description: Optional. Used for email verification and password-reset emails. LogChimp starts and works without it; you can add it later on the app's variables page.
      required: false
  LOGCHIMP_MAIL_PORT:
    ask:
      label: Email server port
      description: Usually 587, or 465 for SSL.
      default: "587"
      format: number
      required: false
  LOGCHIMP_MAIL_USER:
    ask:
      label: Email server username
      required: false
  LOGCHIMP_MAIL_PASSWORD:
    ask:
      label: Email server password
      secret: true
      required: false
# Two addresses, as in LogChimp's official Docker setup: the web app (theme) and its API.
domains:
  # The web app: feedback boards, roadmaps and the admin dashboard.
  - { service: logchimp, port: 3000 }
  # The API, which the web app calls from the visitor's browser.
  - { service: logchimp-api, port: 8000 }
