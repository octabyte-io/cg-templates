name: Forgejo
description: "Self-hosted Forgejo: a free, community-run Git server for your team's code, pull requests and reviews, issues, wikis and packages."
version: "17.0.2"
tags: [git server, code hosting, github alternative, gitea alternative, gitlab alternative, bitbucket alternative, code review]
links:
  website: https://forgejo.org
  docs: https://forgejo.org/docs/latest/
  source: https://codeberg.org/forgejo/forgejo
cloudgate: "0.3.11"
compose: app
size: small
inputs:
  ROOT_URL: { value: "{{domains.forgejo.url}}/" }
  DB_PASSWORD: { generate: password }
  SECRET_KEY: { generate: hex }
  DISABLE_REGISTRATION:
    ask:
      label: Turn off open sign-up
      description: >-
        Leave this "false" for now: the first account registered becomes the
        admin. Once your team has accounts, change it to "true" in this app's
        variables and redeploy, so only the admin can add people. "true" at
        setup leaves nobody able to register, not even the admin.
      default: "false"
      pattern: "true|false"
signIn:
  firstVisit:
    path: /user/sign_up
    note: "Register an account; the first account registered becomes the admin."
domains:
  - { service: forgejo, port: 3000 }
