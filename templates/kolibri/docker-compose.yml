services:
  # Learning Equality's official image. Kolibri keeps everything (its SQLite
  # database, imported channels and settings) in /kolibri, which must be a volume.
  kolibri:
    image: learningequality/kolibri:0.19.5
    restart: unless-stopped
    environment:
      KOLIBRI_HTTP_PORT: 8080
      KOLIBRI_ZIP_CONTENT_PORT: 8081
      # Interactive content (exercises, HTML5 apps, H5P) is served from a second
      # address so it runs sandboxed, apart from the learner's session. Kolibri
      # serves it on port 8081; this tells the pages where to find it.
      KOLIBRI_ZIP_CONTENT_ORIGIN: ${ZIP_CONTENT_ORIGIN}
    volumes:
      - kolibri-data:/kolibri
    # The image has no curl or wget, so the check uses its Python.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/public/info/', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 2m

  # The second address. It forwards port 8081 of the kolibri container unchanged,
  # so the content address has a service of its own.
  kolibri-zipcontent:
    image: learningequality/kolibri:0.19.5
    restart: unless-stopped
    depends_on:
      kolibri:
        condition: service_started
    entrypoint:
      - python
      - -c
      - |
        import asyncio
        async def pipe(reader, writer):
            try:
                while data := await reader.read(65536):
                    writer.write(data)
                    await writer.drain()
            except Exception:
                pass
            finally:
                writer.close()
        async def handle(client_reader, client_writer):
            try:
                app_reader, app_writer = await asyncio.open_connection('kolibri', 8081)
            except Exception:
                client_writer.close()
                return
            await asyncio.gather(pipe(client_reader, app_writer), pipe(app_reader, client_writer))
        async def main():
            server = await asyncio.start_server(handle, '0.0.0.0', 8081)
            async with server:
                await server.serve_forever()
        asyncio.run(main())

volumes:
  kolibri-data:
