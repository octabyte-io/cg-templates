services:
  serpbear:
    image: towfiqi/serpbear:3.1.2
    restart: unless-stopped
    environment:
      USER_NAME: ${ADMIN_USER}
      PASSWORD: ${ADMIN_PASSWORD}
      SECRET: ${SECRET}
      APIKEY: ${APIKEY}
      SESSION_DURATION: "24"
      NEXT_PUBLIC_APP_URL: ${APP_URL}
    volumes:
      # The SQLite database and settings (including the scraper API key).
      - serpbear-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  serpbear-data:
