# Based on the official docker-compose.yml in getlago/lago at tag v1.57.0.
x-backend-image: &backend-image
  image: getlago/api:v1.57.0

x-backend-environment: &backend-env
  DATABASE_URL: postgresql://lago:${POSTGRES_PASSWORD}@lago-db:5432/lago?search_path=public
  REDIS_URL: redis://lago-redis:6379
  LAGO_REDIS_CACHE_URL: redis://lago-redis:6379
  SECRET_KEY_BASE: ${SECRET_KEY_BASE}
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "true"
  LAGO_API_URL: ${LAGO_API_URL}
  LAGO_FRONT_URL: ${LAGO_FRONT_URL}
  LAGO_ENCRYPTION_PRIMARY_KEY: ${LAGO_ENCRYPTION_PRIMARY_KEY}
  LAGO_ENCRYPTION_DETERMINISTIC_KEY: ${LAGO_ENCRYPTION_DETERMINISTIC_KEY}
  LAGO_ENCRYPTION_KEY_DERIVATION_SALT: ${LAGO_ENCRYPTION_KEY_DERIVATION_SALT}
  # The Sidekiq dashboard has no sign-in of its own, so it stays off on a public address.
  LAGO_SIDEKIQ_WEB: "false"
  LAGO_USE_AWS_S3: "false"
  LAGO_USE_GCS: "false"
  LAGO_PDF_URL: http://lago-pdf:3000
  LAGO_DISABLE_PDF_GENERATION: "false"
  LAGO_DISABLE_SEGMENT: "true"
  LAGO_DISABLE_SIGNUP: "true"
  LAGO_WEBHOOK_ALLOW_PRIVATE_URLS: "false"
  LAGO_OAUTH_PROXY_URL: https://proxy.getlago.com
  LAGO_FROM_EMAIL: ${LAGO_FROM_EMAIL:-}
  LAGO_SMTP_ADDRESS: ${LAGO_SMTP_ADDRESS:-}
  LAGO_SMTP_PORT: ${LAGO_SMTP_PORT:-587}
  LAGO_SMTP_USERNAME: ${LAGO_SMTP_USERNAME:-}
  LAGO_SMTP_PASSWORD: ${LAGO_SMTP_PASSWORD:-}

services:
  lago-front:
    image: getlago/front:v1.57.0
    restart: unless-stopped
    # nginx runs as uid 65532 on a read-only root filesystem and writes only to /tmp.
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ../files/front-default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      lago-api:
        condition: service_healthy
    environment:
      API_URL: ${LAGO_API_URL}
      APP_ENV: production
      LAGO_OAUTH_PROXY_URL: https://proxy.getlago.com
      LAGO_DISABLE_PDF_GENERATION: "false"
      LAGO_DISABLE_SIGNUP: "true"

  lago-api:
    <<: *backend-image
    restart: unless-stopped
    # The official start script binds to "::", which fails on servers without IPv6.
    command: [bash, -c, "rm -f ./tmp/pids/server.pid && exec bundle exec rails s -b 0.0.0.0 -p 3000"]
    depends_on:
      lago-migrate:
        condition: service_completed_successfully
      lago-db:
        condition: service_healthy
      lago-redis:
        condition: service_healthy
    environment:
      <<: *backend-env
    healthcheck:
      test: curl -f http://localhost:3000/health || exit 1
      interval: 10s
      start_period: 60s
      timeout: 60s
      retries: 10
    volumes:
      - lago-keys:/app/config/keys:ro
      - lago-storage:/app/storage

  lago-worker:
    <<: *backend-image
    restart: unless-stopped
    command: ["./scripts/start.worker.sh"]
    depends_on:
      lago-migrate:
        condition: service_completed_successfully
      lago-db:
        condition: service_healthy
      lago-redis:
        condition: service_healthy
    environment:
      <<: *backend-env
    healthcheck:
      test: curl -f http://localhost:8080 || exit 1
      interval: 10s
      start_period: 60s
      timeout: 60s
      retries: 10
    volumes:
      - lago-keys:/app/config/keys:ro
      - lago-storage:/app/storage

  lago-clock:
    <<: *backend-image
    restart: unless-stopped
    command: ["./scripts/start.clock.sh"]
    depends_on:
      lago-migrate:
        condition: service_completed_successfully
      lago-db:
        condition: service_healthy
      lago-redis:
        condition: service_healthy
    environment:
      <<: *backend-env
    volumes:
      - lago-keys:/app/config/keys:ro

  # Runs at each start: creates and upgrades the database tables. On the first start only, it
  # also creates the organization and its admin account (later starts skip that step, so
  # renaming the organization in Lago never makes a second one).
  lago-migrate:
    <<: *backend-image
    restart: "no"
    depends_on:
      lago-keygen:
        condition: service_completed_successfully
      lago-db:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        set -e
        if [ -f /app/config/keys/.organization-created ]; then
          export LAGO_CREATE_ORG=false
        else
          export LAGO_CREATE_ORG=true
        fi
        ./scripts/migrate.sh
        touch /app/config/keys/.organization-created
    environment:
      <<: *backend-env
      LAGO_ORG_USER_EMAIL: ${LAGO_ORG_USER_EMAIL}
      LAGO_ORG_USER_PASSWORD: ${LAGO_ORG_USER_PASSWORD}
      LAGO_ORG_NAME: ${LAGO_ORG_NAME}
    volumes:
      - lago-keys:/app/config/keys

  # Lago signs its sign-in tokens with an RSA key (the official setup passes one as
  # LAGO_RSA_PRIVATE_KEY). This makes a 2048-bit key once, on this server, and keeps it in a
  # volume, where the API reads it as config/keys/private.pem.
  lago-keygen:
    <<: *backend-image
    restart: "no"
    user: "0"
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -s /app/config/keys/private.pem ]; then
          ruby -ropenssl -e 'File.write("/app/config/keys/private.pem", OpenSSL::PKey::RSA.new(2048).to_pem)'
        fi
        chown -R 65532:65532 /app/config/keys
        chmod 700 /app/config/keys
        chmod 600 /app/config/keys/private.pem
    volumes:
      - lago-keys:/app/config/keys

  # Makes the invoice PDFs.
  lago-pdf:
    image: ghcr.io/getlago/lago-gotenberg:8.39
    restart: unless-stopped

  lago-db:
    image: getlago/postgres-partman:15.0-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lago
      POSTGRES_USER: lago
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /data/postgres
      POSTGRES_SCHEMA: public
    volumes:
      - lago-db-data:/data/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lago -d lago -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  lago-redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    volumes:
      - lago-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  lago-keys:
  lago-storage:
  lago-db-data:
  lago-redis-data:
