# Radicale's settings (mounted read-only as /etc/radicale/config).
# The full list of settings: https://radicale.org/v3.html#configuration

[server]
# Cloudgate's proxy in front of Radicale adds HTTPS and the web address.
hosts = 0.0.0.0:5232

[auth]
# Users and their passwords (bcrypt) are in this file on the data volume.
# The container's start step writes the user from template.yaml there;
# more users can be added with: htpasswd -B /var/lib/radicale/users <name>
type = htpasswd
htpasswd_filename = /var/lib/radicale/users
htpasswd_encryption = bcrypt
# Slow down password guessing.
delay = 1

[rights]
# Every user sees only their own calendars and address books.
type = owner_only

[storage]
filesystem_folder = /var/lib/radicale/collections

[web]
type = internal
