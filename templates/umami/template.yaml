name: Umami
description: "Self-hosted Umami: open-source, cookie-free website analytics and a light Google Analytics alternative. Track many sites from one simple dashboard."
version: "3.4.1"
tags: [web analytics, google analytics alternative, privacy, cookieless analytics, gdpr, website statistics]
links:
  website: https://umami.is
  docs: https://umami.is/docs
  source: https://github.com/umami-software/umami
cloudgate: 0.1.0
compose: app
size: small
inputs:
  DB_PASSWORD: { generate: password }
  APP_SECRET: { generate: hex }
  TWO_FACTOR_ENCRYPTION_KEY: { generate: hex }
domains:
  - { service: umami, port: 3000 }
