name: OpenProject
description: "Self-hosted OpenProject plans projects with Gantt charts, agile boards and time tracking, in place of Microsoft Project or Jira."
version: "17.9.7"
tags: [openproject, microsoft project alternative, jira alternative, open source project management, gantt chart software, agile boards, time tracking]
links:
  website: https://www.openproject.org
  docs: https://www.openproject.org/docs/installation-and-operations/installation/docker-compose/
  source: https://github.com/opf/openproject
cloudgate: "0.3.11"
compose: app
# OpenProject's system requirements ask for 4 GB of memory; the stack runs web,
# worker, cron, a collaboration server, memcached and PostgreSQL.
size: large
inputs:
  OPENPROJECT_HOST__NAME: { value: "{{domains.proxy.host}}" }
  SECRET_KEY_BASE: { generate: hex }
  COLLABORATIVE_SERVER_SECRET: { generate: hex }
  POSTGRES_PASSWORD: { generate: password }
signIn:
  firstVisit:
    path: /login
    note: "Sign in as admin with the password admin, then set a new password when asked."
# OpenProject's own proxy routes /hocuspocus to the collaboration server and
# everything else to the web container, so it is the service that gets the address.
domains:
  - { service: proxy, port: 80 }
files:
  - { path: Caddyfile }
