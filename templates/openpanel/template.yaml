name: OpenPanel
description: "Self-hosted OpenPanel: open-source product analytics and website stats with events, funnels, retention and user profiles, without cookies."
version: "2.3.0"
tags: [mixpanel alternative, amplitude alternative, product analytics, web analytics, cookieless analytics, google analytics alternative]
links:
  website: https://openpanel.dev
  docs: https://openpanel.dev/docs/self-hosting/self-hosting
  source: https://github.com/Openpanel-dev/openpanel
cloudgate: 0.1.0
compose: app
size: large
inputs:
  DASHBOARD_URL: { value: "{{domains.openpanel-proxy.url}}" }
  COOKIE_SECRET: { generate: hex }
  DB_PASSWORD: { generate: password }
signIn:
  firstVisit:
    path: /
    note: "Create your account; the first account made is the owner, and sign-up then closes."
domains:
  - { service: openpanel-proxy, port: 80 }
files:
  - { path: caddy/Caddyfile }
  - { path: clickhouse/clickhouse-config.xml }
  - { path: clickhouse/clickhouse-user-config.xml }
  - { path: clickhouse/init-db.sql }
