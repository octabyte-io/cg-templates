services:
  # Plik, set up with environment variables (PLIKD_<SETTING>) instead of a
  # plikd.cfg file. Files and the SQLite database live in the plik-data volume.
  plik:
    image: rootgg/plik:1.4.3
    restart: unless-stopped
    depends_on:
      plik-permissions:
        condition: service_completed_successfully
    environment:
      PLIKD_PLIK_DOMAIN: ${PLIK_URL}
      # Cloudgate's proxy sits in front: log the visitor's real address.
      PLIKD_SOURCE_IP_HEADER: X-Forwarded-For
      # Uploading needs an account ("forced"); anyone with a link can still
      # download. Without this the server is an open upload service.
      PLIKD_FEATURE_AUTHENTICATION: forced
      # Made once on the first start; the admin adds other users in the web UI.
      PLIKD_DEFAULT_ADMIN_LOGIN: admin
      PLIKD_DEFAULT_ADMIN_PASSWORD: ${PLIK_ADMIN_PASSWORD}
      # Keep uploaded files and the metadata database in the volume.
      PLIKD_DATA_BACKEND: file
      PLIKD_DATA_BACKEND_CONFIG: '{"Directory":"/data/files"}'
      PLIKD_METADATA_BACKEND_CONFIG: '{"Driver":"sqlite3","ConnectionString":"/data/plik.db"}'
    volumes:
      - plik-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Runs once at each start: a new volume is owned by root, and Plik runs as the
  # image's user plik (1000:1000), so this hands the data folder to it.
  plik-permissions:
    image: rootgg/plik:1.4.3
    restart: "no"
    user: "0:0"
    entrypoint: ["chown", "1000:1000", "/data"]
    volumes:
      - plik-data:/data

volumes:
  plik-data:
