name: Baserow
description: "Spreadsheet-style databases for lists, projects and inventories."
version: "2.4.2"
tags: [database, spreadsheet, no-code]
links:
  website: https://baserow.io
  docs: https://baserow.io/docs/installation/install-with-docker
  source: https://github.com/baserow/baserow
cloudgate: 0.1.0
compose: app
size: medium
inputs:
  PUBLIC_URL: { value: "{{domains.baserow.url}}" }
domains:
  - { service: baserow, port: 80 }
