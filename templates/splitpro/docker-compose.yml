# From SplitPro's production compose file (docker/prod/compose.yml at v2.1.6),
# with email sign-in (SMTP) as the login method. The Postgres image is the
# project's own build with pg_cron, which recurring expenses need. The app
# runs its database migrations when it starts.
services:
  splitpro:
    image: ossapps/splitpro:v2.1.6
    restart: unless-stopped
    depends_on:
      splitpro-db:
        condition: service_healthy
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://splitpro:${POSTGRES_PASSWORD}@splitpro-db:5432/splitpro
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_URL_INTERNAL: http://localhost:3000
      ENABLE_SENDING_INVITES: "true"
      DISABLE_EMAIL_SIGNUP: "false"
      FROM_EMAIL: ${FROM_EMAIL}
      EMAIL_SERVER_HOST: ${EMAIL_SERVER_HOST}
      EMAIL_SERVER_PORT: ${EMAIL_SERVER_PORT}
      EMAIL_SERVER_USER: ${EMAIL_SERVER_USER}
      EMAIL_SERVER_PASSWORD: ${EMAIL_SERVER_PASSWORD}
    volumes:
      - splitpro-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/healthz"]
      # Database migrations run on first start, so allow a slow first boot.
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s

  splitpro-db:
    image: ossapps/postgres:17.7-trixie
    restart: unless-stopped
    command: postgres -c shared_preload_libraries=pg_cron -c cron.database_name=splitpro -c cron.timezone=UTC
    environment:
      POSTGRES_USER: splitpro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: splitpro
    volumes:
      - splitpro-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitpro -d splitpro"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  splitpro-uploads:
  splitpro-db-data:
