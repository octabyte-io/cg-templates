name: Grimmory
description: "Grimmory is a self-hosted library for e-books, comics and audiobooks, with browser reading, Kobo and KOReader sync and send-to-Kindle."
version: "v3.5.0"
tags:
  - kindle alternative
  - ebook library
  - booklore fork
  - kobo sync
  - audiobook player
  - opds server
links:
  website: https://grimmory.org
  docs: https://grimmory.org/docs/getting-started
  source: https://github.com/grimmory-tools/grimmory
cloudgate: "0.3.11"
compose: app
# Grimmory's docs: 2 GB RAM minimum, 4 GB+ recommended (Java app plus MariaDB).
size: medium
inputs:
  DB_PASSWORD: { generate: password }
  DB_ROOT_PASSWORD: { generate: password }
  TIMEZONE:
    ask:
      label: Time zone
      description: Used for reading statistics and scheduled tasks, as an IANA name such as Europe/Berlin.
      default: Etc/UTC
      required: false
signIn:
  firstVisit:
    path: /
    note: "Create the admin account with a username, email and password. Keep the password safe; there is no password reset."
domains:
  - { service: grimmory, port: 6060 }
