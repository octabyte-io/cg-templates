name: NoteDiscovery
description: "NoteDiscovery is a self-hosted Markdown notes app with wikilinks, backlinks, a graph view and fast search, kept as plain files on your server."
version: "0.34.1"
tags:
  - obsidian alternative
  - markdown notes
  - personal knowledge base
  - note taking app
  - evernote alternative
  - wiki links
links:
  website: https://www.notediscovery.com
  docs: https://github.com/gamosoft/NoteDiscovery/tree/main/documentation
  source: https://github.com/gamosoft/NoteDiscovery
cloudgate: 0.1.0
compose: app
size: xsmall
inputs:
  # NoteDiscovery has a single login: one password, no user name. Cloudgate
  # creates it; it is shown afterwards on the app's variables page.
  LOGIN_PASSWORD: { generate: password }
  SESSION_SECRET: { generate: hex }
  APP_URL: { value: "{{domains.notediscovery.url}}" }
signIn:
  password: LOGIN_PASSWORD
domains:
  - { service: notediscovery, port: 8000 }
