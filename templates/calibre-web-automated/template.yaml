name: Calibre-Web Automated
description: "Calibre-Web Automated is a self-hosted e-book library, built on Calibre-Web, that converts and fixes the books you add for any e-reader."
version: "v4.0.8"
tags: [calibre-web automated, self-hosted ebook library, calibre-web alternative, automatic ebook conversion, kindle alternative, send to kindle, kobo sync]
links:
  website: https://github.com/crocodilestick/Calibre-Web-Automated
  docs: https://github.com/crocodilestick/Calibre-Web-Automated/wiki
  source: https://github.com/crocodilestick/Calibre-Web-Automated
cloudgate: 0.1.0
compose: app
size: medium
inputs:
  # Replaces the default password (admin123) of the account "admin" on the first start.
  ADMIN_PASSWORD: { generate: password }
  TIMEZONE:
    ask:
      label: Time zone
      description: Used for dates and times in Calibre-Web Automated, as an IANA name such as Europe/Berlin.
      default: Etc/UTC
      required: false
domains:
  - { service: calibre-web-automated, port: 8083 }
files:
  - { path: cwa-setup.py.txt }
