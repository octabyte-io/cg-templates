# From the project's compose.prod.yml + compose.sqlite.yml (the SQLite setup its
# docs recommend for a single site).
services:
  instatic:
    image: ghcr.io/corebunch/instatic:0.0.21
    restart: unless-stopped
    environment:
      PORT: "3001"
      DATABASE_URL: sqlite:/app/data/cms.db
      UPLOADS_DIR: /app/uploads
      STATIC_DIR: /app/dist
      # Encrypts AI provider keys, plugin secrets and two-factor seeds (32 bytes, base64).
      INSTATIC_SECRET_KEY: ${INSTATIC_SECRET_KEY}
      # The public address, for the CSRF origin check behind Cloudgate's proxy.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
    volumes:
      - instatic-data:/app/data
      - instatic-uploads:/app/uploads
    healthcheck:
      # The image has neither curl nor wget; the project ships this Bun script.
      test: ["CMD", "bun", "run", "server/healthcheck.ts"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  instatic-data:
  instatic-uploads:
