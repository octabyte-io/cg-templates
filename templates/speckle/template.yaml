name: Speckle
description: "Speckle is a self-hosted 3D model hub for AEC teams: publish from Revit, Rhino and more, then view, compare and discuss models in a browser."
version: "2.31.14"
tags:
  - autodesk construction cloud alternative
  - bim collaboration
  - 3d model viewer
  - ifc viewer
  - revit model sharing
  - aec data platform
links:
  website: https://speckle.systems
  docs: https://docs.speckle.systems/developers/server/getting-started
  source: https://github.com/specklesystems/speckle-server
cloudgate: "0.3.11"
compose: app
# Speckle's docs ask for at least 4 GB of memory; the preview service alone can use up to 3 GB.
size: large
inputs:
  APP_URL: { value: "{{domains.speckle-ingress.url}}" }
  SESSION_SECRET: { generate: hex }
  POSTGRES_PASSWORD: { generate: password }
  GARAGE_RPC_SECRET: { generate: hex }
  S3_ACCESS_KEY: { generate: hex }
  S3_SECRET_KEY: { generate: hex }
signIn:
  firstVisit:
    path: /authn/register
    note: "Register the first account; the first account made is the server admin."
# Speckle's own ingress sends the API paths to the server and the rest to the frontend.
domains:
  - { service: speckle-ingress, port: 8080 }
files:
  - { path: garage.toml }
