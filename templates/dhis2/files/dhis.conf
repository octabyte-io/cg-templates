# dhis.conf: DHIS2's server settings. Values in ${...} come from the app
# container's environment (see docker-compose.yml).
connection.dialect = org.hibernate.dialect.PostgreSQLDialect
connection.driver_class = org.postgresql.Driver
connection.url = jdbc:postgresql://dhis2-db/dhis
connection.username = dhis
connection.password = ${DHIS2_DB_PASSWORD}

# The app's public address, used in links DHIS2 writes into emails and exports.
server.base.url = ${DHIS2_BASE_URL}

system.audit.enabled = off
