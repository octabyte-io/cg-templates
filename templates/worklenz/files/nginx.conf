# Routes Worklenz's one web address the way the official nginx/conf.d/worklenz.conf
# does, without its TLS part (Cloudgate serves HTTPS in front of it): the API,
# sign-in and Socket.IO go to the backend, uploaded files to SeaweedFS, and
# everything else to the frontend.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    set $backend_upstream backend:3000;
    set $frontend_upstream frontend:5000;
    set $storage_upstream seaweedfs:8333;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location ~ ^/(api|secure|public|csrf-token|uploads)(/|$) {
        proxy_pass http://$backend_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_request_buffering off;
    }

    location ~ ^/(socket\.io|socket)/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    location /worklenz-bucket/ {
        proxy_pass http://$storage_upstream;
        proxy_set_header Host $storage_upstream;
    }

    location / {
        proxy_pass http://$frontend_upstream;
    }
}
