services:
  heimdall:
    # LinuxServer.io's image, the Docker install Heimdall's README points to.
    # It runs nginx and PHP, keeps everything (SQLite database, settings,
    # uploaded icons and backgrounds) under /config, and creates the app key
    # and database on the first start.
    image: lscr.io/linuxserver/heimdall:v2.8.4-ls373
    restart: unless-stopped
    # The image's nginx also listens on IPv6 and refuses to start on a server without it.
    # On such a server, drop the IPv6 listen lines before the image's own /init starts.
    entrypoint:
      - sh
      - -c
      - >-
        if [ ! -e /proc/net/if_inet6 ]; then
        sed -i '/listen \[::\]/d' /defaults/nginx/site-confs/default.conf.sample;
        if [ -f /config/nginx/site-confs/default.conf ]; then
        sed -i '/listen \[::\]/d' /config/nginx/site-confs/default.conf; fi; fi;
        exec /init
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TIMEZONE:-Etc/UTC}
      # Overrides APP_URL in /config/www/.env (php-fpm keeps the container's
      # environment), so links and assets use the public https address.
      APP_URL: ${APP_URL}
    volumes:
      - heimdall-config:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  heimdall-config:
