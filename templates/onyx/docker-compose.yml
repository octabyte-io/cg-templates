# From Onyx's deployment/docker_compose/docker-compose.yml at v5.1.2, Community
# Edition. Files are kept in Postgres (FILE_STORE_BACKEND=postgres), so the
# optional S3 object store and legacy MinIO services are left out, as are the
# code interpreter (it needs the host's Docker socket) and the optional MCP
# server for external AI clients.
x-onyx-backend: &onyx-backend
  image: onyxdotapp/onyx-backend:v5.1.2
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-onyx-env: &onyx-env
  AUTH_TYPE: basic
  WEB_DOMAIN: ${WEB_DOMAIN}
  USER_AUTH_SECRET: ${USER_AUTH_SECRET}
  ENCRYPTION_KEY_SECRET: ${ENCRYPTION_KEY_SECRET}
  FILE_STORE_BACKEND: postgres
  POSTGRES_HOST: relational_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  OPENSEARCH_HOST: opensearch
  OPENSEARCH_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD}
  REDIS_HOST: cache
  MODEL_SERVER_HOST: inference_model_server
  INDEXING_MODEL_SERVER_HOST: indexing_model_server
  API_SERVER_PROTOCOL: http
  API_SERVER_HOST: api_server
  ENABLE_CRAFT: "false"

services:
  api_server:
    <<: *onyx-backend
    command: >
      /bin/sh -c "alembic upgrade head &&
      echo \"Starting Onyx Api Server\" &&
      uvicorn onyx.main:app --host 0.0.0.0 --port 8080"
    depends_on:
      relational_db:
        condition: service_healthy
      opensearch:
        condition: service_started
      cache:
        condition: service_started
      inference_model_server:
        condition: service_started
    environment:
      <<: *onyx-env
    volumes:
      - api_server_logs:/var/log/onyx
      - file-system:/app/file-system
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 600s

  background:
    <<: *onyx-backend
    command: /app/scripts/supervisord_entrypoint.sh
    depends_on:
      relational_db:
        condition: service_healthy
      opensearch:
        condition: service_started
      cache:
        condition: service_started
      inference_model_server:
        condition: service_started
      indexing_model_server:
        condition: service_started
    environment:
      <<: *onyx-env
    volumes:
      - background_logs:/var/log/onyx
      - file-system:/app/file-system

  web_server:
    image: onyxdotapp/onyx-web-server:v5.1.2
    restart: unless-stopped
    depends_on:
      - api_server
    environment:
      INTERNAL_URL: http://api_server:8080
      WEB_DOMAIN: ${WEB_DOMAIN}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  inference_model_server:
    image: onyxdotapp/onyx-model-server:v5.1.2
    restart: unless-stopped
    volumes:
      - model_cache_huggingface:/app/.cache/huggingface/
      - inference_model_server_logs:/var/log/onyx
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 600s

  indexing_model_server:
    image: onyxdotapp/onyx-model-server:v5.1.2
    restart: unless-stopped
    environment:
      INDEXING_ONLY: "True"
    volumes:
      - indexing_huggingface_model_cache:/app/.cache/huggingface/
      - indexing_model_server_logs:/var/log/onyx
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 600s

  relational_db:
    image: postgres:15.16-alpine
    restart: unless-stopped
    shm_size: 1g
    command: -c 'max_connections=250'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:3.6.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD}
      OPENSEARCH_JAVA_OPTS: "-Xms2g -Xmx2g"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    # No ulimits or memory lock: some servers refuse to raise them, Docker's default open-file
    # limit is already high, and single-node mode skips OpenSearch's production checks.

  cache:
    image: redis:7.4.7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    tmpfs:
      - /data

  nginx:
    image: nginx:1.25.5-alpine
    restart: unless-stopped
    depends_on:
      api_server:
        condition: service_healthy
      web_server:
        condition: service_healthy
    volumes:
      - ../files/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  db_volume:
  model_cache_huggingface:
  indexing_huggingface_model_cache:
  api_server_logs:
  background_logs:
  inference_model_server_logs:
  indexing_model_server_logs:
  file-system:
  opensearch-data:
