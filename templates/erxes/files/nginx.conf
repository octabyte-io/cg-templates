# The address erxes is reached on, as in erxes' self-hosting guide
# (docs.erxes.io/self-hosting, "Nginx"): the web app at /, the API gateway at
# /gateway/ (with its WebSocket subscriptions). Docker's DNS is asked at request
# time, so nginx starts even while the other containers are still coming up.
server {
    listen 80 default_server;
    client_max_body_size 50M;
    client_header_buffer_size 32k;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ui http://erxes-ui:80;
    set $gateway http://erxes-gateway:80;

    location / {
        proxy_pass $ui;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /gateway/ {
        rewrite ^/gateway/(.*)$ /$1 break;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_redirect off;
        proxy_read_timeout 1h;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
