name: rotki
description: "Self-hosted rotki is a private crypto portfolio tracker that reads your exchanges and wallets and runs profit and loss reports, encrypted on your server."
version: "v1.44.3"
tags:
  - koinly alternative
  - cointracker alternative
  - cointracking alternative
  - crypto portfolio tracker
  - crypto tax software
  - self-hosted portfolio tracker
  - crypto profit and loss
links:
  website: https://rotki.com
  docs: https://docs.rotki.com
  source: https://github.com/rotki/rotki
cloudgate: "0.3.11"
compose: app
size: small
inputs:
  # The password the sign-in prompt in front of rotki asks for (username: admin).
  ADMIN_PASSWORD: { generate: password }
  # Turns on rotki's own session sign-in for its API; keep it stable.
  ROTKI_SESSION_KEY: { generate: hex }
signIn:
  firstVisit:
    path: /
    note: "Sign in to the browser's prompt as admin with the generated ADMIN_PASSWORD, then click Create account and choose the password that encrypts your data."
domains:
  - { service: proxy, port: 80 }
files:
  - { path: Caddyfile.txt }
