name: WuzAPI
description: "Self-hosted WuzAPI: a light, open-source REST API to send and receive WhatsApp messages from your own code. Unofficial; WhatsApp can ban numbers."
version: "1.1.1"
tags: [whatsapp api, whatsapp rest api, whatsapp business api alternative, self-hosted whatsapp api, whatsapp webhook, whatsmeow api, waha alternative]
links:
  docs: https://github.com/asternic/wuzapi/blob/main/API.md
  source: https://github.com/asternic/wuzapi
cloudgate: "0.3.11"
compose: app
size: small
inputs:
  # Signs in to the dashboard (/dashboard) and authorizes the /admin API.
  WUZAPI_ADMIN_TOKEN: { generate: hex }
  # AES-256 key for stored secrets: must be exactly 32 characters; a
  # generated password is 32 letters and digits.
  WUZAPI_GLOBAL_ENCRYPTION_KEY: { generate: password }
  # Signs webhook payloads (x-hmac-signature); at least 32 characters.
  WUZAPI_GLOBAL_HMAC_KEY: { generate: hex }
  DB_PASSWORD: { generate: password }
signIn:
  password: WUZAPI_ADMIN_TOKEN
  path: /dashboard
domains:
  - { service: wuzapi, port: 8080 }
