services:
  wuzapi:
    image: asternic/wuzapi:1.1.1
    restart: unless-stopped
    depends_on:
      wuzapi-db:
        condition: service_healthy
    environment:
      # The admin token signs in to the dashboard (/dashboard) and the /admin
      # API, where you create one user (with its own token) per WhatsApp number.
      WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN}
      WUZAPI_GLOBAL_ENCRYPTION_KEY: ${WUZAPI_GLOBAL_ENCRYPTION_KEY}
      WUZAPI_GLOBAL_HMAC_KEY: ${WUZAPI_GLOBAL_HMAC_KEY}
      DB_USER: wuzapi
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: wuzapi
      DB_HOST: wuzapi-db
      DB_PORT: "5432"
      DB_SSLMODE: "false"
      TZ: UTC
      WEBHOOK_FORMAT: json
      SESSION_DEVICE_NAME: WuzAPI
    volumes:
      # Media downloaded from messages, per user.
      - wuzapi-files:/app/files
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  wuzapi-db:
    image: postgres:16.16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wuzapi
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: wuzapi
    volumes:
      - wuzapi-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wuzapi -d wuzapi"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  wuzapi-files:
  wuzapi-db-data:
