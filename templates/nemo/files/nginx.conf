# The web server in front of NEMO, as in NEMO's Docker Compose guide: it serves
# NEMO's static files and passes everything else to NEMO (Gunicorn on port 8000).
# HTTPS and the public address are handled by Cloudgate in front of it.
worker_processes auto;
pid /tmp/nginx.pid;
events {}

http {
	server_tokens off;
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	client_max_body_size 50m;

	server {
		listen 80;

		location / {
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header Connection "";
			proxy_http_version 1.1;
			proxy_read_timeout 300s;
			proxy_pass http://nemo-app:8000;
		}

		location = /favicon.ico { alias /nemo/static/favicon.ico; }
		location /static/ { alias /nemo/static/; expires 7d; }
	}
}
