# Publishes the site to GitHub Pages.
# Pages is not enabled yet, so this runs only by hand (Actions > Deploy > Run workflow).
# Once it is, add `push: branches: [main]` under `on:`.
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Where the site is served. Set the repository variables SITE_URL and
      # BASE_PATH for a custom domain (e.g. https://templates.example.com and /).
      SITE_URL: ${{ vars.SITE_URL || 'https://octabyte-io.github.io' }}
      BASE_PATH: ${{ vars.BASE_PATH || '/cg-templates' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so each app page's "Last updated" date comes from git.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install fonts for share images
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter fonts-liberation

      - uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: site
        run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
