name: Outline
description: "A fast, tidy wiki where your team writes and finds its documents."
version: "0.86.1"
tags: [wiki, knowledge-base, collaboration]
links:
  website: https://www.getoutline.com
  docs: https://docs.getoutline.com/s/hosting
  source: https://github.com/outline/outline
cloudgate: 0.1.0
inputs:
  URL: { value: "{{domains.app.url}}" }
  SECRET_KEY: { generate: hex }
  UTILS_SECRET: { generate: hex }
  PGSSLMODE: { value: disable }
  FILE_STORAGE: { value: s3 }
  OIDC_CLIENT_ID:
    ask:
      label: OIDC client ID
      description: The client ID of the app you registered for Outline in your identity provider.
  OIDC_CLIENT_SECRET:
    ask:
      label: OIDC client secret
      secret: true
  OIDC_AUTH_URI:
    ask:
      label: Authorization URL
      description: Your provider's authorization endpoint, e.g. https://auth.example.com/application/o/authorize/
      format: url
  OIDC_TOKEN_URI:
    ask:
      label: Token URL
      format: url
  OIDC_USERINFO_URI:
    ask:
      label: User info URL
      format: url
  OIDC_DISPLAY_NAME:
    ask:
      label: Sign-in button text
      description: Shown on Outline's sign-in page as "Continue with …".
      default: Single sign-on
      required: false
