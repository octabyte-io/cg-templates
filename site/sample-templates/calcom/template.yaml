name: Cal.com
description: "Let clients book time with you from a link, synced to your calendar."
version: "6.2.0"
tags: [scheduling, booking, calendar]
links:
  website: https://cal.com
  docs: https://cal.com/docs/self-hosting/installation
  source: https://github.com/calcom/cal.com
cloudgate: 0.1.0
inputs:
  NEXT_PUBLIC_WEBAPP_URL: { value: "{{domains.app.url}}" }
  NEXTAUTH_URL: { value: "{{domains.app.url}}/api/auth" }
  NEXTAUTH_SECRET: { generate: base64 }
  CALENDSO_ENCRYPTION_KEY: { generate: password }
  CALCOM_TELEMETRY_DISABLED: { value: "1" }
