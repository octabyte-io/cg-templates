services:
  ghost:
    image: ghost:6.0-alpine
    restart: unless-stopped
    depends_on:
      ghost-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      database__connection__password: ${DB_PASSWORD}
      mail__from: ${ADMIN_EMAIL}
    volumes:
      - ghost-content:/var/lib/ghost/content
      - ../files/config.production.json:/var/lib/ghost/config.production.json:ro

  ghost-db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ghost-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ghost-content:
  ghost-db-data:
