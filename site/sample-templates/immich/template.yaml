name: Immich
description: "Back up phone photos and videos automatically, then browse by face or place."
version: "3.3.1"
tags: [photos, videos, backup]
links:
  website: https://immich.app
  docs: https://docs.immich.app
  source: https://github.com/immich-app/immich
cloudgate: 0.1.0
compose: app
size: large
inputs:
  DB_PASSWORD: { generate: password }
  TIMEZONE:
    ask:
      label: Time zone
      description: Used to show when photos were taken, as an IANA name such as Europe/Berlin.
      default: Etc/UTC
      required: false
domains:
  - { service: immich-server, port: 2283 }
