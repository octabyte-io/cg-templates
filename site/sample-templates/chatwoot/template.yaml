name: Chatwoot
description: "Answer customers from chat, email and social in one shared inbox."
version: "4.19.1"
tags: [customer-support, live-chat, helpdesk]
links:
  website: https://www.chatwoot.com
  docs: https://www.chatwoot.com/docs/self-hosted
  source: https://github.com/chatwoot/chatwoot
cloudgate: 0.1.0
compose: app
size: medium
inputs:
  FRONTEND_URL: { value: "{{domains.chatwoot.url}}" }
  SECRET_KEY_BASE: { generate: hex }
  POSTGRES_PASSWORD: { generate: password }
  REDIS_PASSWORD: { generate: password }
domains:
  - { service: chatwoot, port: 3000 }
