version: 1
services:
  app:
    kind: web
    description: Gitea's web interface, API and Git over HTTPS.
    source: { image: "gitea/gitea:1.24.6" }
    port: 3000
    env:
      - GITEA__database__DB_TYPE
      - GITEA__database__HOST: db.host
      - GITEA__database__NAME: db.database
      - GITEA__database__USER: db.user
      - GITEA__database__PASSWD: db.password
      - GITEA__server__ROOT_URL
      - GITEA__server__DOMAIN
      - GITEA__server__DISABLE_SSH
      - GITEA__security__INSTALL_LOCK
      - GITEA__security__SECRET_KEY
      - GITEA__service__DISABLE_REGISTRATION
  db:
    kind: postgres
    version: "16"
    database: gitea
