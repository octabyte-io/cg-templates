version: 1
services:
  app:
    kind: web
    description: Outline's editor, API and real-time collaboration.
    source: { image: "outlinewiki/outline:0.86.1" }
    port: 3000
    env:
      - URL
      - SECRET_KEY
      - UTILS_SECRET
      - DATABASE_URL: db.url
      - PGSSLMODE
      - REDIS_URL: cache.url
      - FILE_STORAGE
      - AWS_S3_UPLOAD_BUCKET_NAME: uploads.name
      - AWS_S3_UPLOAD_BUCKET_URL: uploads.endpoint
      - AWS_REGION: uploads.region
      - AWS_ACCESS_KEY_ID: uploads.access_key_id
      - AWS_SECRET_ACCESS_KEY: uploads.secret_access_key
      - AWS_S3_FORCE_PATH_STYLE: uploads.path_style
      - OIDC_CLIENT_ID
      - OIDC_CLIENT_SECRET
      - OIDC_AUTH_URI
      - OIDC_TOKEN_URI
      - OIDC_USERINFO_URI
      - OIDC_DISPLAY_NAME
  db:
    kind: postgres
    version: "16"
    database: outline
  cache:
    kind: redis
    version: "7"
  uploads:
    kind: bucket
    description: Images and files attached to documents.
