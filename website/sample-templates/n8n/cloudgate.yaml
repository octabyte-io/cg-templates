version: 1
services:
  app:
    kind: web
    description: The n8n editor, API and webhook receiver.
    source: { image: "n8nio/n8n:1.110.1" }
    port: 5678
    env:
      - DB_TYPE
      - DB_POSTGRESDB_HOST: db.host
      - DB_POSTGRESDB_PORT: db.port
      - DB_POSTGRESDB_DATABASE: db.database
      - DB_POSTGRESDB_USER: db.user
      - DB_POSTGRESDB_PASSWORD: db.password
      - N8N_HOST
      - N8N_PROTOCOL
      - N8N_PROXY_HOPS
      - N8N_RUNNERS_ENABLED
      - WEBHOOK_URL
      - N8N_ENCRYPTION_KEY
      - GENERIC_TIMEZONE
  db:
    kind: postgres
    version: "16"
