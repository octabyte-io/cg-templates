name: listmonk
description: A fast newsletter and mailing list manager in a single binary, with subscriber lists, templates, campaigns, analytics and a transactional email API.
version: "5.1.0"
tags: [newsletter, email]
links:
  website: https://listmonk.app
  docs: https://listmonk.app/docs/
  source: https://github.com/knadh/listmonk
cloudgate: 0.1.0
compose: app
size: small
inputs:
  POSTGRES_PASSWORD: { generate: password }
  ADMIN_USER:
    ask:
      label: Admin username
      default: admin
      pattern: "[a-z][a-z0-9_-]{2,31}"
  ADMIN_PASSWORD: { generate: password }
  TIMEZONE:
    ask:
      label: Time zone
      description: Used for scheduled campaigns, as an IANA name such as Europe/Berlin.
      default: Etc/UTC
      required: false
domains:
  - { service: listmonk, port: 9000 }
