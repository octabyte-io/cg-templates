name: Gitea
description: A lightweight Git service with repositories, pull requests, issues, a package registry and Actions-compatible CI.
version: "1.24.6"
tags: [git, devtools]
links:
  website: https://about.gitea.com
  docs: https://docs.gitea.com
  source: https://github.com/go-gitea/gitea
cloudgate: 0.1.0
inputs:
  GITEA__database__DB_TYPE: { value: postgres }
  GITEA__server__ROOT_URL: { value: "{{domains.app.url}}/" }
  GITEA__server__DOMAIN: { value: "{{domains.app.host}}" }
  GITEA__server__DISABLE_SSH: { value: "true" }
  GITEA__security__INSTALL_LOCK: { value: "true" }
  GITEA__security__SECRET_KEY: { generate: hex }
  GITEA__service__DISABLE_REGISTRATION:
    ask:
      label: Turn off open sign-up
      description: >-
        "true" lets only the admin create accounts, after the first one is made.
        "false" lets anyone who can reach the Domain register.
      default: "false"
      pattern: "true|false"
